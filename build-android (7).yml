                   */
                  @JavascriptInterface
                  public boolean setFeed(String url) {
                      if (url == null || url.trim().isEmpty()) {
                          prefs.edit().remove("spot_host").apply();
                          return true;
                      }
                      try {
                          URL u = new URL(url.trim());
                          if (!"https".equals(u.getProtocol()) || !u.getHost().endsWith(".workers.dev") || u.getHost().length() > 100) return false;
                          prefs.edit().putString("spot_host", u.getHost().toLowerCase(java.util.Locale.ROOT)).apply();
                          return true;
                      } catch (Exception e) {
                          return false;
                      }
