                          return getPackageManager().getPackageInfo(getPackageName(), 0).versionName;
                      } catch (Exception e) {
                          return "";
                      }
                  }

                  @JavascriptInterface
                  public void fetch(final String id, final String url, final boolean withKey) {
                      new Thread(() -> {
                          int code = 0;
                          String body = "";
                          HttpURLConnection conn = null;
                          try {
                              URL u = new URL(url);
                              // LTA, Google News, and your own spotter feed (only the one you saved).
                              String host = u.getHost().toLowerCase(java.util.Locale.ROOT);
                              boolean allowed = ALLOWED_HOSTS.contains(host) || host.equals(spotHost());
                              if (!"https".equals(u.getProtocol()) || !allowed) {
                                  throw new SecurityException("Host not allowed");
                              }
