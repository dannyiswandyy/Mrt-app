            <footer>
              <p><b>How this works.</b> Train positions are estimated from typical timetables: first and last trains, peak and off-peak frequencies, and average travel time between stations. This is the same schedule-based method journey planners use when live positions aren't published. Train positions don't reflect delays.</p>
              <p><b>Sources.</b> Disruption notices: Land Transport Authority (LTA), datamall.lta.gov.sg. News: Google News (news.google.com), with each outlet named on its headline. Social media links: SMRT on X (@SMRT_Singapore) and Facebook (SMRTCorpSG), SBS Transit on X (@SBSTransit_Ltd) and Facebook (SBSTransit), LTA on X (@LTAsg). Set numbers: logged by spotters in the MRT Tracker app. Train models: SGTrains (sgtrains.com). Map: station locations and track shapes from SG Rail Data by Lim Chee Aun (github.com/cheeaun/sgraildata), based on data.gov.sg and LTA data.</p>
              <p>Tap any station for the next three trains in each direction. Peak hours are 7–9.30am and 5–8pm on weekdays. LRT loops show one lane for each direction round the loop.</p>
            </footer>
