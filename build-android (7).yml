          <div class="wrap">
            <header>
              <div class="top">
                <h1>MRT Train Tracker</h1>
                <div class="clock"><span id="clock">--:--:--</span><small><span class="live"></span>Live estimate · SGT</small></div>
              </div>
              <div class="views" role="tablist" aria-label="Views">
                <button type="button" role="tab" id="vTrains" aria-selected="true">Trains</button>
                <button type="button" role="tab" id="vUpdates" aria-selected="false">Updates <span class="badge" id="vBadge" hidden></span></button>
              </div>
              <div class="tabs" id="tabs" role="tablist" aria-label="MRT lines"></div>
              <div class="search">
                <input id="find" list="stations" placeholder="Find a station, e.g. Bishan" autocomplete="off" aria-label="Find a station">
                <datalist id="stations"></datalist>
              </div>
            </header>

            <div id="alertBanner"></div>

            <main id="viewTrains">
            <div class="tview" role="tablist" aria-label="Train view">
              <button type="button" role="tab" id="tvMap" aria-selected="true">Map</button>
              <button type="button" role="tab" id="tvLine" aria-selected="false">Line</button>
            </div>
            <section id="mapView">
              <div class="mapwrap" id="mapWrap">
                <canvas id="mapCv" aria-label="Map of all MRT and LRT lines with estimated train positions"></canvas>
                <div class="mapcount" id="mapCount"></div>
                <div class="mapctl"><button type="button" id="mapIn" aria-label="Zoom in">+</button><button type="button" id="mapOut" aria-label="Zoom out">−</button><button type="button" id="mapReset" aria-label="Show whole network">⤢</button></div>
              </div>
              <div class="mapinfo" id="mapInfo"></div>
            </section>
            <div id="lineView" hidden>
            <section class="status" id="status"></section>
            <section class="fleet" id="fleet"></section>
            <section class="fleet" id="spotLine" hidden></section>
            <div id="notice"></div>
            <div id="trainInfo"><p class="hint">Tap a train to see where it's heading.</p></div>

            <div class="legend"><span id="lgA">↓ Lane 1</span><span id="lgB">Lane 2 ↑</span></div>
            <div class="board" id="board"></div>
            </div>
            </main>

            <main id="viewUpdates" hidden>
              <div class="upd">
                <section class="card" id="officialCard"></section>
                <section class="card" id="spotCard">
                  <h2>Log a train</h2>
                  <form id="spotForm" class="sform" novalidate>
                    <label for="fLine">Line</label><select id="fLine"></select>
                    <label for="fSet">Set number</label><input id="fSet" type="text" placeholder="e.g. 561 or 3201/3202" autocomplete="off" spellcheck="false" autocapitalize="characters">
                    <label for="fModel">Train type</label><select id="fModel"></select>
                    <label for="fStation">Station</label><select id="fStation"></select>
                    <label for="fTo">Direction</label><select id="fTo"></select>
                    <label for="fName">Your name</label><input id="fName" type="text" maxlength="24" placeholder="Optional, shown with your sightings" autocomplete="nickname">
                    <span></span><div class="sgo"><button class="btn" id="fGo" type="submit">Log train</button><span class="muted" id="fMsg"></span></div>
                  </form>
                  <div id="spotList" class="slist"></div>
                </section>
                <section class="card">
                  <h2>News reports</h2>
                  <p class="muted" id="newsNote">News about Singapore's MRT, LRT and rail from the past week.</p>
                  <ul class="news" id="newsList" style="margin-top:10px"></ul>
                </section>
                <section class="card">
                  <h2>Official channels</h2>
                  <p class="muted" style="margin-bottom:10px">SMRT, SBS Transit and LTA post service updates on these accounts. Opens in the X or Facebook app, or your browser.</p>
                  <div class="links">
                    <a href="https://x.com/SMRT_Singapore" target="_blank" rel="noopener">SMRT on X<span>NSL, EWL, CCL, TEL, Bukit Panjang LRT</span></a>
                    <a href="https://x.com/SBSTransit_Ltd" target="_blank" rel="noopener">SBS Transit on X<span>NEL, DTL, Sengkang–Punggol LRT</span></a>
