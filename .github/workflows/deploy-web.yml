# MRT Tracker website: publishes the web/ folder to GitHub Pages.
# One-time setup: repository Settings → Pages → Build and deployment → Source: "GitHub Actions".
# The site's LTA data goes through the relay in worker/ (see worker/README.md); no key is ever put in the site.
name: Deploy MRT Tracker website

on:
  push:
    branches: [main]
    paths: ['web/**', 'tools/**', 'tests/**', '.github/workflows/deploy-web.yml']
  workflow_dispatch:
  # after each app release: the site then shows that app version (What's new, Settings)
  workflow_run:
    workflows: ["Build MRT Tracker app"]
    types: [completed]
  # Rebuild the published LTA GTFS timetable every hour (at minute 17 UTC).
  # GitHub scheduled jobs may start late; keep the last good schedule if LTA is unavailable.
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: read
  actions: read     # What's new: past app builds' versions, if the app build hasn't saved them yet
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # The build machine is Windows: make Python read, write and print UTF-8 instead of the Windows code page,
  # which stopped the timetable, buildings, tracks and exits tools with UnicodeEncodeError.
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

defaults:
  run:
    shell: bash

jobs:
  prepare:
    needs: safety
    runs-on: [self-hosted, Windows, X64]
    steps:
      - name: Select verified Git for Windows Bash (not WSL)
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TOOL_CACHE 'MRT-PortableGit'
          $installed = Join-Path $env:ProgramFiles 'Git'
          if (Test-Path (Join-Path $installed 'bin\bash.exe')) { $root = $installed }
          if (!(Test-Path (Join-Path $root 'bin\bash.exe'))) {
            $release = Invoke-RestMethod 'https://api.github.com/repos/git-for-windows/git/releases/latest'
            $asset = $release.assets | Where-Object { $_.name -match '^PortableGit-.*-64-bit\.7z\.exe$' } | Select-Object -First 1
            if (!$asset -or $asset.digest -notmatch '^sha256:[a-fA-F0-9]{64}$') { throw 'Official PortableGit checksum unavailable' }
            $installer = Join-Path $env:RUNNER_TEMP $asset.name
            Invoke-WebRequest -UseBasicParsing $asset.browser_download_url -OutFile $installer
            if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne $asset.digest.Substring(7)) { throw 'Git download checksum mismatch' }
            New-Item -ItemType Directory -Force -Path $root | Out-Null
            $proc = Start-Process -FilePath $installer -ArgumentList @('-y', ('-o"' + $root + '"')) -Wait -PassThru
            if ($proc.ExitCode -ne 0) { throw "Portable Git extraction failed: $($proc.ExitCode)" }
            Remove-Item $installer
          }
          if (!(Test-Path (Join-Path $root 'bin\bash.exe'))) { throw 'Git Bash missing' }
          @((Join-Path $root 'cmd'), (Join-Path $root 'usr\bin'), (Join-Path $root 'bin')) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $root 'bin\bash.exe') --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Bash resolves to Git for Windows
        run: |
          case "$(uname -s)" in
            MINGW*|MSYS*|CYGWIN*) echo "Using native Windows Git Bash" ;;
            *) echo "::error::Expected Git for Windows Bash"; exit 1 ;;
          esac
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0    # What's new is made from the whole history

      - name: Set up portable Python 3.12 (no MSI installer)
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TOOL_CACHE 'MRT-Python-3.12.10'
          $py = Join-Path $root 'tools\python.exe'
          if (!(Test-Path $py)) {
            $zip = Join-Path $env:RUNNER_TEMP 'python.3.12.10.zip'
            Invoke-WebRequest -UseBasicParsing 'https://api.nuget.org/v3-flatcontainer/python/3.12.10/python.3.12.10.nupkg' -OutFile $zip
            $expected = '0EB85C2DFCCCCF1B17352DE4C397F69194035B7D37149EACC16F1147D93DE3B8'
            if ((Get-FileHash $zip -Algorithm SHA256).Hash -ne $expected) { throw 'Python 3.12.10 checksum mismatch' }
            $stage = Join-Path $env:RUNNER_TEMP 'python-3.12.10-stage'
            if (Test-Path $stage) { Remove-Item -Recurse -Force $stage }
            Expand-Archive -Path $zip -DestinationPath $stage -Force
            if (Test-Path $root) { Remove-Item -Recurse -Force $root }
            Move-Item -Path $stage -Destination $root
            Remove-Item -Force $zip
          }
          if (!(Test-Path $py)) { throw 'Portable Python 3.12.10 missing after extraction' }
          $py3 = Join-Path $root 'tools\python3.exe'
          if (!(Test-Path $py3)) { Copy-Item -Path $py -Destination $py3 -Force }
          $utf8NoBom = New-Object System.Text.UTF8Encoding($false)
          [System.IO.File]::AppendAllLines($env:GITHUB_PATH, [string[]]@((Join-Path $root 'tools'), (Join-Path $root 'tools\Scripts')), $utf8NoBom)
          & $py3 --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Prepare the site
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          rm -rf _site
          mkdir -p _site
          cp -R web/. _site/
          rm -rf _site/tools
          mkdir -p _site/data
          # What's new: every app version's changes, and the website's own since the newest app build ("Latest").
          # Read only: the app build saves each version (refs/notes/versions); this only reads them.
          git fetch -q origin "+refs/notes/versions:refs/notes/versions" || true
          BACKFILL=""; git notes --ref=versions list | grep -q . || BACKFILL="--backfill build-android.yml"
          python3 tools/build_changelog.py --paths web tools .github/workflows/build-android.yml --public \
            --overrides tools/changelog-overrides.json $BACKFILL --out _site/changelog.js \
            || echo "::warning::What's new couldn't be made; the site says the list comes with the next version"

      # The timetable, buildings and RTS Link / Sentosa Express tracks are made the same way the normal app
      # build makes them, from the tools in build-android.yml (read only; that workflow isn't changed or run).
      # If any can't be made, the site still works: estimated train times, no buildings, and those two lines stay straight.
      - name: Get the app's data tools
        id: tools
        continue-on-error: true
        run: |
          python3 -c "import yaml" 2>/dev/null || python3 -m pip install --quiet pyyaml
          python3 - <<'PY'
          import os, yaml
          wf = yaml.safe_load(open(".github/workflows/build-android.yml", encoding="utf-8"))
          steps = wf["jobs"]["build"]["steps"]
          run = next(s["run"] for s in steps if s.get("name") == "Write the app project")
          out = os.path.join(os.environ.get("RUNNER_TEMP", "."), "write_app.sh")
          open(out, "w", encoding="utf-8", newline="\n").write(run)
          PY
          bash -e "$RUNNER_TEMP/write_app.sh"

      - name: Train timetable (LTA GTFS)
        if: steps.tools.outcome == 'success'
        continue-on-error: true
        run: |
          python3 mrt-tracker-app/tools/build_timetable.py mrt-tracker-app data/lta-timetable.json
          if [ -f mrt-tracker-app/app/src/main/assets/timetable.json ]; then cp mrt-tracker-app/app/src/main/assets/timetable.json _site/data/timetable.json; fi

      - name: Restore saved buildings
        if: steps.tools.outcome == 'success'
        uses: actions/cache/restore@v4
        with:
          path: osm-cache
          key: osm-buildings-v1-${{ github.run_id }}
          restore-keys: osm-buildings-v1-

      - name: Buildings (OpenStreetMap)
        if: steps.tools.outcome == 'success'
        continue-on-error: true
        run: |
          # start from the full copy kept in the repository (data/osm-buildings.json, made by "Refresh 3D buildings")
          if [ -s data/osm-buildings.json ] && [ ! -s osm-cache/buildings.json ]; then mkdir -p osm-cache && cp data/osm-buildings.json osm-cache/buildings.json; fi
          python3 mrt-tracker-app/tools/build_buildings.py mrt-tracker-app osm-cache
          if [ -f mrt-tracker-app/app/src/main/assets/buildings.json ]; then cp mrt-tracker-app/app/src/main/assets/buildings.json _site/data/buildings.json; fi

      - name: RTS Link and Sentosa Express tracks (OpenStreetMap)
        if: steps.tools.outcome == 'success'
        continue-on-error: true
        run: |
          if [ -f mrt-tracker-app/tools/build_tracks.py ]; then
            python3 mrt-tracker-app/tools/build_tracks.py mrt-tracker-app osm-cache
            if [ -f mrt-tracker-app/app/src/main/assets/tracks.json ]; then cp mrt-tracker-app/app/src/main/assets/tracks.json _site/data/tracks.json; fi
          fi

      - name: Apply URA rail geometry
        if: steps.tools.outcome == 'success'
        continue-on-error: true
        run: |
          if [ -f mrt-tracker-app/tools/build_ura_rail.py ]; then
            python3 mrt-tracker-app/tools/build_ura_rail.py mrt-tracker-app osm-cache
            if [ -f mrt-tracker-app/app/src/main/assets/tracks.json ]; then cp mrt-tracker-app/app/src/main/assets/tracks.json _site/data/tracks.json; fi
          fi

      - name: Refine LRT geometry with OneMap
        if: steps.tools.outcome == 'success'
        continue-on-error: true
        env:
          ONEMAP_EMAIL: ${{ secrets.ONEMAP_EMAIL }}
          ONEMAP_PASSWORD: ${{ secrets.ONEMAP_PASSWORD }}
        run: |
          if [ -f mrt-tracker-app/tools/build_onemap_rail.py ]; then
            python3 mrt-tracker-app/tools/build_onemap_rail.py mrt-tracker-app
            if [ -f mrt-tracker-app/app/src/main/assets/tracks.json ]; then cp mrt-tracker-app/app/src/main/assets/tracks.json _site/data/tracks.json; fi
          fi

      - name: Station exits (LTA) and nearby places (OpenStreetMap)
        if: steps.tools.outcome == 'success'
        continue-on-error: true
        env:
          DATA_GOV_SG_API_KEY: ${{ secrets.DATA_GOV_SG_API_KEY }}
        run: |
          if [ -f mrt-tracker-app/tools/build_exits.py ]; then
            python3 mrt-tracker-app/tools/build_exits.py mrt-tracker-app osm-cache
            if [ -f mrt-tracker-app/app/src/main/assets/exits.json ]; then cp mrt-tracker-app/app/src/main/assets/exits.json _site/data/exits.json; fi
          fi

      - name: Save buildings for next time
        if: hashFiles('osm-fresh') != ''
        uses: actions/cache/save@v4
        with:
          path: osm-cache
          key: osm-buildings-v1-${{ github.run_id }}

      - name: Check the site
        run: |
          # an empty file when there's no data: the site then uses estimates / no buildings, without a "not found"
          for f in timetable buildings tracks exits; do [ -s _site/data/$f.json ] || : > _site/data/$f.json; done
          ls -la _site _site/data
          if grep -rlE 'sha256[-]|integ[r]ity=' _site --include='*.html' --include='*.js'; then echo "::error::fingerprints found"; exit 1; fi
          grep -q "script-src 'self' 'unsafe-inline'" _site/index.html
          grep -q 'id="mrt-main"' _site/index.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
  deploy:
    needs: prepare
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # Runs before anything is published. If the page has a script error, doesn't start or freezes,
  # the build/deploy stops here and the app, the website and the release stay on the last good version.
  safety:
    name: Safety check (page starts, no freeze)
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 10
    steps:
      - name: Select verified Git for Windows Bash (not WSL)
        shell: powershell -NoProfile -NonInteractive -ExecutionPolicy Bypass -File {0}
        run: |
          $ErrorActionPreference = 'Stop'
          $root = Join-Path $env:RUNNER_TOOL_CACHE 'MRT-PortableGit'
          $installed = Join-Path $env:ProgramFiles 'Git'
          if (Test-Path (Join-Path $installed 'bin\bash.exe')) { $root = $installed }
          if (!(Test-Path (Join-Path $root 'bin\bash.exe'))) {
            $release = Invoke-RestMethod 'https://api.github.com/repos/git-for-windows/git/releases/latest'
            $asset = $release.assets | Where-Object { $_.name -match '^PortableGit-.*-64-bit\.7z\.exe$' } | Select-Object -First 1
            if (!$asset -or $asset.digest -notmatch '^sha256:[a-fA-F0-9]{64}$') { throw 'Official PortableGit checksum unavailable' }
            $installer = Join-Path $env:RUNNER_TEMP $asset.name
            Invoke-WebRequest -UseBasicParsing $asset.browser_download_url -OutFile $installer
            if ((Get-FileHash $installer -Algorithm SHA256).Hash -ne $asset.digest.Substring(7)) { throw 'Git download checksum mismatch' }
            New-Item -ItemType Directory -Force -Path $root | Out-Null
            $proc = Start-Process -FilePath $installer -ArgumentList @('-y', ('-o"' + $root + '"')) -Wait -PassThru
            if ($proc.ExitCode -ne 0) { throw "Portable Git extraction failed: $($proc.ExitCode)" }
            Remove-Item $installer
          }
          if (!(Test-Path (Join-Path $root 'bin\bash.exe'))) { throw 'Git Bash missing' }
          @((Join-Path $root 'cmd'), (Join-Path $root 'usr\bin'), (Join-Path $root 'bin')) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          & (Join-Path $root 'bin\bash.exe') --version
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify Bash resolves to Git for Windows
        run: |
          case "$(uname -s)" in
            MINGW*|MSYS*|CYGWIN*) echo "Using native Windows Git Bash" ;;
            *) echo "::error::Expected Git for Windows Bash"; exit 1 ;;
          esac
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Scripts have no syntax errors
        run: node tests/syntax-check.mjs
      - name: Timetable checks
        run: |
          node tests/timetable-check.js
          node --test tests/future-lines.test.mjs
          node --test tests/dwell-sync.test.mjs
      - name: Page starts and doesn't freeze (headless Chrome)
        run: |
          npm install --no-save --no-package-lock --silent playwright@1.49.1
          npx playwright install chromium
          node tests/page-starts.mjs
