      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create a signing key on the first run
        run: |
          mkdir -p signing
          if [ ! -f signing/mrt-tracker.jks ]; then
            keytool -genkeypair -v -keystore signing/mrt-tracker.jks -alias mrttracker \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass mrttracker -keypass mrttracker -dname "CN=MRT Tracker"
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add signing/mrt-tracker.jks
            git commit -m "Add app signing key [skip ci]"
            git push
          fi

      - name: Build the app
        run: |
          gradle -p mrt-tracker-app assembleRelease -Pvc=${{ github.run_number }} -Pks="$GITHUB_WORKSPACE/signing/mrt-tracker.jks"
          cp mrt-tracker-app/app/build/outputs/apk/release/app-release.apk mrt-tracker.apk

      - uses: actions/upload-artifact@v4
        with:
          name: mrt-tracker-apk
          path: mrt-tracker.apk

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest mrt-tracker.apk --title "MRT Tracker (build ${{ github.run_number }})" \
            --notes "Download mrt-tracker.apk on your Android phone and open it to install."
