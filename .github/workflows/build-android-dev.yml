                                  root.put("computeAlternativeRoutes", false); JSONObject pref = new JSONObject(); org.json.JSONArray modes = new org.json.JSONArray();
                                  modes.put("SUBWAY").put("TRAIN").put("LIGHT_RAIL").put("RAIL"); pref.put("allowedTravelModes", modes); pref.put("routingPreference", "FEWER_TRANSFERS"); root.put("transitPreferences", pref);
                                  byte[] out = root.toString().getBytes(StandardCharsets.UTF_8); conn = (HttpURLConnection) new URL("https://routes.googleapis.com/directions/v2:computeRoutes").openConnection();
                                  conn.setRequestMethod("POST"); conn.setConnectTimeout(10000); conn.setReadTimeout(15000); conn.setDoOutput(true); conn.setRequestProperty("Content-Type", "application/json"); conn.setRequestProperty("X-Goog-Api-Key", key); conn.setRequestProperty("X-Goog-FieldMask", "routes.legs.steps.transitDetails"); conn.setFixedLengthStreamingMode(out.length);
                                  try (java.io.OutputStream os = conn.getOutputStream()) { os.write(out); } code = conn.getResponseCode(); InputStream in = code >= 400 ? conn.getErrorStream() : conn.getInputStream(); body = in == null ? "" : readAll(in);
