                                  root.put("origin", new JSONObject().put("address", origin + " MRT Station, Singapore"));
                                  root.put("destination", new JSONObject().put("address", destination + " MRT Station, Singapore"));
                                  root.put("travelMode", "TRANSIT"); if (departureTime != null && departureTime.endsWith("Z")) root.put("departureTime", departureTime);
                                  root.put("computeAlternativeRoutes", false); JSONObject pref = new JSONObject(); org.json.JSONArray modes = new org.json.JSONArray();
