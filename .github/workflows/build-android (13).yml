          package sg.mrttracker.app;

          import android.graphics.Bitmap;
          import android.graphics.BitmapFactory;
          import android.graphics.Canvas;
          import android.graphics.Matrix;
          import android.graphics.Paint;
          import android.graphics.PointF;
          import android.graphics.Rect;
          import android.media.ExifInterface;
          import android.media.FaceDetector;
          import android.util.Base64;

          import org.json.JSONObject;

          import java.io.ByteArrayOutputStream;
          import java.io.File;
          import java.io.IOException;
          import java.util.ArrayList;
          import java.util.List;

          /**
           * The spotting photo waiting to be posted. Made safe before anyone else can see it:
           *  - shrunk to at most 1280 pixels and saved as a fresh JPEG, which drops the hidden details
           *    the camera adds (location, phone model, time);
           *  - faces the phone can find are blurred automatically, and the player can tap to blur more
           *    (other faces, car plates, anything else).
           */
          final class GamePhoto {

              static final long MAX_AGE_MS = 25 * 60 * 1000L;      // the server accepts photos up to 30 minutes old
              private static final int FULL = 1280, PREVIEW = 720, THUMB = 480;

              private static Bitmap base;                          // the photo with faces blurred
              private static final List<float[]> marks = new ArrayList<>();   // spots the player tapped to blur
              private static long taken;
              private static int faces;

              private GamePhoto() {
              }

              /** Loads a new photo from the camera's file. Returns the preview for the page. */
              static synchronized JSONObject load(File f, long when) throws IOException {
                  clear();
                  BitmapFactory.Options o = new BitmapFactory.Options();
                  o.inJustDecodeBounds = true;
                  BitmapFactory.decodeFile(f.getAbsolutePath(), o);
                  if (o.outWidth <= 0 || o.outHeight <= 0) throw new IOException("That photo couldn't be opened.");
                  int sample = 1;
                  while (Math.max(o.outWidth, o.outHeight) / (sample * 2) >= FULL) sample *= 2;
                  BitmapFactory.Options d = new BitmapFactory.Options();
                  d.inSampleSize = sample;
                  Bitmap b = BitmapFactory.decodeFile(f.getAbsolutePath(), d);
                  if (b == null) throw new IOException("That photo couldn't be opened.");

                  // Turn it the right way up.
                  int rot = 0;
                  try {
                      int or = new ExifInterface(f.getAbsolutePath()).getAttributeInt(ExifInterface.TAG_ORIENTATION, ExifInterface.ORIENTATION_NORMAL);
                      rot = or == ExifInterface.ORIENTATION_ROTATE_90 ? 90 : or == ExifInterface.ORIENTATION_ROTATE_180 ? 180
                              : or == ExifInterface.ORIENTATION_ROTATE_270 ? 270 : 0;
                  } catch (Exception ignored) {
                  }
                  float scale = Math.min(1f, (float) FULL / Math.max(b.getWidth(), b.getHeight()));
                  Matrix m = new Matrix();
                  m.postScale(scale, scale);
                  if (rot != 0) m.postRotate(rot);
                  Bitmap r = Bitmap.createBitmap(b, 0, 0, b.getWidth(), b.getHeight(), m, true);
                  if (r != b) b.recycle();
                  base = r.copy(Bitmap.Config.ARGB_8888, true);
                  if (base != r) r.recycle();
                  f.delete();   // the original, with its hidden details, is gone

                  faces = blurFaces(base);
                  taken = when;
                  return preview();
              }

              /** Blurs a square around a point the player tapped (x and y from 0 to 1). */
              static synchronized JSONObject blurAt(float x, float y) {
                  if (base == null) return null;
                  marks.add(new float[]{Math.max(0, Math.min(1, x)), Math.max(0, Math.min(1, y))});
                  return preview();
              }

              static synchronized JSONObject undo() {
                  if (base == null) return null;
                  if (!marks.isEmpty()) marks.remove(marks.size() - 1);
                  return preview();
              }

              /** The waiting photo, or null if there isn't one or it's too old to post. */
              static synchronized JSONObject current() {
                  if (base == null) return null;
                  if (System.currentTimeMillis() - taken > MAX_AGE_MS) {
                      clear();
                      return null;
                  }
                  return preview();
              }

              /** Quick check, without making a preview. */
              static synchronized boolean has() {
                  return base != null && System.currentTimeMillis() - taken <= MAX_AGE_MS;
              }

              static synchronized long taken() {
                  return taken;
              }

              /** The photo to upload: {full, thumb} as base64 JPEGs. */
              static synchronized String[] encode() {
                  if (base == null) return null;
                  Bitmap out = render();
                  byte[] full = jpeg(out, 80);
                  if (full.length > 640 * 1024) full = jpeg(out, 65);
                  if (full.length > 640 * 1024) full = jpeg(out, 50);
                  Bitmap t = scaled(out, THUMB);
                  byte[] thumb = jpeg(t, 70);
                  if (t != out) t.recycle();
                  out.recycle();
                  return new String[]{Base64.encodeToString(full, Base64.NO_WRAP), Base64.encodeToString(thumb, Base64.NO_WRAP)};
              }

              static synchronized void clear() {
                  if (base != null) base.recycle();
                  base = null;
                  marks.clear();
                  faces = 0;
                  taken = 0;
              }

              /* ---------- inside ---------- */

              private static JSONObject preview() {
                  Bitmap out = render();
                  Bitmap p = scaled(out, PREVIEW);
                  String url = "data:image/jpeg;base64," + Base64.encodeToString(jpeg(p, 75), Base64.NO_WRAP);
                  JSONObject j = new JSONObject();
                  try {
                      j.put("preview", url);
                      j.put("faces", faces);
                      j.put("blurs", marks.size());
                      j.put("taken", taken);
                      j.put("w", out.getWidth());
                      j.put("h", out.getHeight());
                  } catch (Exception ignored) {
                  }
                  if (p != out) p.recycle();
                  out.recycle();
                  return j;
              }

              private static Bitmap render() {
                  Bitmap out = base.copy(Bitmap.Config.ARGB_8888, true);
                  int w = out.getWidth(), h = out.getHeight(), half = Math.round(Math.max(w, h) * 0.07f);
                  for (float[] mk : marks) {
                      int cx = Math.round(mk[0] * w), cy = Math.round(mk[1] * h);
                      blur(out, new Rect(cx - half, cy - half, cx + half, cy + half));
                  }
                  return out;
              }

              /** Finds faces with Android's built-in face finder and blurs each one. */
              private static int blurFaces(Bitmap b) {
                  try {
                      int dw = Math.min(640, b.getWidth()) & ~1;          // the face finder needs an even width
                      float k = (float) b.getWidth() / dw;
                      int dh = Math.round(b.getHeight() / k);
                      Bitmap small = Bitmap.createBitmap(dw, dh, Bitmap.Config.RGB_565);
                      new Canvas(small).drawBitmap(b, null, new Rect(0, 0, dw, dh), new Paint(Paint.FILTER_BITMAP_FLAG));
                      FaceDetector.Face[] found = new FaceDetector.Face[12];
                      int n = new FaceDetector(dw, dh, found.length).findFaces(small, found);
                      small.recycle();
                      int count = 0;
                      PointF mid = new PointF();
                      for (int i = 0; i < n; i++) {
                          if (found[i] == null || found[i].confidence() < 0.3f) continue;
                          found[i].getMidPoint(mid);
                          float e = found[i].eyesDistance() * k, cx = mid.x * k, cy = mid.y * k + e * 0.35f;
                          blur(b, new Rect(Math.round(cx - e * 1.6f), Math.round(cy - e * 2.0f), Math.round(cx + e * 1.6f), Math.round(cy + e * 2.1f)));
                          count++;
                      }
                      return count;
                  } catch (Throwable t) {
                      return 0;
                  }
              }

              /** Heavy blur: shrink the area to a few pixels, then stretch it back. Can't be undone from the image. */
              private static void blur(Bitmap b, Rect r) {
                  if (!r.intersect(0, 0, b.getWidth(), b.getHeight()) || r.width() < 2 || r.height() < 2) return;
                  Bitmap area = Bitmap.createBitmap(b, r.left, r.top, r.width(), r.height());
                  float s = 7f / Math.max(r.width(), r.height());
                  Bitmap tiny = Bitmap.createScaledBitmap(area, Math.max(2, Math.round(r.width() * s)), Math.max(2, Math.round(r.height() * s)), true);
                  Bitmap back = Bitmap.createScaledBitmap(tiny, r.width(), r.height(), true);
                  new Canvas(b).drawBitmap(back, r.left, r.top, null);
                  area.recycle();
                  tiny.recycle();
                  back.recycle();
              }

              private static Bitmap scaled(Bitmap b, int max) {
                  float s = (float) max / Math.max(b.getWidth(), b.getHeight());
                  if (s >= 1) return b;
                  return Bitmap.createScaledBitmap(b, Math.round(b.getWidth() * s), Math.round(b.getHeight() * s), true);
              }

              private static byte[] jpeg(Bitmap b, int q) {
                  ByteArrayOutputStream o = new ByteArrayOutputStream();
                  b.compress(Bitmap.CompressFormat.JPEG, q, o);
                  return o.toByteArray();
              }
          }
