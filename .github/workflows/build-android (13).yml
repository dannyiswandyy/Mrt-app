                  if (!dir.exists()) dir.mkdirs();
                  File f = new File(dir, id + (thumb ? "-t" : "") + ".jpg");
                  try {
                      if (!f.exists()) {
                          HttpURLConnection conn = open("GET", "/photo/" + id + (thumb ? "/thumb" : ""), token(c));
                          if (conn.getResponseCode() != 200) {
                              conn.disconnect();
                              return null;
