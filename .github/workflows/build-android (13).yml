          MRTAPP_EOF

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create a signing key on the first run
        run: |
          mkdir -p signing
          if [ ! -f signing/mrt-tracker.jks ]; then
            keytool -genkeypair -v -keystore signing/mrt-tracker.jks -alias mrttracker \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass mrttracker -keypass mrttracker -dname "CN=MRT Tracker"
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add signing/mrt-tracker.jks
            git commit -m "Add app signing key [skip ci]"
            git push
          fi

      # Downloads LTA's official train timetable and packs it into the app.
      # Never fails the build: without it, the app falls back to estimated times.
      - name: Fetch LTA train timetable
        run: python3 mrt-tracker-app/tools/build_timetable.py mrt-tracker-app

      # The spotting game's server, on Cloudflare (free). Needs the CLOUDFLARE_API_TOKEN secret;
      # without it the app is built without the game. GAME_ADMIN_CODE is the moderator code, and
      # GAME_JOIN_CODE (optional) makes players need an invite code.
      - name: Put the spotting game online
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GAME_ADMIN_CODE: ${{ secrets.GAME_ADMIN_CODE }}
          GAME_JOIN_CODE: ${{ secrets.GAME_JOIN_CODE }}
          GAME_SERVER: ${{ secrets.GAME_SERVER }}
        run: python3 mrt-tracker-app/tools/deploy_game.py

      - name: Build the app
        run: |
          # Version from the build time, so every new build installs over the last one,
          # whatever this workflow file is called.
          VC=$(( ( $(date +%s) - 1767225600 ) / 60 ))
          VN=$(TZ=Asia/Singapore date +%Y.%m.%d-%H%M)
          echo "VN=$VN" >> "$GITHUB_ENV"
          # The public repo the app checks for updates.
          UPDATE_REPO="${{ github.repository_owner }}/mrt-tracker-releases"
          gradle -p mrt-tracker-app assembleRelease -Pvc=$VC -Pvn=$VN -PupdateRepo="$UPDATE_REPO" -PgameServer="${GAME_SERVER:-}" -Pks="$GITHUB_WORKSPACE/signing/mrt-tracker.jks"
          cp mrt-tracker-app/app/build/outputs/apk/release/app-release.apk mrt-tracker.apk
          printf '{"versionCode":%s,"versionName":"%s"}\n' "$VC" "$VN" > version.json

      - uses: actions/upload-artifact@v4
        with:
          name: mrt-tracker-apk
          path: mrt-tracker.apk

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest mrt-tracker.apk --title "MRT Tracker $VN" \
            --notes "Download mrt-tracker.apk on your Android phone and open it to install."

      # Publishes the app to your public "mrt-tracker-releases" repo, where the app
      # looks for updates. Needs the RELEASES_TOKEN secret; skipped if it isn't set.
      - name: Publish update for the app
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          PUB_REPO: ${{ github.repository_owner }}/mrt-tracker-releases
        run: |
          if [ -z "$RELEASES_TOKEN" ]; then
            echo "::warning::RELEASES_TOKEN isn't set, so the app won't be told about this update."
            exit 0
          fi
          export GH_TOKEN="$RELEASES_TOKEN"
          gh release delete latest --repo "$PUB_REPO" --yes --cleanup-tag || true
          gh release create latest mrt-tracker.apk version.json --repo "$PUB_REPO" --title "MRT Tracker $VN" \
            --notes "Open MRT Tracker and tap Update, or download mrt-tracker.apk to install."
