            view.tx = px - (px - view.tx) * k; view.ty = py - (py - view.ty) * k; view.s = s2; mDirty = true;
          }
          let mAnim = null;
          function flyTo(x, y, s){
            const from = {...view}, to = {s, tx: mW / 2 - x * s, ty: mH / 2 - y * s}, t0 = performance.now();
            const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
            mAnim = t => {
              const k = reduce ? 1 : Math.min(1, (t - t0) / 450), e = 1 - Math.pow(1 - k, 3);
              view = {s: from.s + (to.s - from.s) * e, tx: from.tx + (to.tx - from.tx) * e, ty: from.ty + (to.ty - from.ty) * e};
              mDirty = true; if (k >= 1) mAnim = null;
            };
          }

          /* ---- drawing ---- */
          function mapDraw(){
            const ctx = mctx, s = view.s, zoom = s / fitScale;
            ctx.setTransform(mDpr, 0, 0, mDpr, 0, 0);
            ctx.fillStyle = MC.bg; ctx.fillRect(0, 0, mW, mH);
            const lw = clampN(2.2 + zoom * 0.55, 2.6, 8), now = sgNow();
            ctx.lineCap = "round"; ctx.lineJoin = "round";

            const path = (line, i) => { const p = MSEG[line][i].pts; ctx.moveTo(sx(p[0][0]), sy(p[0][1])); for (let k = 1; k < p.length; k++) ctx.lineTo(sx(p[k][0]), sy(p[k][1])); };

            // disrupted stretches: red glow underneath
            if (typeof alertState !== "undefined" && alertState && alertState.status === 2){
              ctx.strokeStyle = MC.bad; ctx.globalAlpha = 0.35; ctx.lineWidth = lw * 3;
              for (const sg of alertState.segments) for (const c of (sg.lines || [])){
                const L = LINES[c], set = new Set(sg.codes); ctx.beginPath();
                for (let i = 0; i < L.stations.length - 1; i++) if (set.has(L.stations[i][0]) && set.has(L.stations[i + 1][0])) path(c, i);
                ctx.stroke();
              }
              ctx.globalAlpha = 1;
            }
            // lines
            for (const c of MDRAW){
              const L = LINES[c], act = activeStations(L, now.iso).length, lrt = !!L.lrt;
              ctx.lineWidth = lrt ? lw * 0.7 : lw;
              ctx.strokeStyle = MC[c]; ctx.setLineDash([]); ctx.beginPath();
              for (let i = 0; i < act - 1; i++) path(c, i);
              ctx.stroke();
              if (act < L.stations.length){   // opening later: dashed
                ctx.setLineDash([lw * 1.2, lw * 1.4]); ctx.beginPath();
                for (let i = Math.max(0, act - 1); i < L.stations.length - 1; i++) path(c, i);
                ctx.stroke(); ctx.setLineDash([]);
              }
            }
            // stations
            const r = clampN(lw * 0.62, 2, 5);
            for (const e of MSTN){
              const future = e.codes.every(x => x.idx >= activeStations(LINES[x.line], now.iso).length);
              if (e.pts.length > 1){   // interchange with separate platforms: link them
                ctx.strokeStyle = MC.fg; ctx.lineWidth = r * 2.6; ctx.beginPath();
                ctx.moveTo(sx(e.pts[0][0]), sy(e.pts[0][1])); for (const p of e.pts.slice(1)) ctx.lineTo(sx(p[0]), sy(p[1])); ctx.stroke();
                ctx.strokeStyle = MC.bg; ctx.lineWidth = r * 1.2; ctx.stroke();
              }
              for (const p of e.pts){
                ctx.beginPath(); ctx.arc(sx(p[0]), sy(p[1]), e.ix ? r * 1.35 : r, 0, Math.PI * 2);
                ctx.fillStyle = MC.bg; ctx.fill();
                ctx.lineWidth = e.ix ? Math.max(1.6, r * 0.55) : Math.max(1.2, r * 0.5);
                ctx.strokeStyle = future ? MC.track : e.ix ? MC.fg : MC[e.codes[0].line]; ctx.stroke();
              }
              if (mSel && mSel.type === "station" && mSel.name === e.name){
                ctx.beginPath(); ctx.arc(sx(e.x), sy(e.y), r * 2.6, 0, Math.PI * 2); ctx.strokeStyle = MC.fg; ctx.lineWidth = 2; ctx.stroke();
              }
            }
            // labels: interchanges and ends first; more appear as you zoom in
            if (zoom >= 1.6){
              const fs = clampN(9 + zoom * 0.35, 10, 13), placed = [];
              ctx.font = `600 ${fs}px Barlow, system-ui, sans-serif`; ctx.textBaseline = "middle";
              const order = MSTN.slice().sort((a, b) => (b.ix * 2 + b.term) - (a.ix * 2 + a.term));
              for (const e of order){
                if (!e.ix && !e.term && zoom < 3.2) continue;
                const w = ctx.measureText(e.name).width, x = sx(e.x), y = sy(e.y), off = r * 1.6 + 3;
                if (x < -50 || x > mW + 50 || y < -20 || y > mH + 20) continue;
                for (const [lx, align] of [[x + off, "left"], [x - off, "right"]]){
                  const bx = align === "left" ? lx : lx - w, box = [bx - 2, y - fs / 2 - 1, bx + w + 2, y + fs / 2 + 1];
                  if (placed.some(q => box[0] < q[2] && box[2] > q[0] && box[1] < q[3] && box[3] > q[1])) continue;
                  placed.push(box);
                  ctx.textAlign = align; ctx.lineWidth = 3; ctx.strokeStyle = MC.bg; ctx.strokeText(e.name, lx, y);
                  ctx.fillStyle = MC.fg; ctx.fillText(e.name, lx, y);
                  break;
                }
              }
            }
            // trains: small arrows pointing the way they travel, one side of the line per direction
            mHits = [];
            const tr = clampN(lw * 0.9, 3.4, 7);
            let total = 0;
            for (const c of MDRAW){
              const list = trainsOn(c, now); total += list.length;
              for (const t of list){
                const [x, y, dx, dy] = posOn(c, t.idx);
                const len = Math.hypot(dx, dy) || 1, ux = (t.dir ? -dx : dx) / len, uy = (t.dir ? -dy : dy) / len;
                const nx = -uy, ny = ux, side = lw * 0.55 + tr * 0.6;
                const X = sx(x) + nx * side, Y = sy(y) + ny * side;
                if (X < -20 || X > mW + 20 || Y < -20 || Y > mH + 20) continue;
                const sel = mSel && mSel.type === "train" && mSel.id === t.id, k = sel ? 1.5 : 1;
                ctx.beginPath();
                ctx.moveTo(X + ux * tr * 1.5 * k, Y + uy * tr * 1.5 * k);
                ctx.lineTo(X - ux * tr * 0.9 * k + nx * tr * k, Y - uy * tr * 0.9 * k + ny * tr * k);
                ctx.lineTo(X - ux * tr * 0.9 * k - nx * tr * k, Y - uy * tr * 0.9 * k - ny * tr * k);
                ctx.closePath();
                ctx.fillStyle = MC[c]; ctx.fill();
                ctx.lineWidth = sel ? 2.5 : 1.3; ctx.strokeStyle = sel ? MC.fg : MC.bg; ctx.stroke();
                mHits.push({line: c, id: t.id, x: X, y: Y});
              }
            }
            $("mapCount").textContent = total ? `${total} trains running · ${TT ? "LTA timetable" : "estimated"}` : "No trains running right now";
            mDirty = false;
          }

          /* ---- info card under your finger ---- */

          /* ---- info card under your finger & desktop split sync ---- */
          function mapInfoHTML(){
            const now = sgNow();
            if (!mSel) return `<p class="hint" style="margin:0">Tap any train or station on the map · Pinch or scroll to zoom.</p>`;
            if (mSel.type === "train"){
              const L = LINES[mSel.line], t = trainsOn(mSel.line, now).find(x => x.id === mSel.id);
              if (!t){ mSel = null; return mapInfoHTML(); }
              const act = activeStations(L, now.iso), stop = act[t.next][1];
              return `<div class="mi-h"><span class="code" style="background:var(--${mSel.line})">${mSel.line === "CG" ? "CGL" : mSel.line}</span><b>Train to ${esc(dest(L, t.dir, act))}</b><button class="mi-x" type="button" data-act="close" aria-label="Close">×</button></div>
                <div class="mi-row"><span>${t.atStation ? `Now at <b>${esc(stop)}</b>` : `Next stop <b>${esc(stop)}</b>`}</span><span class="mi-t">${t.atStation ? "Boarding" : t.eta < 0.5 ? "Arriving" : "~" + Math.max(1, Math.round(t.eta)) + " min"}</span></div>
                <div class="mi-act"><button class="btn ghost" type="button" data-act="line">Open on Line Board</button></div>`;
            }
            const e = MSTN.find(x => x.name === mSel.name);
            if (!e){ mSel = null; return mapInfoHTML(); }
            const hit = new Set();
            if (typeof alertState !== "undefined" && alertState && alertState.status === 2) for (const sg of alertState.segments) sg.codes.forEach(c => hit.add(c));
            const rows = [];
            for (const x of e.codes){
              const L = LINES[x.line], act = activeStations(L, now.iso), n = act.length;
              if (x.idx >= n){ rows.push(`<div class="mi-row"><span><span class="code" style="background:var(--${x.line})">${x.code}</span> Opens 26 December</span></div>`); continue; }
              const idxs = L.stations.map((st, i) => st[0] === x.code ? i : -1).filter(i => i >= 0 && i < n);
              for (const d of [0, 1]){
                const i = idxs.find(i => d ? i > 0 : i < n - 1); if (i === undefined) continue;
                const arr = nextArrivals(x.line, i, d, now, 3);
                rows.push(`<button class="mi-row mi-go" type="button" data-act="lineat" data-line="${x.line}"><span><span class="code" style="background:var(--${x.line})">${x.code}</span> To ${esc(dest(L, d, act))}</span><span class="mi-t">${arr.length ? arr.map(fmt).join(" · ") : "No more trains"}</span></button>`);
              }
            }
            const dis = e.codes.some(x => hit.has(x.code));
            return `<div class="mi-h"><b>${esc(e.name)}</b>${dis ? `<span class="chip">Disrupted</span>` : ""}<button class="mi-x" type="button" data-act="close" aria-label="Close">×</button></div>${rows.join("")}`;
          }
          function mapInfo(){ $("mapInfo").innerHTML = mapInfoHTML(); }
          $("mapInfo").addEventListener("click", ev => {
            const b = ev.target.closest("[data-act]"); if (!b) return;
            const act = b.dataset.act;
            if (act === "close"){ mSel = null; mDirty = true; mapInfo(); return; }
            if (act === "line" && mSel && mSel.type === "train"){ const line = mSel.line, id = mSel.id; setTrainView("line"); select(line); selTrain = id; tick(); return; }
            if (act === "lineat" && mSel && mSel.type === "station"){ const name = mSel.name; setTrainView("line"); select(b.dataset.line, name); }
          });

          /* ---- touch, mouse and buttons ---- */
          const ptrs = new Map();
          let gest = null, pinch = null, lastTap = null;
          const local = e => { const r = mcv.getBoundingClientRect(); return {x: e.clientX - r.left, y: e.clientY - r.top}; };
          mcv.addEventListener("pointerdown", e => {
            try { mcv.setPointerCapture(e.pointerId); } catch(_){}
            const p = local(e); ptrs.set(e.pointerId, p);
            if (ptrs.size === 1) gest = {x: p.x, y: p.y, t: performance.now(), moved: false};
            else { if (gest) gest.moved = true; pinch = null; }
            mAnim = null;
          });
          mcv.addEventListener("pointermove", e => {
            if (!ptrs.has(e.pointerId)) return;
            const prev = ptrs.get(e.pointerId), p = local(e); ptrs.set(e.pointerId, p);
            if (ptrs.size === 1 && gest){
              if (!gest.moved && Math.hypot(p.x - gest.x, p.y - gest.y) > 6) gest.moved = true;
              if (gest.moved){ view.tx += p.x - prev.x; view.ty += p.y - prev.y; mDirty = true; }
            } else if (ptrs.size === 2){
              const [a, b] = [...ptrs.values()], d = Math.hypot(a.x - b.x, a.y - b.y), mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
              if (pinch){ view.tx += mx - pinch.mx; view.ty += my - pinch.my; zoomAt(mx, my, d / (pinch.d || d)); }
              pinch = {d, mx, my};
            }
          });
          const endPtr = e => {
            if (!ptrs.has(e.pointerId)) return;
            const p = ptrs.get(e.pointerId); ptrs.delete(e.pointerId);
            if (ptrs.size < 2) pinch = null;
            if (ptrs.size === 0 && gest && !gest.moved && performance.now() - gest.t < 600 && e.type === "pointerup"){
              const nowT = performance.now();
              if (lastTap && nowT - lastTap.t < 300 && Math.hypot(p.x - lastTap.x, p.y - lastTap.y) < 30){ zoomAt(p.x, p.y, 2); lastTap = null; }
              else { mapTap(p.x, p.y); lastTap = {t: nowT, x: p.x, y: p.y}; }
            }
            if (ptrs.size === 0) gest = null;
          };
          mcv.addEventListener("pointerup", endPtr);
          mcv.addEventListener("pointercancel", endPtr);
          mcv.addEventListener("wheel", e => { e.preventDefault(); const p = local(e); zoomAt(p.x, p.y, Math.exp(-e.deltaY * 0.0015)); }, {passive: false});
          function mapTap(x, y){
            let best = null, bd = 16;
            for (const h of mHits){ const d = Math.hypot(h.x - x, h.y - y); if (d < bd){ bd = d; best = h; } }
            if (best){
              mSel = {type: "train", line: best.line, id: best.id}; mDirty = true; mapInfo();
              if (isDesktop()){ select(best.line); selTrain = best.id; tick(); }
              return;
            }
            let bs = null, bsd = 18;
            for (const e of MSTN) for (const p of e.pts){ const d = Math.hypot(sx(p[0]) - x, sy(p[1]) - y); if (d < bsd){ bsd = d; bs = e; } }
            mSel = bs ? {type: "station", name: bs.name} : null;
            mDirty = true; mapInfo();
            if (bs && isDesktop()){
              const lines = bs.codes.map(c => c.line);
              select(lines.includes(current) ? current : lines[0], bs.name);
            }
          }
          $("mapIn").onclick = () => zoomAt(mW / 2, mH / 2, 1.6);
          $("mapOut").onclick = () => zoomAt(mW / 2, mH / 2, 1 / 1.6);
          $("mapReset").onclick = () => { const v0 = {...view}; mapFit(); const t = {...view}; view = v0; flyTo((mW / 2 - t.tx) / t.s, (mH / 2 - t.ty) / t.s, t.s); };

          /* centre on a station, e.g. from the search box */
          window.mapFocus = name => {
            const e = MSTN.find(x => x.name === name); if (!e) return;
            mSel = {type: "station", name}; mapInfo();
            if (view) flyTo(e.x, e.y, Math.max(view.s, fitScale * 5));
          };
          window.syncMapStation = name => {
            const e = MSTN.find(x => x.name === name); if (!e) return;
            mSel = {type: "station", name}; mDirty = true; mapInfo();
            if (isDesktop() && view) flyTo(e.x, e.y, Math.max(view.s, fitScale * 3.8));
          };

          /* ---- Map / Line switch ---- */
          let trainView = store.get("mrt.trainView", "map");
          window.isMapView = () => !isDesktop() && trainView === "map";
          function setTrainView(v){
            trainView = v; store.set("mrt.trainView", v);
            const map = v === "map";
            $("mapView").hidden = !isDesktop() && !map;
            $("lineView").hidden = !isDesktop() && map;
            $("tabs").hidden = (!isDesktop() && map) || curView !== "trains";
            $("tvMap").setAttribute("aria-selected", map);
            $("tvLine").setAttribute("aria-selected", !map);
            syncMobileNav(curView);
            if (map || isDesktop()){ mapResize(); mapInfo(); }
            if (!map || isDesktop()){ layoutSpine(); tick(); }
          }
          $("tvMap").onclick = () => setTrainView("map");
          $("tvLine").onclick = () => setTrainView("line");
          window.addEventListener("resize", () => setTrainView(trainView));

          /* redraw: every frame while you move it, otherwise four times a second for the trains */
          (function mapLoop(t){
            const visible = (!$("mapView").hidden || isDesktop()) && !$("viewTrains").hidden && !document.hidden;
            if (visible && view){
              if (mAnim) mAnim(t);
              if (mDirty || t - mLast > 250){ mapDraw(); mLast = t; }
            }
            requestAnimationFrame(mapLoop);
          })(0);
          setInterval(() => { if ((!$("mapView").hidden || isDesktop()) && mSel) mapInfo(); }, 1000);
          setTrainView(trainView);

          /* ---------- Spotting game ----------
             Spot real trains, prove it with a photo taken in the app, and score points by how rare the train is.
             The game server works out every score. The app keeps the player's sign-in to itself: this page
             never sees it, and photos come from the app (https://photos.invalid/…), not straight from the internet. */
          const RARITY = [[0.10, "Very rare", 5, "v"], [0.20, "Rare", 3, "r"], [0.40, "Uncommon", 2, "u"], [1.01, "Common", 1, "c"]];
          const GAME_LINES = ["NSL", "EWL", "CG", "NEL", "CCL", "DTL", "TEL", "BP", "SE", "SW", "PE", "PW"];
          const FLEET_NAMES = {NSEWL: "NSL · EWL", SPLRT: "Sengkang–Punggol LRT", BP: "Bukit Panjang LRT"};
          const fleetGroup = c => FLEET[c] === NSEWL ? "NSEWL" : FLEET[c] === SPLRT ? "SPLRT" : c;
          const lineShort = c => ({CG: "CGL", BP: "BPL", SE: "SKE", SW: "SKW", PE: "PGE", PW: "PGW"})[c] || c;
          function rarity(line, model){
            const f = FLEET[line] || [], e = f.find(x => x[0] === model);
            if (!e) return null;
            const total = f.reduce((a, x) => a + x[3], 0), t = RARITY.find(r => e[3] / total < r[0]);
            return {name: t[1], mult: t[2], cls: t[3], retiring: /retir/.test(e[5] || ""), sets: e[6] || ""};
          }
          const tierCls = n => (RARITY.find(r => r[1] === n) || [0, 0, 0, ""])[3];
          const safeId = s => String(s || "").replace(/[^0-9a-f-]/g, "");
          function agoText(t){
            const m = Math.round((Date.now() - t) / 60000);
            if (m < 1) return "just now";
            if (m < 60) return m + " min ago";
            if (m < 24 * 60) return Math.round(m / 60) + " h ago";
            return new Date(t).toLocaleDateString("en-SG", {day: "numeric", month: "short", timeZone: "Asia/Singapore"}) + ", " + hhmm(t);
          }

          const G = {
            tab: store.get("mrt.spotTab", "feed"), info: null, me: null, feed: null, feedMore: false, filter: "",
            board: null, period: "week", photo: null, shotBusy: false, sending: false, msg: "", msgOk: false, result: null,
            form: Object.assign({line: "NSL", model: "", set: "", station: "", toward: ""}, store.get("mrt.spotForm", {})),
            joinMsg: "", arm: null, loading: false
          };
          const gameApp = () => { try { return !!(APP && APP.gameState); } catch(e){ return false; } };
          function gameState(){ try { return JSON.parse(APP.gameState()); } catch(e){ return {server: false, signedIn: false, name: ""}; } }
          function bridge(fn, ...args){
            return new Promise(res => {
              const id = "g" + (++reqId);
              pending[id] = (code, body) => { let j = {}; try { j = JSON.parse(body || "{}"); } catch(e){} res({code, j}); };
              APP[fn](id, ...args);
            });
          }
          const gameCall = (method, path, body) => bridge("game", method, path, body ? JSON.stringify(body) : "");
          const errText = r => (r.j && r.j.error) || (r.code === 0 ? "Couldn't reach the game server. Check your internet connection." : `The game server returned an error (${r.code}).`);

          function pointsTable(){
            return `<table class="ptab">
              <tr><td>Every sighting</td><td>10 × rarity</td></tr>
              <tr><td>Rarity: how few of that model run on the line</td><td>Common ×1 · Uncommon ×2<br>Rare ×3 · Very rare ×5</td></tr>
              <tr><td>First ever sighting of that train in the game</td><td>+25</td></tr>
              <tr><td>Nobody has logged that train for 2 weeks</td><td>+10</td></tr>
              <tr><td>A train you've never logged before</td><td>+15</td></tr>
              <tr><td>A model that's being retired</td><td>+10</td></tr>
              <tr><td>Each player who says they saw it too (up to 3)</td><td>+2</td></tr>
              <tr><td>Same train again within 6 hours</td><td>0</td></tr>
            </table>
            <p class="muted" style="margin-top:8px">Up to 30 scored sightings a day. Pick the train model to earn rarity points and bonuses; "Not sure" scores 10.</p>`;
          }
          function rarityGuide(){
            const seen = new Set(), rows = [];
            for (const c of GAME_LINES){
              const g = fleetGroup(c); if (seen.has(g)) continue; seen.add(g);
              rows.push(`<div><b>${esc(FLEET_NAMES[g] || LINES[c].name)}</b><span class="chips">${FLEET[c].map(f => { const r = rarity(c, f[0]); return `<span class="tier ${r.cls}">${esc(f[0])} · ${esc(r.name)}</span>`; }).join("")}</span></div>`);
            }
            return `<div class="rare">${rows.join("")}</div>`;
          }
          const RULES = `<ul class="rules">
            <li>Stay behind the yellow line and out of everyone's way. No flash, and never go near tracks, depots or anywhere closed to the public.</li>
            <li>Only post photos of trains. Everyone in the game can see them.</li>
            <li>Faces the app finds are blurred for you. Tap the photo to blur anything it missed, like faces or car plates.</li>
            <li>The app removes the photo's hidden details (like where it was taken) before posting.</li>
          </ul>`;

          function renderSpot(){
            const root = $("spBody"), head = $("spHead"), tabs = $("spTabs");
            if (!gameApp()){
              head.innerHTML = ""; tabs.hidden = true;
              root.innerHTML = `<section class="card"><h2>Spotting game</h2>
                  <p>Spot real trains around Singapore, prove it with a photo, and score points. The rarer the train, the more it's worth. Your photos appear in a feed for everyone playing, with a weekly leaderboard.</p>
                  <p class="muted" style="margin-top:8px">The game is in the MRT Tracker Android app, because photos have to be taken in the app as proof.</p></section>
                <section class="card"><h2>How points work</h2>${pointsTable()}</section>
                <section class="card"><h2>How rare is each train?</h2><p class="muted">From how many of each model are in service on its line (SGTrains).</p>${rarityGuide()}</section>
                <section class="card"><h2>Spotting safely</h2>${RULES}</section>`;
              return;
            }
            const st = gameState();
            if (!st.server){
              head.innerHTML = ""; tabs.hidden = true;
              root.innerHTML = `<section class="card"><h2>Spotting game</h2><p>The game isn't switched on in this version of the app yet. It arrives with an update once the game server is set up.</p></section>
                <section class="card"><h2>How points work</h2>${pointsTable()}</section>`;
              return;
            }
            if (!st.signedIn){ head.innerHTML = ""; tabs.hidden = true; renderJoin(root); return; }

            const me = G.me;
            head.innerHTML = `<div class="sp-me">
                <div class="pts">${me ? me.points : "–"}<small>points</small></div>
                <div class="who"><b>${esc(st.name)}${me && me.admin ? ' <span class="tier u">Moderator</span>' : ""}</b>
                  <span class="muted">${me ? (me.rank ? `#${me.rank} of ${me.players}` : "Not ranked yet") + ` · ${me.weekPoints} this week` : "Loading…"}</span></div>
                <button type="button" class="btn" id="spGo">📷 Spot</button></div>`;
            $("spGo").onclick = () => { setSpotTab("log"); if (!G.photo) takePhoto(); };
            tabs.hidden = false;
            tabs.querySelectorAll("button").forEach(b => b.setAttribute("aria-selected", b.dataset.t === G.tab));
            const msg = G.msg ? `<div class="sp-msg${G.msgOk ? " ok" : ""}">${esc(G.msg)}</div>` : "";
            if (G.tab === "log") root.innerHTML = msg + logHtml();
            else if (G.tab === "board") root.innerHTML = msg + boardHtml();
            else if (G.tab === "me") root.innerHTML = msg + meHtml();
            else root.innerHTML = msg + feedHtml();
            wireSpot();
          }

          /* ---- joining ---- */
          function renderJoin(root){
            if (!G.info){
              root.innerHTML = `<section class="card"><h2>Join the spotting game</h2><p class="muted">Connecting to the game…</p></section>`;
              gameCall("GET", "/info").then(r => {
                G.info = r.code === 200 ? r.j : {error: errText(r)};
                if (curView === "spot") renderSpot();
              });
              return;
            }
            if (G.info.error){
              root.innerHTML = `<section class="card"><h2>Join the spotting game</h2><div class="sp-msg">${esc(G.info.error)}</div>
                <p style="margin-top:10px"><button type="button" class="btn ghost" id="spRetry">Try again</button></p></section>`;
              $("spRetry").onclick = () => { G.info = null; renderSpot(); };
              return;
            }
            root.innerHTML = `<section class="card"><h2>Join the spotting game</h2>
                <p class="muted" style="margin-bottom:12px">Spot real trains, prove it with a photo, and score points. The rarer the train, the more it's worth.</p>
                <form class="fm" id="joinForm" autocomplete="off">
                  <label>Your spotter name<small>2–20 letters or numbers. Everyone in the game sees it, so don't use your full real name.</small>
                    <input type="text" id="joinName" maxlength="20" autocapitalize="words" spellcheck="false"></label>
                  ${G.info.needsCode ? `<label>Invite code<small>Ask whoever runs the game.</small><input type="text" id="joinCode" maxlength="60" spellcheck="false" autocapitalize="off"></label>` : ""}
                  ${RULES}
                  <label class="check"><input type="checkbox" id="joinOk"> I'll spot safely and only post photos of trains.</label>
                  ${G.joinMsg ? `<div class="sp-msg">${esc(G.joinMsg)}</div>` : ""}
                  <button type="submit" class="btn" id="joinBtn">Join</button>
                  <p class="muted">Your sign-in is kept on this phone. If you uninstall the app, you'll need a new name.</p>
                </form></section>
              <section class="card"><h2>How points work</h2>${pointsTable()}</section>`;
            $("joinForm").onsubmit = async e => {
              e.preventDefault();
              const name = $("joinName").value.trim();
              if (!/^[A-Za-z0-9][A-Za-z0-9 _.-]{1,19}$/.test(name)){ G.joinMsg = "Pick a name of 2–20 letters or numbers."; return renderSpot(); }
              if (!$("joinOk").checked){ G.joinMsg = "Tick the box to agree to spot safely."; return renderSpot(); }
              $("joinBtn").disabled = true; $("joinBtn").textContent = "Joining…";
              const r = await gameCall("POST", "/join", {name, code: $("joinCode") ? $("joinCode").value.trim() : ""});
              if (r.code === 200){ G.joinMsg = ""; G.tab = "log"; G.feed = null; loadMe(); renderSpot(); }
              else { G.joinMsg = errText(r); renderSpot(); const n = $("joinName"); if (n) n.value = name; }
            };
          }

          /* ---- loading ---- */
          function signedOut(r){
            if (r.code === 401){ G.me = null; G.feed = null; G.board = null; G.info = null; G.msg = ""; renderSpot(); return true; }
            return false;
          }
          async function loadMe(){
            const r = await gameCall("GET", "/me");
            if (signedOut(r)) return;
            if (r.code === 200) G.me = r.j;
            else if (r.code === 403){ G.msg = errText(r); G.msgOk = false; }
            if (curView === "spot") renderSpot();
          }
          async function loadFeed(more){
            if (G.loading) return;
            G.loading = true;
            const q = new URLSearchParams();
            if (G.filter === "mine") q.set("mine", "1"); else if (G.filter) q.set("line", G.filter);
            if (more && G.feed && G.feed.length) q.set("before", String(G.feed[G.feed.length - 1].t));
            const r = await gameCall("GET", "/feed?" + q.toString());
            G.loading = false;
            if (signedOut(r)) return;
            if (r.code === 200){
              const list = r.j.spots || [];
              G.feed = more ? (G.feed || []).concat(list) : list;
              G.feedMore = list.length >= 30;
              if (!more) G.msg = G.msgOk ? G.msg : "";
            } else { G.msg = errText(r); G.msgOk = false; if (!G.feed) G.feed = []; }
            if (curView === "spot" && G.tab === "feed") renderSpot();
          }
          async function loadBoard(){
            const r = await gameCall("GET", "/leaderboard?period=" + G.period);
            if (signedOut(r)) return;
            if (r.code === 200) G.board = r.j; else { G.msg = errText(r); G.msgOk = false; G.board = {players: []}; }
            if (curView === "spot" && G.tab === "board") renderSpot();
          }
          function refreshSpot(){
            if (!gameApp() || !gameState().signedIn) return;
            loadMe();
            if (G.tab === "feed") loadFeed(false);
            if (G.tab === "board") loadBoard();
          }
          function setSpotTab(t){
            G.tab = t; store.set("mrt.spotTab", t); G.msg = ""; G.arm = null;
            if (t !== "log") G.result = null;
            if (t === "feed" && !G.feed) loadFeed(false);
            if (t === "board") loadBoard();
            if (t === "me") loadMe();
            if (t === "log" && !G.photo) restorePhoto();
            renderSpot(); window.scrollTo(0, 0);
          }
          function restorePhoto(){
            try { const p = APP.gamePhoto(); G.photo = p ? JSON.parse(p) : null; } catch(e){ G.photo = null; }
          }

          /* ---- feed ---- */
          function feedHtml(){
            const chips = [["", "All"], ["mine", "Mine"]].map(([k, n]) => `<button type="button" data-f="${k}" aria-pressed="${G.filter === k}">${n}</button>`).join("") +
              GAME_LINES.map(c => `<button type="button" data-f="${c}" aria-pressed="${G.filter === c}" style="--c:var(--${c})"><i></i>${lineShort(c)}</button>`).join("");
            let list;
            if (!G.feed) list = `<p class="muted">Loading sightings…</p>`;
            else if (!G.feed.length) list = `<section class="card"><h2>No sightings yet</h2><p class="muted">${G.filter ? "Nothing here yet." : "Be the first: tap 📷 Spot when a train pulls in."}</p></section>`;
            else list = G.feed.map(cardHtml).join("") + (G.feedMore ? `<button type="button" class="btn ghost" id="spMore">${G.loading ? "Loading…" : "Show older sightings"}</button>` : "");
            return `<div class="sp-filter" role="group" aria-label="Show sightings">${chips}</div><div class="sp-list">${list}</div>`;
          }
          function cardHtml(s){
            const id = safeId(s.id), admin = G.me && G.me.admin, armed = k => G.arm === k + id;
            const acts = [];
            if (!s.mine){
              acts.push(`<button type="button" data-vote="confirm" data-id="${id}" aria-pressed="${s.myVote === "confirm"}">✓ Saw it too${s.confirms ? " · " + s.confirms : ""}</button>`);
              acts.push(`<button type="button" data-vote="report" data-id="${id}" aria-pressed="${s.myVote === "report"}">⚑ ${s.myVote === "report" ? "Reported" : "Report"}</button>`);
            } else if (s.confirms) acts.push(`<button type="button" disabled>✓ ${s.confirms} saw it too</button>`);
            if (s.mine || admin) acts.push(`<button type="button" class="danger${armed("del") ? " armed" : ""}" data-del="${id}">${armed("del") ? "Tap again to delete" : "Delete"}</button>`);
            if (admin && s.hidden) acts.push(`<button type="button" data-restore="${id}">Restore</button>`);
            if (admin && !s.mine) acts.push(`<button type="button" class="danger${armed("ban") ? " armed" : ""}" data-ban="${id}">${armed("ban") ? "Tap again: remove player and all their posts" : "Remove player"}</button>`);
            const t = tierCls(s.tier);
            return `<article class="spcard${s.hidden ? " hid" : ""}" style="--c:var(--${esc(s.line)})">
              <button type="button" class="ph" data-full="${safeId(s.photo)}" data-cap="${esc(`${s.model || "Train"} ${s.set} · ${s.station}`)}" aria-label="Open photo"><img src="https://photos.invalid/${safeId(s.photo)}/thumb" alt="Photo of train ${esc(s.set)}" loading="lazy"></button>
              <div class="bd">
                <div class="sp-h"><span class="code">${esc(lineShort(s.line))}</span><span class="sp-set">${esc(s.set)}</span>${s.model ? `<b>${esc(s.model)}</b>` : ""}
                  ${t ? `<span class="tier ${t}">${esc(s.tier)}</span>` : ""}<span class="sp-pts${s.points ? "" : " zero"}">+${s.points}</span></div>
                <div class="sp-meta"><b>${esc(s.name)}</b> · ${esc(s.station)}${s.toward ? " → " + esc(s.toward) : ""} · ${agoText(s.t)}</div>
                ${s.bonuses && s.bonuses.length ? `<div class="sp-bon">${s.bonuses.map(b => `<span>${esc(b)}</span>`).join("")}</div>` : ""}
                ${s.hidden ? `<div class="sp-msg">Hidden after ${s.reports || 3} reports. Only moderators can see it.</div>` : s.reports ? `<div class="muted">${s.reports} report${s.reports > 1 ? "s" : ""}</div>` : ""}
                ${acts.length ? `<div class="sp-act">${acts.join("")}</div>` : ""}
              </div></article>`;
          }
          async function spotAction(btn){
            const id = btn.dataset.id || btn.dataset.del || btn.dataset.restore || btn.dataset.ban;
            const s = (G.feed || []).find(x => safeId(x.id) === id);
            let r;
            if (btn.dataset.vote){
              const kind = s && s.myVote === btn.dataset.vote ? "none" : btn.dataset.vote;
              btn.disabled = true;
              r = await gameCall("POST", "/vote/" + id, {kind});
              if (r.code === 200 && s){ if (s.myVote === "confirm") s.confirms--; s.myVote = kind === "none" ? null : kind; if (kind === "confirm") s.confirms++; }
            } else if (btn.dataset.del || btn.dataset.ban){
              const k = (btn.dataset.del ? "del" : "ban") + id;
              if (G.arm !== k){ G.arm = k; renderSpot(); return; }
              G.arm = null; btn.disabled = true;
              r = await gameCall(btn.dataset.del ? "DELETE" : "POST", (btn.dataset.del ? "/spot/" : "/ban/") + id);
              if (r.code === 200){ G.msg = btn.dataset.del ? "Sighting deleted." : "Player removed, with everything they posted."; G.msgOk = true; loadFeed(false); loadMe(); }
            } else if (btn.dataset.restore){
              r = await gameCall("POST", "/restore/" + id);
              if (r.code === 200 && s){ s.hidden = false; s.reports = 0; }
            }
            if (r && signedOut(r)) return;
            if (r && r.code !== 200){ G.msg = errText(r); G.msgOk = false; }
            renderSpot();
          }
          function openPhoto(id, cap){
            const o = document.createElement("div");
            o.className = "ph-full"; o.setAttribute("role", "dialog"); o.setAttribute("aria-label", "Photo");
            o.innerHTML = `<p>${esc(cap)}</p><img src="https://photos.invalid/${safeId(id)}" alt="${esc(cap)}"><button type="button" aria-label="Close">×</button>`;
            o.onclick = () => o.remove();
            document.body.appendChild(o);
          }

          /* ---- logging a sighting ---- */
          function lineStations(c){
            const seen = new Set();
            return activeStations(LINES[c], sgNow().iso).map(s => s[1]).filter(n => !seen.has(n) && seen.add(n));
          }
          function towards(c){
            const L = LINES[c], act = activeStations(L, sgNow().iso);
            return [dest(L, 0, act), dest(L, 1, act)];
          }
          function logHtml(){
            if (G.result){
              const r = G.result, t = tierCls(r.tier);
              return `<section class="card sp-result">
                <div class="big">+${r.points}</div>
                <div>${t ? `<span class="tier ${t}">${esc(r.tier)} ×${r.mult}</span>` : ""}</div>
                ${r.bonuses && r.bonuses.length ? `<div class="sp-bon">${r.bonuses.map(b => `<span>${esc(b)}</span>`).join("")}</div>` : ""}
                <p class="muted">Posted to the feed. Other players can say they saw it too, for +2 each.</p>
                <p style="margin-top:6px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap"><button type="button" class="btn" id="spAgain">📷 Spot another</button><button type="button" class="btn ghost" id="spToFeed">See the feed</button></p>
              </section>`;
            }
            const f = G.form, L = FLEET[f.line] || [], rz = rarity(f.line, f.model);
            const stations = lineStations(f.line), tw = towards(f.line);
            const p = G.photo;
            const shot = p
              ? `<div class="shot"><div class="pic"><img id="spShot" src="${p.preview}" alt="Your photo. Tap to blur a spot.">${G.shotBusy ? `<div class="busy">Blurring…</div>` : ""}</div>
                  <p class="muted">${p.faces ? `${p.faces} face${p.faces > 1 ? "s" : ""} blurred automatically. ` : ""}Tap the photo to blur anything else, like faces or car plates.</p>
                  <div class="sp-act">${p.blurs ? `<button type="button" id="spUndo">Undo blur</button>` : ""}<button type="button" id="spRetake">Retake</button><button type="button" class="danger" id="spDiscard">Discard</button></div></div>`
              : `<button type="button" class="take" id="spTake"><svg viewBox="0 0 24 24"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>Take a photo of the train<span>Photos have to be taken now, in the app. You'll have 25 minutes to post it.</span></button>`;
            const est = rz
              ? `<span class="tier ${rz.cls}">${esc(rz.name)} ×${rz.mult}</span> ${10 * rz.mult} points${rz.retiring ? " + 10 for a model being retired" : ""}, plus any bonuses`
              : `Pick the model to earn rarity points. "Not sure" scores 10.`;
            const ready = p && f.set && f.station;
            return `<section class="card fm">
                ${shot}
                <label>Line<select id="fLine">${GAME_LINES.map(c => `<option value="${c}"${c === f.line ? " selected" : ""}>${esc(LINES[c].name)}</option>`).join("")}</select></label>
                <div class="two">
                  <label>Train model<select id="fModel"><option value="">Not sure</option>${L.map(m => `<option value="${esc(m[0])}"${m[0] === f.model ? " selected" : ""}>${esc(m[0])}</option>`).join("")}</select></label>
                  <label>Set number<input type="text" id="fSet" class="mono" inputmode="text" autocapitalize="characters" maxlength="12" placeholder="e.g. 561" value="${esc(f.set)}" spellcheck="false"></label>
                </div>
                <p class="muted" style="margin-top:-6px">${rz && rz.sets ? `${esc(f.model)} sets are ${esc(rz.sets)}. ` : ""}The set number is on the front of the train, or above the doors inside.</p>
                <label>Seen at<select id="fStation"><option value="">Pick a station</option>${stations.map(n => `<option${n === f.station ? " selected" : ""}>${esc(n)}</option>`).join("")}</select></label>
                <label>Heading to<select id="fToward"><option value="">Not sure</option>${tw.map(n => `<option${n === f.toward ? " selected" : ""}>${esc(n)}</option>`).join("")}</select></label>
                <div class="est">${est}</div>
                <button type="button" class="btn" id="spSend"${ready && !G.sending ? "" : " disabled"}>${G.sending ? "Posting…" : "Post sighting"}</button>
                ${!p ? "" : !f.set ? `<p class="muted">Add the set number to post.</p>` : !f.station ? `<p class="muted">Pick the station to post.</p>` : ""}
              </section>
              <section class="card"><h2>Spotting safely</h2>${RULES}</section>`;
          }
          function saveForm(){ store.set("mrt.spotForm", {line: G.form.line, model: G.form.model, station: G.form.station, toward: G.form.toward}); }
          async function takePhoto(){
            if (G.shotBusy) return;
            G.msg = ""; G.result = null;
            const r = await bridge("takePhoto");
            if (r.code === 200){ G.photo = r.j; G.msg = ""; }
            else if (r.j && r.j.error){ G.msg = r.j.error; G.msgOk = false; }
            if (curView === "spot") renderSpot();
          }
          async function blurShot(ev){
            if (G.shotBusy || !G.photo) return;
            const b = ev.currentTarget.getBoundingClientRect();
            const x = (ev.clientX - b.left) / b.width, y = (ev.clientY - b.top) / b.height;
            G.shotBusy = true; renderSpot();
            const r = await bridge("blurPhoto", x, y);
            G.shotBusy = false;
            if (r.code === 200) G.photo = r.j; else restorePhoto();
            renderSpot();
          }
          async function sendSpot(){
            const f = G.form, set = f.set.trim().toUpperCase();
            if (!/^[A-Z]{0,3}\d{1,5}[A-Z]?(\/\d{1,5})?$/.test(set)){ G.msg = "Enter the set number, e.g. 561 or 3201/3202."; G.msgOk = false; return renderSpot(); }
            G.sending = true; G.msg = ""; renderSpot();
            const r = await bridge("submitSpot", JSON.stringify({line: f.line, model: f.model, set, station: f.station, toward: f.toward}));
            G.sending = false;
            if (signedOut(r)) return;
            if (r.code === 200){ G.result = r.j; G.photo = null; G.form.set = ""; G.feed = null; loadMe(); }
            else { G.msg = errText(r); G.msgOk = false; if (/photo/i.test(G.msg)) restorePhoto(); }
            renderSpot(); window.scrollTo(0, 0);
          }

          /* ---- leaderboard ---- */
          function boardHtml(){
            const b = G.board, per = `<div class="seg2" role="tablist" aria-label="Leaderboard period">
                <button type="button" role="tab" data-per="week" aria-selected="${G.period === "week"}">This week</button>
                <button type="button" role="tab" data-per="all" aria-selected="${G.period === "all"}">All time</button></div>`;
            if (!b) return per + `<p class="muted">Loading…</p>`;
            if (!b.players.length) return per + `<section class="card"><h2>No scores yet</h2><p class="muted">${G.period === "week" ? "Nobody has scored this week. Get in first!" : "Nobody has scored yet."}</p></section>`;
            return per + `<section class="card"><ol class="lb">${b.players.map(p => `<li class="${p.me ? "me" : ""}">
                <span class="rk">${p.rank <= 3 ? ["🥇", "🥈", "🥉"][p.rank - 1] : p.rank}</span>
                <span class="nm"><b>${esc(p.name)}${p.me ? " (you)" : ""}</b><span class="muted">${p.spots} sighting${p.spots === 1 ? "" : "s"} · ${p.sets} train${p.sets === 1 ? "" : "s"}</span></span>
                <span class="p">${p.points}</span></li>`).join("")}</ol></section>
              <p class="muted">${G.period === "week" ? "Points from the last 7 days." : "Every point since the game began."} Deleted or hidden sightings don't count.</p>`;
          }

          /* ---- me ---- */
          function meHtml(){
            const m = G.me;
            if (!m) return `<p class="muted">Loading…</p>`;
            const groups = {};
            for (const s of m.sets || []){ ((groups[s.group] ||= {})[s.model || "Not sure"] ||= []).push(s.set); }
            const lineFor = g => GAME_LINES.find(c => fleetGroup(c) === g) || g;
            const coll = Object.keys(groups).length
              ? Object.entries(groups).map(([g, models]) => `<div><h3 style="--c:var(--${esc(lineFor(g))})"><i></i>${esc(FLEET_NAMES[g] || g)}</h3>
                  ${Object.entries(models).map(([mod, sets]) => `<div class="muted" style="margin-top:6px">${esc(mod)} · ${sets.length} train${sets.length > 1 ? "s" : ""}</div>
                    <div class="sets">${sets.sort((a, b) => parseInt(a) - parseInt(b)).map(s => `<span>${esc(s)}</span>`).join("")}</div>`).join("")}</div>`).join("")
              : `<p class="muted">Trains you spot appear here. Try to catch every train on a line!</p>`;
            return `<section class="card"><h2>${esc(m.name)}</h2>
                <div class="stats"><div><b>${m.points}</b><span>points</span></div><div><b>${m.rank ? "#" + m.rank : "–"}</b><span>rank of ${m.players}</span></div>
                  <div><b>${m.weekPoints}</b><span>this week</span></div><div><b>${m.spots}</b><span>sightings</span></div><div><b>${(m.sets || []).length}</b><span>trains caught</span></div></div></section>
              <section class="card"><h2>Your collection</h2><div class="coll">${coll}</div></section>
              <section class="card"><h2>How points work</h2>${pointsTable()}<h2 style="margin-top:14px">How rare is each train?</h2>${rarityGuide()}</section>
              <section class="card set"><h2>Moderators</h2>
                ${m.admin ? `<p>You're a moderator. You can restore hidden sightings, delete any sighting, and remove players from the feed.</p>`
                  : `<p class="muted">Moderators can remove sightings and players. Have a moderator code? Enter it here.</p>
                     <div class="rowi"><input type="text" id="modCode" placeholder="Moderator code" autocomplete="off" spellcheck="false" autocapitalize="off"><button type="button" class="btn" id="modBtn">Use code</button></div>`}
                <p class="muted">Sightings with 3 reports are hidden automatically until a moderator looks at them.</p></section>
              <section class="card set"><h2>Your account</h2>
                <p class="muted">Deleting your account removes your name, every sighting and photo you posted, and your votes. It can't be undone.</p>
                <p><button type="button" class="btn ghost${G.arm === "me" ? " armed" : ""}" id="delMe" style="${G.arm === "me" ? "background:var(--bad);color:#fff" : "color:var(--bad)"}">${G.arm === "me" ? "Tap again to delete everything" : "Delete my account"}</button></p></section>`;
          }

          function wireSpot(){
            const on = (id, fn) => { const el = $(id); if (el) el.onclick = fn; };
            document.querySelectorAll("#spBody .sp-filter button").forEach(b => b.onclick = () => { G.filter = b.dataset.f; G.feed = null; renderSpot(); loadFeed(false); });
            document.querySelectorAll("#spBody [data-vote],#spBody [data-del],#spBody [data-restore],#spBody [data-ban]").forEach(b => b.onclick = () => spotAction(b));
            document.querySelectorAll("#spBody [data-full]").forEach(b => b.onclick = () => openPhoto(b.dataset.full, b.dataset.cap));
            document.querySelectorAll("#spBody [data-per]").forEach(b => b.onclick = () => { G.period = b.dataset.per; G.board = null; renderSpot(); loadBoard(); });
            on("spMore", () => loadFeed(true));
            on("spTake", takePhoto); on("spRetake", takePhoto);
            on("spDiscard", () => { APP.discardPhoto(); G.photo = null; renderSpot(); });
            on("spUndo", async () => { const r = await bridge("undoBlur"); if (r.code === 200) G.photo = r.j; renderSpot(); });
            on("spSend", sendSpot);
            on("spAgain", () => { G.result = null; renderSpot(); takePhoto(); });
            on("spToFeed", () => setSpotTab("feed"));
            const shot = $("spShot"); if (shot) shot.onclick = blurShot;
            const sel = (id, k, rerender) => { const el = $(id); if (el) el.onchange = () => {
              G.form[k] = el.value;
              if (k === "line"){ G.form.model = ""; G.form.station = ""; G.form.toward = ""; }
              saveForm(); if (rerender) renderSpot();
            }; };
            sel("fLine", "line", true); sel("fModel", "model", true); sel("fStation", "station", true); sel("fToward", "toward", false);
            const fs = $("fSet");
            if (fs) fs.oninput = () => {
              G.form.set = fs.value;
              const btn = $("spSend"); if (btn) btn.disabled = !(G.photo && G.form.set.trim() && G.form.station) || G.sending;
            };
            if (fs) fs.onchange = () => renderSpot();
            on("modBtn", async () => {
              const code = $("modCode").value.trim(); if (!code) return;
              const r = await gameCall("POST", "/admin", {code});
