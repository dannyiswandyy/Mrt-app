          /**
           * Talks to the spotting game's server. The player's sign-in token stays in here: the page never
           * sees it, it's only ever sent to the game server built into this app, and it's stored encrypted
           * with a key kept in the phone's secure key storage.
           */
          final class Game {

              /** The only requests the page may make, so it can't be used to reach anything else. */
              private static final Pattern PATHS = Pattern.compile(
                      "^/(info|join|me|admin|feed|leaderboard|(vote|spot|restore|ban)/[0-9a-f-]{36})(\\?[A-Za-z0-9=&_.-]{0,80})?$");
              private static final Pattern PHOTO_ID = Pattern.compile("^[0-9a-f-]{36}$");
              private static final String KEY_ALIAS = "game_token";
              private static String cachedToken = null;

              static final class Reply {
                  final int code;
                  final String body;

                  Reply(int code, String body) {
                      this.code = code;
                      this.body = body;
                  }
              }

              private Game() {
              }

              static boolean enabled() {
                  return BuildConfig.GAME_SERVER.startsWith("https://");
              }

              private static SharedPreferences prefs(Context c) {
                  return c.getSharedPreferences("game", Context.MODE_PRIVATE);
              }

              static String name(Context c) {
                  return prefs(c).getString("name", "");
              }

              static boolean signedIn(Context c) {
                  return !token(c).isEmpty();
              }

              /** A request from the page. Adds the sign-in token and keeps it out of what goes back. */
              static Reply call(Context c, String method, String path, String body) {
                  if (!enabled()) return new Reply(503, "{\"error\":\"The spotting game isn't set up in this version of the app.\"}");
                  if (!PATHS.matcher(path).matches() || !(method.equals("GET") || method.equals("POST") || method.equals("DELETE"))) {
                      return new Reply(400, "{\"error\":\"Not allowed.\"}");
                  }
                  boolean join = path.equals("/join");
                  if (join) body = joinBody(body);
                  Reply r = send(c, method, path, body, join ? "" : token(c));
                  try {
                      if (join && r.code == 200) {
                          JSONObject j = new JSONObject(r.body);
                          saveToken(c, j.getString("token"), j.optString("name", ""));
                          j.remove("token");
                          return new Reply(200, j.toString());
                      }
                      if (path.equals("/me") && method.equals("DELETE") && r.code == 200) signOut(c);
                      if (r.code == 401 && !join) signOut(c);   // the server no longer knows this sign-in
                  } catch (Exception e) {
                      return new Reply(0, "{\"error\":\"The game server sent something unexpected.\"}");
                  }
                  return r;
              }

              /** Posts a sighting with the waiting photo. Only the sighting's details come from the page. */
              static Reply submit(Context c, String details) {
                  String[] photo = GamePhoto.encode();
                  if (photo == null) return new Reply(400, "{\"error\":\"Take a photo first.\"}");
                  try {
                      JSONObject in = new JSONObject(details), out = new JSONObject();
                      for (String k : new String[]{"line", "set", "model", "station", "toward"}) out.put(k, in.optString(k, ""));
                      out.put("taken", GamePhoto.taken());
                      out.put("photo", photo[0]);
                      out.put("thumb", photo[1]);
