                          File tmp = new File(dir, f.getName() + "." + Thread.currentThread().getId() + ".part");
                          try (InputStream in = conn.getInputStream(); OutputStream o = new FileOutputStream(tmp)) {
                              byte[] buf = new byte[16384];
                              int n, total = 0;
                              while ((n = in.read(buf)) > 0) {
