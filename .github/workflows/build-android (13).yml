                  // Nobody can attach a debugger to the page inside this app.
                  WebView.setWebContentsDebuggingEnabled(false);

                  web = new WebView(this);
                  WebSettings s = web.getSettings();
                  s.setJavaScriptEnabled(true);
                  s.setDomStorageEnabled(true);
                  // The page only needs its own bundled file; it may not read other files on the phone.
                  s.setAllowFileAccess(false);
                  s.setAllowContentAccess(false);
                  s.setAllowFileAccessFromFileURLs(false);
                  s.setAllowUniversalAccessFromFileURLs(false);
                  s.setGeolocationEnabled(false);
                  s.setMixedContentMode(WebSettings.MIXED_CONTENT_NEVER_ALLOW);
                  if (Build.VERSION.SDK_INT >= 26) s.setSafeBrowsingEnabled(true);
                  web.addJavascriptInterface(new Bridge(), "MrtApp");

                  // Keep the tracker inside the app. Web links (https/http) open in the browser or the
                  // X/Facebook app; every other kind of link (app intents, scripts, other files) is blocked.
                  web.setWebViewClient(new WebViewClient() {
                      @Override
                      public boolean shouldOverrideUrlLoading(WebView view, WebResourceRequest request) {
                          Uri uri = request.getUrl();
                          String u = uri.toString();
                          if (u.startsWith(PAGE_DIR)) return false;
                          String scheme = uri.getScheme() == null ? "" : uri.getScheme().toLowerCase(java.util.Locale.ROOT);
                          if (scheme.equals("https") || scheme.equals("http")) {
                              try {
                                  Intent i = new Intent(Intent.ACTION_VIEW, uri);
                                  i.addCategory(Intent.CATEGORY_BROWSABLE);
                                  startActivity(i);
                              } catch (Exception ignored) {
                              }
                          }
                          return true;
                      }

                      @Override
                      public void onPageFinished(WebView view, String url) {
                          pageLoaded = true;
                          checkForUpdate();
                          if (GamePhoto.has()) view.evaluateJavascript("window.photoReady && window.photoReady()", null);
                      }

                      /** Game photos: https://photos.invalid/<id>[/thumb], fetched with the player's sign-in. */
                      @Override
                      public WebResourceResponse shouldInterceptRequest(WebView view, WebResourceRequest request) {
                          Uri u = request.getUrl();
                          if (!"https".equals(u.getScheme()) || !PHOTO_HOST.equals(u.getHost())) return null;
                          java.util.List<String> seg = u.getPathSegments();
                          InputStream in = seg.size() >= 1 && seg.size() <= 2
                                  ? Game.photo(getApplicationContext(), seg.get(0), seg.size() == 2 && "thumb".equals(seg.get(1))) : null;
                          if (in == null) {
                              return new WebResourceResponse("text/plain", "utf-8", 404, "Not found",
                                      new java.util.HashMap<>(), new java.io.ByteArrayInputStream(new byte[0]));
                          }
                          return new WebResourceResponse("image/jpeg", null, in);
                      }
                  });

                  setContentView(web);
                  web.loadUrl(PAGE_DIR + "index.html");

                  // Updates: check in the background every few hours, and ask once to allow notifications.
                  Updater.schedule(this);
                  if (Build.VERSION.SDK_INT >= 33 && !prefs.getBoolean("asked_notify", false)
                          && checkSelfPermission("android.permission.POST_NOTIFICATIONS") != android.content.pm.PackageManager.PERMISSION_GRANTED) {
                      prefs.edit().putBoolean("asked_notify", true).apply();
                      requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"}, 1);
                  }
              }

              @Override
              protected void onNewIntent(Intent intent) {
                  super.onNewIntent(intent);
                  setIntent(intent);
                  checkForUpdate();
              }

              /** Asks GitHub whether a newer version exists; if so, the page shows the update banner. */
              private void checkForUpdate() {
                  if (!Updater.enabled() || updating) return;
                  new Thread(() -> {
                      org.json.JSONObject j = Updater.newer(getApplicationContext());
                      if (j == null) return;
                      final String js = "window.updateAvailable && window.updateAvailable(" + JSONObject.quote(j.optString("versionName", "")) + ")";
                      runOnUiThread(() -> { if (pageLoaded) web.evaluateJavascript(js, null); });
                  }).start();
              }

              /** The camera app is done: make the photo safe to share, then hand the page a preview. */
              @Override
              protected void onActivityResult(int requestCode, int resultCode, Intent data) {
                  super.onActivityResult(requestCode, resultCode, data);
                  if (requestCode != TAKE_PHOTO) return;
                  final String id = photoCallback;
                  photoCallback = null;
                  final java.io.File f = PhotoProvider.file(this);
                  if (resultCode != RESULT_OK || !f.exists() || f.length() == 0) {
                      f.delete();
                      reply(id, 0, "{\"cancelled\":true}");
                      return;
                  }
                  final long when = System.currentTimeMillis();
                  new Thread(() -> {
                      try {
                          JSONObject p = GamePhoto.load(f, when);
                          reply(id, 200, p.toString());
                          if (id == null) runOnUiThread(() -> { if (pageLoaded) web.evaluateJavascript("window.photoReady && window.photoReady()", null); });
                      } catch (Throwable e) {
                          f.delete();
                          reply(id, 0, "{\"error\":\"That photo couldn't be opened. Try again.\"}");
                      }
                  }).start();
              }

              /** Sends an answer back to the page's request (no-op if the page has moved on). */
              private void reply(String id, int code, String body) {
                  if (id == null) return;
                  final String js = "window.__native(" + JSONObject.quote(id) + "," + code + "," + JSONObject.quote(body) + ")";
                  runOnUiThread(() -> web.evaluateJavascript(js, null));
              }

              /** Called by the installer if an update couldn't be installed. */
              static void reportUpdateError(String message) {
                  MainActivity a = current.get();
                  if (a == null) return;
                  a.updating = false;
                  final String js = "window.updateError && window.updateError(" + JSONObject.quote(message == null ? "" : message) + ")";
                  a.runOnUiThread(() -> a.web.evaluateJavascript(js, null));
              }

              @Override
              protected void onResume() {
                  super.onResume();
                  current = new java.lang.ref.WeakReference<>(this);
                  web.onResume();
                  if (pageLoaded) checkForUpdate();
                  // Fresh status every time the app is opened or brought back to the front.
                  if (pageLoaded) {
                      web.evaluateJavascript("window.appResume && window.appResume()", null);
                  }
              }

              @Override
              protected void onPause() {
                  web.onPause();
                  super.onPause();
              }

              /** Methods the tracker page can call as window.MrtApp.*. */
              private class Bridge {

                  @JavascriptInterface
                  public boolean hasKey() {
                      return !ltaKey().isEmpty();
                  }

                  /** LTA's official train timetable, packed into the app at build time ("" if this build has none). */
                  @JavascriptInterface
                  public String getTimetable() {
                      try (InputStream in = getAssets().open("timetable.json")) {
                          return readAll(in);
                      } catch (Exception e) {
                          return "";
                      }
                  }

                  /** Downloads and installs the new version. Progress and errors go back to the page. */
                  @JavascriptInterface
                  public void installUpdate() {
                      if (updating || !Updater.enabled()) return;
                      // Android asks once for permission to install updates from this app.
                      if (Build.VERSION.SDK_INT >= 26 && !getPackageManager().canRequestPackageInstalls()) {
                          runOnUiThread(() -> {
                              web.evaluateJavascript("window.updateNeedsPermission && window.updateNeedsPermission()", null);
                              try {
                                  startActivity(new Intent(android.provider.Settings.ACTION_MANAGE_UNKNOWN_APP_SOURCES,
                                          Uri.parse("package:" + getPackageName())));
                              } catch (Exception ignored) {
                              }
                          });
                          return;
                      }
                      updating = true;
                      new Thread(() -> {
                          try {
                              Updater.downloadAndInstall(getApplicationContext(), pct -> runOnUiThread(() ->
                                      web.evaluateJavascript("window.updateProgress && window.updateProgress(" + pct + ")", null)));
                              runOnUiThread(() -> web.evaluateJavascript("window.updateProgress && window.updateProgress(100)", null));
                          } catch (Exception e) {
                              reportUpdateError("The download didn't finish. Check your internet connection and try again.");
                          } finally {
                              updating = false;
                          }
                      }).start();
                  }

                  /** Checks for a new version now (the Settings button). Reply: {"available":bool,"version":"..."} */
                  @JavascriptInterface
                  public void checkUpdateNow(final String id) {
                      new Thread(() -> {
                          org.json.JSONObject j = Updater.newer(getApplicationContext());
                          String body = "{\"available\":" + (j != null) + ",\"version\":" + JSONObject.quote(j == null ? "" : j.optString("versionName", ""))
                                  + ",\"enabled\":" + Updater.enabled() + "}";
                          final String js = "window.__native(" + JSONObject.quote(id) + ",200," + JSONObject.quote(body) + ")";
                          runOnUiThread(() -> web.evaluateJavascript(js, null));
                      }).start();
                  }

                  /* ---------- Spotting game ---------- */

                  /** {"server":bool,"signedIn":bool,"name":"..."}: whether this build has the game, and who's playing. */
                  @JavascriptInterface
                  public String gameState() {
                      JSONObject j = new JSONObject();
                      try {
                          j.put("server", Game.enabled());
                          j.put("signedIn", Game.signedIn(getApplicationContext()));
                          j.put("name", Game.name(getApplicationContext()));
                      } catch (Exception ignored) {
                      }
                      return j.toString();
                  }

                  /** A request to the game server. The app adds the player's sign-in; the page never sees it. */
                  @JavascriptInterface
                  public void game(final String id, final String method, final String path, final String body) {
                      new Thread(() -> {
                          Game.Reply r = Game.call(getApplicationContext(), method == null ? "" : method, path == null ? "" : path, body);
                          reply(id, r.code, r.body);
                      }).start();
                  }

                  /** Opens the camera. Photos must be taken now, in the app: there's no picking from the gallery. */
                  @JavascriptInterface
                  public void takePhoto(final String id) {
                      runOnUiThread(() -> {
                          java.io.File f = PhotoProvider.file(MainActivity.this);
                          f.delete();
                          Uri out = PhotoProvider.uri();
                          Intent i = new Intent(android.provider.MediaStore.ACTION_IMAGE_CAPTURE);
                          i.putExtra(android.provider.MediaStore.EXTRA_OUTPUT, out);
                          i.setClipData(android.content.ClipData.newRawUri("photo", out));
                          i.addFlags(Intent.FLAG_GRANT_WRITE_URI_PERMISSION | Intent.FLAG_GRANT_READ_URI_PERMISSION);
                          try {
                              photoCallback = id;
                              startActivityForResult(i, TAKE_PHOTO);
                          } catch (Exception e) {
                              photoCallback = null;
                              reply(id, 0, "{\"error\":\"No camera app was found on this phone.\"}");
