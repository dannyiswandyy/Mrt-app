          cat > 'mrt-tracker-app/game/game-worker.js' <<'MRTAPP_EOF'
          /**
           * MRT Tracker spotting game: a Cloudflare Worker with a D1 database.
           *
           * Players spot real trains, take a photo in the app as proof, and score points by rarity.
           * All scoring happens here on the server, so it can't be faked from a phone.
           *
           * The app's GitHub build puts this on Cloudflare by itself (tools/deploy_game.py) and links:
           *   DB          the D1 database (created on the first build)
           *   ADMIN_CODE  the code that makes someone a moderator (from the GitHub secret GAME_ADMIN_CODE)
           *   JOIN_CODE   optional: if set (GitHub secret GAME_JOIN_CODE), players need this code to join
           * The tables create themselves on the first request.
           *
           * Security:
           *   - Only the MRT Tracker app can use it: requests from web pages are refused.
           *   - Players sign in with a random token kept inside the app; only its fingerprint is stored here.
           *   - Codes are compared in constant time; requests are rate-limited and size-limited.
           *   - Photos are checked to be real JPEGs and are only shown to signed-in players.
           *   - Moderators can hide, delete and remove players; 3 reports hide a sighting automatically.
           */

          /* ---------- Fleets (SGTrains, Nov 2026): [model, trains on the line, tag, first set, last set] ---------- */
          const NSEWL = [["R151", 106, "new"], ["C151A", 35], ["C151B", 45], ["C151C", 12]];
          const SPLRT = [["C810D", 25, "new", 58, 82], ["C810A", 16], ["C810", 41, "retiring"]];
          const FLEET = {
            NSL: NSEWL, EWL: NSEWL, CG: NSEWL,
            NEL: [["C851E", 6, "new"], ["C751A", 25], ["C751C", 18]],
            CCL: [["C851E", 23, "new", 8065, 8087], ["C830", 40], ["C830C", 24]],
            DTL: [["C951", 73, "", 9001, 9092], ["C951A", 19, "", 9001, 9092]],
            TEL: [["T251", 91, "", 2001, 2091]],
            BP: [["C801B", 19, "new", 133, 151], ["C801A", 13]],
            SE: SPLRT, SW: SPLRT, PE: SPLRT, PW: SPLRT
          };
          /* Lines that share one fleet count as one collection. */
          const GROUP = { NSL: "NSEWL", EWL: "NSEWL", CG: "NSEWL", SE: "SPLRT", SW: "SPLRT", PE: "SPLRT", PW: "SPLRT" };
          const group = line => GROUP[line] || line;

          /* ---------- Scoring ---------- */
          const BASE = 10;
          const TIERS = [                       // by the model's share of the line's fleet
            { max: 0.10, name: "Very rare", mult: 5 },
            { max: 0.20, name: "Rare", mult: 3 },
            { max: 0.40, name: "Uncommon", mult: 2 },
            { max: 1.01, name: "Common", mult: 1 }
          ];
          const BONUS = { newCatch: 15, firstEver: 25, ghost: 10, lastChance: 10, confirm: 2, maxConfirms: 3 };
          const REPEAT_HOURS = 6;               // the same player and set within this time scores 0
          const DAILY_CAP = 30;                 // scored sightings per player per day (Singapore time)
          const HIDE_AT_REPORTS = 3;
          const MAX_PHOTO = 700 * 1024, MAX_THUMB = 120 * 1024;

          const LIMITS = { join: { n: 5, ms: 3600e3 }, spot: { n: 10, ms: 60e3 }, read: { n: 120, ms: 60e3 }, photo: { n: 400, ms: 60e3 }, vote: { n: 30, ms: 60e3 } };
          const hits = new Map();

          const SCHEMA = [
            `CREATE TABLE IF NOT EXISTS users (id TEXT PRIMARY KEY, name TEXT NOT NULL UNIQUE COLLATE NOCASE, token_hash TEXT NOT NULL UNIQUE, admin INTEGER NOT NULL DEFAULT 0, banned INTEGER NOT NULL DEFAULT 0, created INTEGER NOT NULL)`,
            `CREATE TABLE IF NOT EXISTS spots (id TEXT PRIMARY KEY, user_id TEXT NOT NULL, line TEXT NOT NULL, grp TEXT NOT NULL, set_no TEXT NOT NULL, model TEXT NOT NULL, station TEXT NOT NULL, toward TEXT NOT NULL, points INTEGER NOT NULL, tier TEXT NOT NULL, bonuses TEXT NOT NULL, taken INTEGER NOT NULL, created INTEGER NOT NULL, status TEXT NOT NULL DEFAULT 'ok', photo_id TEXT NOT NULL)`,
            `CREATE INDEX IF NOT EXISTS spots_created ON spots (created)`,
            `CREATE INDEX IF NOT EXISTS spots_user ON spots (user_id, created)`,
            `CREATE INDEX IF NOT EXISTS spots_set ON spots (grp, set_no, created)`,
            `CREATE TABLE IF NOT EXISTS photos (id TEXT PRIMARY KEY, data TEXT NOT NULL, thumb TEXT NOT NULL)`,
            `CREATE TABLE IF NOT EXISTS votes (spot_id TEXT NOT NULL, user_id TEXT NOT NULL, kind TEXT NOT NULL, PRIMARY KEY (spot_id, user_id))`
          ];
          let schemaReady = false;

          export default {
            async fetch(req, env) {
              try {
                return await handle(req, env);
              } catch (e) {
                return json({ error: "Something went wrong on the game server." }, 500);
              }
            }
          };

          async function handle(req, env) {
            const url = new URL(req.url), path = url.pathname, method = req.method;
            const ip = req.headers.get("cf-connecting-ip") || "unknown";
            if (req.headers.get("origin")) return json({ error: "Not available from web pages." }, 403);
            if (!env.DB) return json({ error: "The game server isn't set up yet: add the D1 database binding named DB." }, 503);
            if (!schemaReady) { await env.DB.batch(SCHEMA.map(q => env.DB.prepare(q))); schemaReady = true; }

            if (path === "/info" && method === "GET") return json({ ok: true, needsCode: !!env.JOIN_CODE });

            if (path === "/join" && method === "POST") {
              if (!limited(ip, "join")) return json({ error: "Too many tries. Wait an hour and try again." }, 429);
              const b = await body(req);
              if (!b) return json({ error: "Couldn't read that." }, 400);
              if (env.JOIN_CODE && !same(String(b.code || ""), env.JOIN_CODE)) return json({ error: "Wrong invite code." }, 403);
              const name = String(b.name || "").trim();
              if (!/^[A-Za-z0-9][A-Za-z0-9 _.-]{1,19}$/.test(name)) return json({ error: "Pick a name of 2–20 letters or numbers." }, 400);
              if (await env.DB.prepare("SELECT 1 FROM users WHERE name = ?").bind(name).first()) return json({ error: "That name is taken. Try another." }, 409);
              const token = crypto.randomUUID() + crypto.randomUUID();
              await env.DB.prepare("INSERT INTO users (id, name, token_hash, admin, banned, created) VALUES (?, ?, ?, 0, 0, ?)")
                .bind(crypto.randomUUID(), name, await sha256(token), Date.now()).run();
              return json({ ok: true, name, token });
            }

            // Everything else needs a signed-in player.
            const user = await auth(req, env);
            if (!user) return json({ error: "Sign in to the game first." }, 401);
            if (user.banned) return json({ error: "A moderator has removed you from the game." }, 403);

            // Photos: only for signed-in players. The app keeps its own copy, as photos never change.
            let m = path.match(/^\/photo\/([0-9a-f-]{36})(\/thumb)?$/);
            if (m && method === "GET") {
              if (!limited(ip, "photo")) return json({ error: "Too many requests." }, 429);
              const row = await env.DB.prepare(`SELECT ${m[2] ? "thumb" : "data"} AS d FROM photos WHERE id = ?`).bind(m[1]).first();
              if (!row) return new Response("Not found", { status: 404, headers: SECURITY });
              return new Response(b64decode(row.d), { headers: { ...SECURITY, "content-type": "image/jpeg", "cache-control": "private, max-age=31536000, immutable" } });
            }

            if (path === "/me" && method === "GET") {
              if (!limited(ip, "read")) return json({ error: "Too many requests." }, 429);
              const all = await standings(env, 0), week = await standings(env, Date.now() - 7 * 864e5);
              const meAll = all.find(r => r.name === user.name), meWeek = week.find(r => r.name === user.name);
              const sets = await env.DB.prepare("SELECT grp, set_no, model, MAX(created) AS last, COUNT(*) AS times FROM spots WHERE user_id = ? AND status = 'ok' GROUP BY grp, set_no ORDER BY last DESC LIMIT 300")
                .bind(user.id).all();
              return json({
                name: user.name, admin: !!user.admin,
                points: meAll ? meAll.points : 0, rank: meAll ? all.indexOf(meAll) + 1 : null, players: all.length,
                weekPoints: meWeek ? meWeek.points : 0, weekRank: meWeek ? week.indexOf(meWeek) + 1 : null,
                spots: meAll ? meAll.spots : 0, sets: (sets.results || []).map(r => ({ group: r.grp, set: r.set_no, model: r.model, last: r.last, times: r.times }))
              });
            }

            if (path === "/me" && method === "DELETE") {          // delete my account and everything I posted
              const mine = await env.DB.prepare("SELECT id, photo_id FROM spots WHERE user_id = ?").bind(user.id).all();
              const stmts = [];
              for (const s of mine.results || []) {
                stmts.push(env.DB.prepare("DELETE FROM photos WHERE id = ?").bind(s.photo_id));
                stmts.push(env.DB.prepare("DELETE FROM votes WHERE spot_id = ?").bind(s.id));
              }
              stmts.push(env.DB.prepare("DELETE FROM spots WHERE user_id = ?").bind(user.id));
              stmts.push(env.DB.prepare("DELETE FROM votes WHERE user_id = ?").bind(user.id));
              stmts.push(env.DB.prepare("DELETE FROM users WHERE id = ?").bind(user.id));
              await env.DB.batch(stmts);
              return json({ ok: true });
            }

            if (path === "/admin" && method === "POST") {
              if (!limited(ip, "join")) return json({ error: "Too many tries. Wait an hour and try again." }, 429);
              const b = await body(req);
              if (!env.ADMIN_CODE || !b || !same(String(b.code || ""), env.ADMIN_CODE)) return json({ error: "Wrong moderator code." }, 403);
              await env.DB.prepare("UPDATE users SET admin = 1 WHERE id = ?").bind(user.id).run();
              return json({ ok: true });
            }

            if (path === "/spot" && method === "POST") {
              if (!limited(ip, "spot")) return json({ error: "You're logging too fast. Try again in a minute." }, 429);
              const raw = await req.text();
              if (raw.length > (MAX_PHOTO + MAX_THUMB) * 1.4 + 4096) return json({ error: "That photo is too large." }, 413);
              let b; try { b = JSON.parse(raw); } catch { return json({ error: "Couldn't read that." }, 400); }
              return logSpot(env, user, b);
            }

            if (path === "/feed" && method === "GET") {
              if (!limited(ip, "read")) return json({ error: "Too many requests." }, 429);
              const before = Number(url.searchParams.get("before")) || Date.now() + 1;
              const line = url.searchParams.get("line"), mine = url.searchParams.get("mine") === "1";
              const conds = ["s.created < ?"], args = [before];
              if (!user.admin) conds.push("s.status = 'ok'");
              if (line && FLEET[line]) { conds.push("s.line = ?"); args.push(line); }
              if (mine) { conds.push("s.user_id = ?"); args.push(user.id); }
              const rows = await env.DB.prepare(
                `SELECT s.*, u.name,
                   (SELECT COUNT(*) FROM votes v WHERE v.spot_id = s.id AND v.kind = 'confirm') AS confirms,
                   (SELECT COUNT(*) FROM votes v WHERE v.spot_id = s.id AND v.kind = 'report') AS reports,
                   (SELECT kind FROM votes v WHERE v.spot_id = s.id AND v.user_id = ?) AS my_vote
                 FROM spots s JOIN users u ON u.id = s.user_id
                 WHERE ${conds.join(" AND ")} ORDER BY s.created DESC LIMIT 30`).bind(user.id, ...args).all();
              return json({
                spots: (rows.results || []).map(r => ({
                  id: r.id, name: r.name, mine: r.user_id === user.id, line: r.line, set: r.set_no, model: r.model,
                  station: r.station, toward: r.toward, points: r.points + BONUS.confirm * Math.min(r.confirms, BONUS.maxConfirms),
                  tier: r.tier, bonuses: JSON.parse(r.bonuses), t: r.created, photo: r.photo_id,
                  confirms: r.confirms, reports: user.admin || r.user_id === user.id ? r.reports : undefined,
                  myVote: r.my_vote || null, hidden: r.status !== "ok"
                }))
              });
            }

            m = path.match(/^\/vote\/([0-9a-f-]{36})$/);
            if (m && method === "POST") {
              if (!limited(ip, "vote")) return json({ error: "Too many requests." }, 429);
              const b = await body(req), kind = b && b.kind;
              const s = await env.DB.prepare("SELECT user_id, status FROM spots WHERE id = ?").bind(m[1]).first();
              if (!s) return json({ error: "That sighting is gone." }, 404);
              if (s.user_id === user.id) return json({ error: "You can't vote on your own sighting." }, 400);
              if (kind === "none") await env.DB.prepare("DELETE FROM votes WHERE spot_id = ? AND user_id = ?").bind(m[1], user.id).run();
              else if (kind === "confirm" || kind === "report")
                await env.DB.prepare("INSERT INTO votes (spot_id, user_id, kind) VALUES (?, ?, ?) ON CONFLICT (spot_id, user_id) DO UPDATE SET kind = excluded.kind").bind(m[1], user.id, kind).run();
              else return json({ error: "Unknown vote." }, 400);
              const r = await env.DB.prepare("SELECT COUNT(*) AS n FROM votes WHERE spot_id = ? AND kind = 'report'").bind(m[1]).first();
              if (r.n >= HIDE_AT_REPORTS && s.status === "ok") await env.DB.prepare("UPDATE spots SET status = 'hidden' WHERE id = ?").bind(m[1]).run();
              return json({ ok: true });
            }

            m = path.match(/^\/spot\/([0-9a-f-]{36})$/);
            if (m && method === "DELETE") {
              const s = await env.DB.prepare("SELECT user_id, photo_id FROM spots WHERE id = ?").bind(m[1]).first();
              if (!s) return json({ ok: true });
              if (s.user_id !== user.id && !user.admin) return json({ error: "You can only remove your own sightings." }, 403);
              await env.DB.batch([
                env.DB.prepare("DELETE FROM photos WHERE id = ?").bind(s.photo_id),
                env.DB.prepare("DELETE FROM votes WHERE spot_id = ?").bind(m[1]),
                env.DB.prepare("DELETE FROM spots WHERE id = ?").bind(m[1])
              ]);
              return json({ ok: true });
            }

            m = path.match(/^\/ban\/([0-9a-f-]{36})$/);
            if (m && method === "POST") {            // remove the player who posted this sighting, and everything they posted
              if (!user.admin) return json({ error: "Only moderators can do that." }, 403);
              const s = await env.DB.prepare("SELECT user_id FROM spots WHERE id = ?").bind(m[1]).first();
              if (!s) return json({ error: "That sighting is gone." }, 404);
              if (s.user_id === user.id) return json({ error: "You can't remove yourself." }, 400);
              const theirs = await env.DB.prepare("SELECT id, photo_id FROM spots WHERE user_id = ?").bind(s.user_id).all();
              const stmts = [];
              for (const t of theirs.results || []) {
                stmts.push(env.DB.prepare("DELETE FROM photos WHERE id = ?").bind(t.photo_id));
                stmts.push(env.DB.prepare("DELETE FROM votes WHERE spot_id = ?").bind(t.id));
              }
              stmts.push(env.DB.prepare("DELETE FROM spots WHERE user_id = ?").bind(s.user_id));
              stmts.push(env.DB.prepare("DELETE FROM votes WHERE user_id = ?").bind(s.user_id));
              stmts.push(env.DB.prepare("UPDATE users SET banned = 1, admin = 0 WHERE id = ?").bind(s.user_id));
              await env.DB.batch(stmts);
              return json({ ok: true });
            }

            m = path.match(/^\/restore\/([0-9a-f-]{36})$/);
            if (m && method === "POST") {
              if (!user.admin) return json({ error: "Only moderators can do that." }, 403);
              await env.DB.batch([
                env.DB.prepare("UPDATE spots SET status = 'ok' WHERE id = ?").bind(m[1]),
                env.DB.prepare("DELETE FROM votes WHERE spot_id = ? AND kind = 'report'").bind(m[1])
              ]);
              return json({ ok: true });
            }

            if (path === "/leaderboard" && method === "GET") {
              if (!limited(ip, "read")) return json({ error: "Too many requests." }, 429);
              const week = url.searchParams.get("period") === "week";
              const rows = await standings(env, week ? Date.now() - 7 * 864e5 : 0);
              return json({ period: week ? "week" : "all", players: rows.slice(0, 50).map((r, i) => ({ ...r, rank: i + 1, me: r.name === user.name })) });
            }

            return json({ error: "Not found." }, 404);
          }

          /* ---------- Logging a sighting ---------- */
          async function logSpot(env, user, b) {
            const line = String(b.line || "").toUpperCase();
            if (!FLEET[line]) return json({ error: "Pick a line." }, 400);
            const set = String(b.set || "").trim().toUpperCase();
            if (!/^[A-Z]{0,3}\d{1,5}[A-Z]?(\/\d{1,5})?$/.test(set)) return json({ error: "Enter the set number, e.g. 561 or 3201/3202." }, 400);
            const station = clean(b.station), toward = clean(b.toward);
            if (!station) return json({ error: "Pick the station where you saw it." }, 400);
            const taken = Number(b.taken) || 0, now = Date.now();
            if (taken > now + 2 * 60e3 || now - taken > 30 * 60e3) return json({ error: "Photos must be taken in the app in the last 30 minutes." }, 400);

            const fleet = FLEET[line];
            let model = String(b.model || "");
            const entry = fleet.find(f => f[0] === model);
            if (model && !entry) return json({ error: `${model} doesn't run on this line.` }, 400);
            const num = parseInt(set.replace(/^[A-Z]+/, ""), 10);
            if (entry && entry[3] && (num < entry[3] || num > entry[4])) return json({ error: `Set ${set} isn't a ${model} (sets ${entry[3]}–${entry[4]}).` }, 400);

            const bytes = jpeg(b.photo, 2000, MAX_PHOTO), thumb = jpeg(b.thumb, 500, MAX_THUMB);
            if (!bytes || !thumb) return json({ error: "That photo couldn't be read." }, 400);

            // Rarity tier from the model's share of the line's fleet.
            const total = fleet.reduce((a, f) => a + f[1], 0);
            let tier = { name: "Unconfirmed", mult: 1 };
            if (entry) tier = TIERS.find(t => entry[1] / total < t.max);
            const grp = group(line), bonuses = [];
            let points = BASE * tier.mult;

            const dayStart = Math.floor((now + 8 * 3600e3) / 864e5) * 864e5 - 8 * 3600e3;
            const [repeat, mineBefore, anyBefore, recent, today] = await Promise.all([
              env.DB.prepare("SELECT 1 FROM spots WHERE user_id = ? AND grp = ? AND set_no = ? AND created > ?").bind(user.id, grp, set, now - REPEAT_HOURS * 3600e3).first(),
              env.DB.prepare("SELECT 1 FROM spots WHERE user_id = ? AND grp = ? AND set_no = ? AND status = 'ok'").bind(user.id, grp, set).first(),
              env.DB.prepare("SELECT 1 FROM spots WHERE grp = ? AND set_no = ? AND status = 'ok'").bind(grp, set).first(),
              env.DB.prepare("SELECT 1 FROM spots WHERE grp = ? AND set_no = ? AND status = 'ok' AND created > ?").bind(grp, set, now - 14 * 864e5).first(),
              env.DB.prepare("SELECT COUNT(*) AS n FROM spots WHERE user_id = ? AND created >= ? AND points > 0").bind(user.id, dayStart).first()
            ]);

            if (repeat) { points = 0; bonuses.push(`Already logged in the last ${REPEAT_HOURS} hours`); }
            else if (today && today.n >= DAILY_CAP) { points = 0; bonuses.push(`Daily limit of ${DAILY_CAP} scored sightings reached`); }
            else if (!entry) bonuses.push("Pick the train model to earn rarity points and bonuses");
            else {
              if (!anyBefore) { points += BONUS.firstEver; bonuses.push(`First ever sighting +${BONUS.firstEver}`); }
              else if (!recent) { points += BONUS.ghost; bonuses.push(`Not seen in 2 weeks +${BONUS.ghost}`); }
              if (!mineBefore) { points += BONUS.newCatch; bonuses.push(`New catch for you +${BONUS.newCatch}`); }
              if (entry && entry[2] === "retiring") { points += BONUS.lastChance; bonuses.push(`Last chance: being retired +${BONUS.lastChance}`); }
            }

            const id = crypto.randomUUID(), photoId = crypto.randomUUID();
            await env.DB.batch([
              env.DB.prepare("INSERT INTO photos (id, data, thumb) VALUES (?, ?, ?)").bind(photoId, b64encode(bytes), b64encode(thumb)),
              env.DB.prepare(`INSERT INTO spots (id, user_id, line, grp, set_no, model, station, toward, points, tier, bonuses, taken, created, status, photo_id)
                              VALUES (?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, ?, 'ok', ?)`)
                .bind(id, user.id, line, grp, set, model, station, toward, points, tier.name, JSON.stringify(bonuses), taken, now, photoId)
            ]);
            return json({ ok: true, id, points, tier: tier.name, mult: tier.mult, bonuses });
          }

          /* Points per player since a time: each sighting's points plus confirmation bonuses. */
          async function standings(env, since) {
            const r = await env.DB.prepare(
              `SELECT u.name AS name,
                      SUM(s.points + ${BONUS.confirm} * MIN(IFNULL(c.n, 0), ${BONUS.maxConfirms})) AS points,
                      COUNT(*) AS spots, COUNT(DISTINCT s.grp || ':' || s.set_no) AS sets
               FROM spots s JOIN users u ON u.id = s.user_id AND u.banned = 0
               LEFT JOIN (SELECT spot_id, COUNT(*) AS n FROM votes WHERE kind = 'confirm' GROUP BY spot_id) c ON c.spot_id = s.id
               WHERE s.status = 'ok' AND s.created >= ?
               GROUP BY u.id ORDER BY points DESC, spots DESC, u.name LIMIT 500`).bind(since).all();
            return r.results || [];
          }

          /* ---------- helpers ---------- */
          async function auth(req, env) {
            const h = req.headers.get("authorization") || "";
            const m = h.match(/^Bearer ([0-9a-f-]{72})$/);
            if (!m) return null;
            return env.DB.prepare("SELECT id, name, admin, banned FROM users WHERE token_hash = ?").bind(await sha256(m[1])).first();
          }
          /* A base64 JPEG within a size range, as bytes; null if it isn't one. */
          function jpeg(s, min, max) {
            let b;
            try { b = b64decode(String(s || "")); } catch { return null; }
            return b.length >= min && b.length <= max && b[0] === 0xff && b[1] === 0xd8 && b[2] === 0xff ? b : null;
          }
          async function body(req) {
            const t = await req.text();
            if (t.length > 4096) return null;
            try { return JSON.parse(t); } catch { return null; }
          }
          const clean = (v, max = 60) => String(v || "").replace(/[\u0000-\u001f\u007f<>]/g, " ").replace(/\s+/g, " ").trim().slice(0, max);
          async function sha256(s) {
            const d = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
            return [...new Uint8Array(d)].map(x => x.toString(16).padStart(2, "0")).join("");
          }
          function same(a, b) {
            a = String(a); b = String(b);
            let d = a.length ^ b.length;
            for (let i = 0; i < Math.max(a.length, b.length); i++) d |= (a.charCodeAt(i) || 0) ^ (b.charCodeAt(i) || 0);
            return d === 0;
          }
          function b64decode(s) {
            const bin = atob(s.replace(/^data:image\/jpeg;base64,/, ""));
            const out = new Uint8Array(bin.length);
            for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
            return out;
          }
          function b64encode(bytes) {
            let s = "";
            for (let i = 0; i < bytes.length; i += 0x8000) s += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
            return btoa(s);
          }
          function limited(ip, kind) {
            const { n, ms } = LIMITS[kind], key = kind + ":" + ip, now = Date.now();
            const recent = (hits.get(key) || []).filter(t => now - t < ms);
            if (recent.length >= n) { hits.set(key, recent); return false; }
            recent.push(now); hits.set(key, recent);
            if (hits.size > 5000) hits.clear();
            return true;
          }
          const SECURITY = { "x-content-type-options": "nosniff", "referrer-policy": "no-referrer" };
          const json = (o, status = 200) => new Response(JSON.stringify(o), {
            status, headers: { "content-type": "application/json", "cache-control": "no-store", ...SECURITY }
          });
          MRTAPP_EOF
          mkdir -p 'mrt-tracker-app'
          cat > 'mrt-tracker-app/gradle.properties' <<'MRTAPP_EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=false
          MRTAPP_EOF
          mkdir -p 'mrt-tracker-app'
          cat > 'mrt-tracker-app/settings.gradle' <<'MRTAPP_EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "MRT Tracker"
          include ':app'
          MRTAPP_EOF
          mkdir -p 'mrt-tracker-app/tools'
          cat > 'mrt-tracker-app/tools/build_timetable.py' <<'MRTAPP_EOF'
          """Download LTA's official train timetable (GTFS Schedule (Train), LTA DataMall) and pack it for the app.

          Runs on GitHub during every build:  python3 tools/build_timetable.py <app project folder>

          Writes app/src/main/assets/timetable.json, which the app uses for exact train times. If anything
          goes wrong (no connection, unexpected format) it writes no timetable and the app falls back to
          estimates, so the build never fails because of this step. A report of what matched is written to
          the GitHub job summary.

          timetable.json:
            feed:     {source, built, files}
            services: [[service_id, "1111100" (Mon..Sun), start "YYYYMMDD", end "YYYYMMDD"], ...]
            except:   {"YYYYMMDD": [[service index, 1 = added | 2 = removed], ...]}
            lines:    {NSL: {pats: [[first station index, step +1/-1, [arrive s], [depart s]], ...],
                             trips: [[start s since midnight, pattern index, service index], ...]}, ...}
          """
          import csv, hashlib, io, json, os, re, sys, time, urllib.request, zipfile

          ROOT = sys.argv[1] if len(sys.argv) > 1 else "."
          OUT = os.path.join(ROOT, "app/src/main/assets/timetable.json")
          LINES = json.load(open(os.path.join(ROOT, "tools/lines.json")))
          SUMMARY = os.environ.get("GITHUB_STEP_SUMMARY")
          API = "https://datamall2.mytransport.sg/ltaodataservice/GTFSScheduleTrain"
          report = []

          def say(line=""):
              print(line)
              report.append(line)

          def finish(ok):
              if SUMMARY:
                  with open(SUMMARY, "a") as f:
                      f.write("## LTA train timetable\n\n" + "\n".join(report) + "\n")
              if not ok and os.path.exists(OUT):
                  os.remove(OUT)
              sys.exit(0)

          # ---------- the LTA key (stored scrambled in app/build.gradle) ----------
          def lta_key():
              g = open(os.path.join(ROOT, "app/build.gradle")).read()
              m = re.search(r"LTA_KEY_X',\s*'\"([0-9a-f]+)\"'", g)
              if not m:
                  return ""
              mask = hashlib.sha256(b"sg.mrttracker.app").digest()
              hx = m.group(1)
              key = bytes(int(hx[i:i + 2], 16) ^ mask[(i // 2) % 32] for i in range(0, len(hx), 2)).decode()
              print("::add-mask::" + key)
              return key

          def http(url, headers=None, tries=3):
              for t in range(tries):
                  try:
                      req = urllib.request.Request(url, headers=headers or {})
                      with urllib.request.urlopen(req, timeout=60) as r:
                          return r.read()
                  except Exception as e:
                      if t == tries - 1:
                          raise
                      time.sleep(3 * (t + 1))

          def find_link(o):
              if isinstance(o, str):
                  return o if o.startswith("https://") and "gtfs" in o.lower() else None
              if isinstance(o, dict):
                  for k in ("Link", "link"):
                      if isinstance(o.get(k), str) and o[k].startswith("https://"):
                          return o[k]
                  o = list(o.values())
              if isinstance(o, list):
                  for v in o:
                      r = find_link(v)
                      if r:
                          return r
              return None

          # ---------- station matching ----------
          def norm(s):
              s = s.lower().replace("&", "and")
              s = re.sub(r"\([^)]*\)", " ", s)
              s = re.sub(r"\b(mrt|lrt)\b|\bstation\b|\binterchange\b|\bplatform\b.*$", " ", s)
              return re.sub(r"[^a-z0-9]", "", s)

          NAME_IDX, CODE_IDX = {}, {}         # normalised name / code -> [(line, index)]
          for line, L in LINES.items():
              for i, (code, name) in enumerate(L["stations"]):
                  NAME_IDX.setdefault(norm(name), []).append((line, i))
                  CODE_IDX.setdefault(code.upper(), []).append((line, i))
          CODE_ALIASES = {"CE1": "CC34", "CE2": "CC33"}
          CODE_RE = re.compile(r"\b(NS|EW|CG|NE|CC|CE|DT|TE|BP|SE|SW|PE|PW)\s?(\d{1,2})\b|\b(STC|PTC)\b", re.I)

          def stop_candidates(stop, stops):
              """All (line, index) this GTFS stop could be, from station codes first, then names."""
              texts = [stop.get("stop_code", ""), stop.get("stop_id", ""), stop.get("stop_name", "")]
              parent = stops.get(stop.get("parent_station") or "")
              if parent:
                  texts += [parent.get("stop_code", ""), parent.get("stop_id", ""), parent.get("stop_name", "")]
              found = []
              for t in texts:
                  for m in CODE_RE.finditer(t or ""):
                      code = (m.group(1) + m.group(2)).upper() if m.group(1) else m.group(3).upper()
                      code = CODE_ALIASES.get(code, code)
                      found += CODE_IDX.get(code, [])
              names = [parent.get("stop_name", "")] if parent else []
              names.append(stop.get("stop_name", ""))
              for n in names:
                  found += NAME_IDX.get(norm(n or ""), [])
              return sorted(set(found))

          def legs_for(seq, line):
              """Split one trip's stops into runs that move one way along `line`. seq: [(cands_on_line, arr, dep)]."""
              legs, cur = [], None
              for cands, arr, dep in seq:
                  if cur is None:
                      cur = {"rows": [(cands, arr, dep)], "idx": [], "dir": 0}
                      continue
                  if not cur["idx"]:
                      prev = cur["rows"][-1][0]
                      pairs = [(abs(a - b), a, b) for a in prev for b in cands if a != b]
                      if not pairs:
                          cur = {"rows": [(cands, arr, dep)], "idx": [], "dir": 0}
                          continue
                      _, a, b = min(pairs)
                      cur["rows"] = [cur["rows"][-1], (cands, arr, dep)]
                      cur["idx"] = [a, b]
                      cur["dir"] = 1 if b > a else -1
                      continue
                  last, d = cur["idx"][-1], cur["dir"]
                  ahead = [x for x in cands if (x - last) * d > 0]
                  if ahead:
                      cur["rows"].append((cands, arr, dep))
                      cur["idx"].append(min(ahead, key=lambda x: abs(x - last)))
                  else:                                   # the train turns: start a new run from the last stop
                      legs.append(cur)
                      prow = cur["rows"][-1]
                      cur = {"rows": [prow], "idx": [], "dir": 0}
                      # a station can appear twice on a line (Bukit Panjang on the BP loop): pick the closest pair
                      pairs = [(abs(a - b), a, b) for a in prow[0] for b in cands if b != a]
                      if pairs:
                          _, a, b = min(pairs)
                          cur["rows"].append((cands, arr, dep))
                          cur["idx"] = [a, b]
                          cur["dir"] = 1 if b > a else -1
                      else:
                          cur = {"rows": [(cands, arr, dep)], "idx": [], "dir": 0}
              if cur and cur["idx"]:
                  legs.append(cur)
              return legs

          def secs(t):
              h, m, s = (t or "").strip().split(":")
              return int(h) * 3600 + int(m) * 60 + int(s)

          def main():
              local = os.environ.get("MRT_GTFS_ZIP")      # for testing with a file instead of downloading
              if local:
                  data = open(local, "rb").read()
                  z = zipfile.ZipFile(io.BytesIO(data))
                  return process(z, data)
              key = lta_key()
              if not key:
                  say("⚠️ No LTA key found in the app, so the timetable was skipped. The app will use estimates.")
                  finish(False)
              try:
                  meta = http(API, {"AccountKey": key, "accept": "application/json"})
                  link = find_link(json.loads(meta))
                  if not link:
                      raise ValueError("LTA's reply had no download link: " + meta[:200].decode("utf-8", "replace"))
                  data = http(link)
                  z = zipfile.ZipFile(io.BytesIO(data))
              except Exception as e:
                  say(f"⚠️ Couldn't download the timetable from LTA ({e}). The app will use estimates.")
                  finish(False)

              return process(z, data)

          def process(z, data):
              def table(name):
                  n = next((x for x in z.namelist() if x.split("/")[-1].lower() == name), None)
                  if not n:
                      return []
                  txt = z.read(n).decode("utf-8-sig", "replace")
                  return list(csv.DictReader(io.StringIO(txt)))

              say(f"Downloaded **{len(data) // 1024} KB** from LTA DataMall.")
              files = sorted(x.split("/")[-1] for x in z.namelist())
              say("Files: " + ", ".join(f"`{f}`" for f in files))
              say("")
              say("<details><summary>First lines of each file</summary>\n")
              for n in z.namelist():
                  if n.endswith(".txt"):
                      head = z.read(n).decode("utf-8-sig", "replace").splitlines()[:3]
                      say(f"**{n}**\n```\n" + "\n".join(h[:300] for h in head) + "\n```")
              say("</details>\n")

              stops = {s["stop_id"]: s for s in table("stops.txt")}
              trips = {t["trip_id"]: t for t in table("trips.txt")}
              freqs = {}
              for f in table("frequencies.txt"):
                  freqs.setdefault(f["trip_id"], []).append(f)
              st_by_trip = {}
              for r in table("stop_times.txt"):
                  st_by_trip.setdefault(r["trip_id"], []).append(r)
              cal = table("calendar.txt")
              cdates = table("calendar_dates.txt")

              services, svc_index = [], {}
              def svc(sid):
                  if sid not in svc_index:
                      svc_index[sid] = len(services)
                      services.append([sid, "0000000", "19000101", "29991231"])
                  return svc_index[sid]
              for c in cal:
                  i = svc(c["service_id"])
                  days = "".join("1" if c.get(d, "0").strip() == "1" else "0"
                                 for d in ("monday", "tuesday", "wednesday", "thursday", "friday", "saturday", "sunday"))
                  services[i][1:] = [days, c.get("start_date", "19000101").strip(), c.get("end_date", "29991231").strip()]
              exc = {}
              for c in cdates:
                  exc.setdefault(c["date"].strip(), []).append([svc(c["service_id"]), int(c.get("exception_type", "1") or 1)])

              stop_cands = {sid: stop_candidates(s, stops) for sid, s in stops.items()}
              unmatched_stops = sorted({stops[sid].get("stop_name", sid) for sid, c in stop_cands.items()
                                        if not c and stops[sid].get("location_type", "0") in ("", "0")})

              out = {ln: {"pats": [], "trips": []} for ln in LINES}
              pat_idx = {ln: {} for ln in LINES}
              per_line = {ln: 0 for ln in LINES}
              skipped = []

              for tid, rows in st_by_trip.items():
                  if tid not in trips:
                      continue
                  rows.sort(key=lambda r: int(r["stop_sequence"]))
                  cands = [stop_cands.get(r["stop_id"], []) for r in rows]
                  # which line covers most of this trip's stops?
                  score = {}
                  for cs in cands:
                      for ln in {c[0] for c in cs}:
                          score[ln] = score.get(ln, 0) + 1
                  if not score:
                      skipped.append((tid, "no stops matched"))
                      continue
                  line = max(score, key=lambda l: (score[l], -len(LINES[l]["stations"])))
                  if score[line] < 2 or score[line] < 0.9 * len(rows):
                      skipped.append((tid, f"only {score[line]}/{len(rows)} stops on {line}"))
                      continue
                  seq = []
                  for r, cs in zip(rows, cands):
                      on = sorted(i for l, i in cs if l == line)
                      if not on:
                          continue
                      try:
                          arr = secs(r.get("arrival_time") or r.get("departure_time"))
                          dep = secs(r.get("departure_time") or r.get("arrival_time"))
                      except Exception:
                          continue
                      seq.append((on, arr, dep))
                  sid = svc(trips[tid]["service_id"])
                  trip_t0 = seq[0][2] if seq else 0
                  starts_extra = []
                  for f in freqs.get(tid, []):
                      a, b, h = secs(f["start_time"]), secs(f["end_time"]), int(f["headway_secs"])
                      starts_extra += list(range(a, b, max(30, h)))
                  for leg in legs_for(seq, line):
                      idx, d = leg["idx"], leg["dir"]
                      t0 = leg["rows"][0][2]
                      times = {}
                      for (cs, arr, dep), i in zip(leg["rows"], idx):
                          times[i] = (arr - t0, dep - t0)
                      times[idx[0]] = (0, 0)
                      span = list(range(idx[0], idx[-1] + d, d))
                      known = [i for i in span if i in times]
                      arrs, deps = [], []
                      for i in span:
                          if i in times:
                              a, b = times[i]
                          else:                           # not listed (shouldn't happen): interpolate
                              lo = max(k for k in known if (k - i) * d < 0)
                              hi = min(k for k in known if (k - i) * d > 0)
                              frac = abs(i - lo) / abs(hi - lo)
                              a = b = round(times[lo][1] + frac * (times[hi][0] - times[lo][1]))
                          arrs.append(a)
                          deps.append(max(a, b))
                      key = (idx[0], d, tuple(arrs), tuple(deps))
                      if key not in pat_idx[line]:
                          pat_idx[line][key] = len(out[line]["pats"])
                          out[line]["pats"].append([idx[0], d, arrs, deps])
                      p = pat_idx[line][key]
                      if starts_extra:
                          for s0 in starts_extra:         # frequency-based trips: one run per interval
                              out[line]["trips"].append([s0 + (t0 - trip_t0), p, sid])
                      else:
                          out[line]["trips"].append([t0, p, sid])
                      per_line[line] += 1

              for ln in out:
                  out[ln]["trips"].sort()
              lines_ok = [ln for ln in out if out[ln]["trips"]]

              say("| Line | Train runs | Stop patterns |")
              say("|---|---|---|")
              for ln in LINES:
                  say(f"| {ln} | {len(out[ln]['trips'])} | {len(out[ln]['pats'])} |")
              say("")
              say(f"Service calendars: {len(services)} · dates with exceptions: {len(exc)}")
              if unmatched_stops:
                  say(f"\n⚠️ Stops not matched to a station ({len(unmatched_stops)}): " + ", ".join(unmatched_stops[:40]))
              if skipped:
                  say(f"\n⚠️ Trips skipped: {len(skipped)} of {len(st_by_trip)}. Examples: " +
                      "; ".join(f"`{t}` ({why})" for t, why in skipped[:8]))
              if not lines_ok:
                  say("\n⚠️ No lines could be matched, so the app will use estimates.")
                  finish(False)

              feed = {"source": "LTA DataMall, GTFS Schedule (Train)", "built": time.strftime("%Y-%m-%d", time.gmtime()),
                      "lines": lines_ok}
              res = {"feed": feed, "services": services, "except": exc,
                     "lines": {ln: out[ln] for ln in lines_ok}}
              os.makedirs(os.path.dirname(OUT), exist_ok=True)
              with open(OUT, "w") as f:
                  json.dump(res, f, separators=(",", ":"))
              say(f"\n✅ Timetable packed for {len(lines_ok)} lines ({os.path.getsize(OUT) // 1024} KB). "
                  f"Lines without data use estimates: {', '.join(l for l in LINES if l not in lines_ok) or 'none'}.")
              finish(True)

          if __name__ == "__main__":
              try:
                  main()
              except SystemExit:
                  raise
              except Exception as e:
                  say(f"⚠️ The timetable step hit an error ({type(e).__name__}: {e}). The app will use estimates.")
                  finish(False)
          MRTAPP_EOF
          mkdir -p 'mrt-tracker-app/tools'
          cat > 'mrt-tracker-app/tools/deploy_game.py' <<'MRTAPP_EOF'
          #!/usr/bin/env python3
          """Puts the spotting game's server on Cloudflare and tells the app build where it is.

          Runs in the GitHub build. Reads these GitHub secrets (as environment variables):
            CLOUDFLARE_API_TOKEN   a Cloudflare API token with Workers Scripts: Edit, D1: Edit and Account Settings: Read
            CLOUDFLARE_ACCOUNT_ID  optional: which Cloudflare account to use (otherwise the token's first account)
            GAME_ADMIN_CODE        optional: the moderator code
            GAME_JOIN_CODE         optional: an invite code players need to join
            GAME_SERVER            optional: use a game server you set up yourself instead

          Writes GAME_SERVER=https://... to $GITHUB_ENV for the app build. Never fails the build:
          if anything goes wrong, the app is built without the game and the reason is in the build summary.
          """
          import json
          import os
          import sys
          import time
          import urllib.error
          import urllib.request
          import uuid

          API = os.environ.get("CF_API", "https://api.cloudflare.com/client/v4")
          NAME = "mrt-tracker-game"
          HERE = os.path.dirname(os.path.abspath(__file__))
          WORKER = os.path.join(HERE, "..", "game", "game-worker.js")
          report = []


          def say(line):
              print(line)
              report.append(line)


          class CfError(Exception):
              pass


          def cf(method, path, body=None, raw=None, ctype=None, token=None):
              data, headers = None, {"Authorization": "Bearer " + token, "User-Agent": "mrt-tracker-build"}
              if body is not None:
                  data, headers["Content-Type"] = json.dumps(body).encode(), "application/json"
              if raw is not None:
                  data, headers["Content-Type"] = raw, ctype
              req = urllib.request.Request(API + path, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      out = json.loads(r.read() or b"{}")
              except urllib.error.HTTPError as e:
                  try:
                      out = json.loads(e.read() or b"{}")
                  except Exception:
                      out = {}
                  errs = "; ".join(f"{x.get('code')}: {x.get('message')}" for x in out.get("errors", [])) or f"HTTP {e.code}"
                  raise CfError(errs)
              if not out.get("success", True):
                  raise CfError("; ".join(f"{x.get('code')}: {x.get('message')}" for x in out.get("errors", [])))
              return out.get("result")


          def multipart(parts):
              """parts: [(name, filename, content_type, bytes)] -> (body, content_type)"""
              b = "----mrt" + uuid.uuid4().hex
              out = bytearray()
              for name, filename, ctype, data in parts:
                  out += f"--{b}\r\n".encode()
                  disp = f'form-data; name="{name}"' + (f'; filename="{filename}"' if filename else "")
                  out += f"Content-Disposition: {disp}\r\nContent-Type: {ctype}\r\n\r\n".encode()
                  out += data + b"\r\n"
              out += f"--{b}--\r\n".encode()
              return bytes(out), "multipart/form-data; boundary=" + b


          def deploy(token):
              account = os.environ.get("CLOUDFLARE_ACCOUNT_ID", "").strip()
              if not account:
                  accounts = cf("GET", "/accounts?per_page=50", token=token) or []
                  if not accounts:
                      raise CfError("This API token can't see any Cloudflare account. Give it Account Settings: Read.")
                  account = accounts[0]["id"]
                  if len(accounts) > 1:
                      say(f"- The token can see {len(accounts)} accounts; using **{accounts[0].get('name', account)}**.")

              # Your workers.dev address (made once, the first time).
              try:
                  sub = (cf("GET", f"/accounts/{account}/workers/subdomain", token=token) or {}).get("subdomain")
              except CfError:
                  sub = None
              if not sub:
                  sub = "mrt-" + uuid.uuid4().hex[:8]
                  cf("PUT", f"/accounts/{account}/workers/subdomain", body={"subdomain": sub}, token=token)
                  say(f"- Made your workers.dev address: **{sub}.workers.dev**")
              server = f"https://{NAME}.{sub}.workers.dev"

              try:
                  # The database (made once, the first time).
                  found = cf("GET", f"/accounts/{account}/d1/database?name={NAME}", token=token) or []
                  db = next((d["uuid"] for d in found if d.get("name") == NAME), None)
                  if not db:
                      db = cf("POST", f"/accounts/{account}/d1/database", body={"name": NAME}, token=token)["uuid"]
                      say(f"- Made the game database **{NAME}**")

                  # Upload the server with its database and codes.
                  bindings = [{"type": "d1", "name": "DB", "id": db}]
                  for env_name, binding in (("GAME_ADMIN_CODE", "ADMIN_CODE"), ("GAME_JOIN_CODE", "JOIN_CODE")):
                      v = os.environ.get(env_name, "").strip()
                      if v:
                          bindings.append({"type": "secret_text", "name": binding, "text": v})
                  meta = {"main_module": "game-worker.js", "compatibility_date": "2025-09-01", "bindings": bindings}
                  with open(WORKER, "rb") as f:
                      code = f.read()
                  body, ctype = multipart([
                      ("metadata", None, "application/json", json.dumps(meta).encode()),
                      ("game-worker.js", "game-worker.js", "application/javascript+module", code),
                  ])
                  cf("PUT", f"/accounts/{account}/workers/scripts/{NAME}", raw=body, ctype=ctype, token=token)
                  cf("POST", f"/accounts/{account}/workers/scripts/{NAME}/subdomain", body={"enabled": True, "previews_enabled": False}, token=token)
                  say(f"- Game server updated at **{server}**")
                  say("- Moderator code: " + ("set" if os.environ.get("GAME_ADMIN_CODE", "").strip() else "**not set** (add the GAME_ADMIN_CODE secret to have moderators)"))
                  say("- Invite code: " + ("players need it to join" if os.environ.get("GAME_JOIN_CODE", "").strip() else "none, so anyone with the app can join"))
              except CfError as e:
                  # The server from an earlier build keeps running at the same address.
                  say(f"- ⚠️ Couldn't update the game server ({e}). The app still uses **{server}**.")
                  print(f"::warning::Couldn't update the game server: {e}")

              # A brand-new address can take a minute to start working.
              for _ in range(6):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(server + "/info", headers={"User-Agent": "mrt-tracker-build"}), timeout=15) as r:
                          if json.loads(r.read()).get("ok"):
                              say("- The game server answered ✅")
                              break
                  except Exception:
                      pass
                  time.sleep(10)
              else:
                  say("- The game server didn't answer yet. New addresses can take a few minutes; the app will connect once it's up.")
              return server


          def main():
              server = ""
              token = os.environ.get("CLOUDFLARE_API_TOKEN", "").strip()
              own = os.environ.get("GAME_SERVER", "").strip().rstrip("/")
              say("## Spotting game")
              if own:
                  if own.startswith("https://") and "/" not in own[8:] and " " not in own:
                      server = own
                      say(f"- Using your own game server **{server}**")
                  else:
                      say("- ⚠️ The GAME_SERVER secret must look like https://name.example.workers.dev. The app is built without the game.")
              elif token:
                  try:
                      server = deploy(token)
                  except CfError as e:
                      say(f"- ⚠️ Couldn't set up the game server on Cloudflare: {e}. The app is built without the game.")
                      print(f"::warning::Couldn't set up the game server: {e}")
                  except Exception as e:
                      say(f"- ⚠️ Couldn't set up the game server: {e}. The app is built without the game.")
              else:
                  say("- Not set up: add the CLOUDFLARE_API_TOKEN secret and the next build puts the game online.")

              if os.environ.get("GITHUB_ENV"):
                  with open(os.environ["GITHUB_ENV"], "a") as f:
                      f.write(f"GAME_SERVER={server}\n")
              if os.environ.get("GITHUB_STEP_SUMMARY"):
                  with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
                      f.write("\n".join(report) + "\n")
              print("GAME_SERVER=" + server)


          if __name__ == "__main__":
              main()
              sys.exit(0)
          MRTAPP_EOF
