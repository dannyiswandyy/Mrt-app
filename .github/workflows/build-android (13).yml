              }

              /* ---------- inside ---------- */

              private static String joinBody(String body) {
                  try {
                      JSONObject in = new JSONObject(body), out = new JSONObject();
                      out.put("name", in.optString("name", ""));
                      out.put("code", in.optString("code", ""));
                      return out.toString();
                  } catch (Exception e) {
                      return "{}";
                  }
              }

              private static HttpURLConnection open(String method, String path, String token) throws java.io.IOException {
                  HttpURLConnection conn = (HttpURLConnection) new URL(BuildConfig.GAME_SERVER + path).openConnection();
                  conn.setInstanceFollowRedirects(false);    // the token never goes anywhere else
                  conn.setConnectTimeout(12000);
                  conn.setReadTimeout(30000);
                  conn.setRequestMethod(method);
                  conn.setRequestProperty("User-Agent", "MRTTracker/1.0 (Android)");
                  conn.setRequestProperty("Accept", "application/json");
                  if (!token.isEmpty()) conn.setRequestProperty("Authorization", "Bearer " + token);
                  return conn;
              }

              private static Reply send(Context c, String method, String path, String body, String token) {
                  HttpURLConnection conn = null;
                  try {
                      conn = open(method, path, token);
                      if (body != null && method.equals("POST")) {
                          byte[] b = body.getBytes(StandardCharsets.UTF_8);
                          conn.setDoOutput(true);
                          conn.setRequestProperty("Content-Type", "application/json");
                          conn.setFixedLengthStreamingMode(b.length);
                          try (OutputStream o = conn.getOutputStream()) {
                              o.write(b);
                          }
                      }
                      int code = conn.getResponseCode();
                      InputStream in = code >= 400 ? conn.getErrorStream() : conn.getInputStream();
                      String text = in == null ? "" : read(in);
                      if (code >= 300 && code < 400) return new Reply(0, "{\"error\":\"The game server answered from somewhere else.\"}");
                      if (!text.startsWith("{")) text = "{\"error\":\"The game server isn't answering properly right now.\"}";
                      return new Reply(code, text);
                  } catch (Exception e) {
                      return new Reply(0, "{\"error\":\"Couldn't reach the game server. Check your internet connection.\"}");
                  } finally {
                      if (conn != null) conn.disconnect();
                  }
              }

              private static String read(InputStream in) throws java.io.IOException {
                  ByteArrayOutputStream out = new ByteArrayOutputStream();
                  byte[] buf = new byte[8192];
                  int n;
                  while ((n = in.read(buf)) > 0) {
                      out.write(buf, 0, n);
                      if (out.size() > 2 * 1024 * 1024) throw new java.io.IOException("too large");
                  }
                  in.close();
                  return out.toString(StandardCharsets.UTF_8.name());
              }

              /** Keeps the photo store to the newest 300 or so. */
              private static void trim(File dir) {
                  File[] all = dir.listFiles();
                  if (all == null || all.length <= 300) return;
                  Arrays.sort(all, (a, b) -> Long.compare(a.lastModified(), b.lastModified()));
                  for (int i = 0; i < all.length - 200; i++) all[i].delete();
              }

              /* ---------- the sign-in token, encrypted ---------- */

              private static synchronized String token(Context c) {
                  if (cachedToken != null) return cachedToken;
                  String saved = prefs(c).getString("t", "");
                  if (saved.isEmpty()) return cachedToken = "";
                  try {
                      if (saved.startsWith("p:")) return cachedToken = saved.substring(2);
                      byte[] all = Base64.decode(saved, Base64.NO_WRAP);
                      Cipher ci = Cipher.getInstance("AES/GCM/NoPadding");
                      ci.init(Cipher.DECRYPT_MODE, key(), new GCMParameterSpec(128, all, 0, 12));
                      return cachedToken = new String(ci.doFinal(all, 12, all.length - 12), StandardCharsets.UTF_8);
                  } catch (Exception e) {
                      return "";
                  }
              }

              private static synchronized void saveToken(Context c, String token, String name) {
                  String stored;
                  try {
                      Cipher ci = Cipher.getInstance("AES/GCM/NoPadding");
                      ci.init(Cipher.ENCRYPT_MODE, key());
                      byte[] iv = ci.getIV(), ct = ci.doFinal(token.getBytes(StandardCharsets.UTF_8));
                      byte[] all = new byte[iv.length + ct.length];
                      System.arraycopy(iv, 0, all, 0, iv.length);
                      System.arraycopy(ct, 0, all, iv.length, ct.length);
                      stored = Base64.encodeToString(all, Base64.NO_WRAP);
                  } catch (Exception e) {
                      stored = "p:" + token;     // a few phones have broken key storage; the app's private storage still protects it
                  }
                  prefs(c).edit().putString("t", stored).putString("name", name).apply();
                  cachedToken = token;
              }

              private static SecretKey key() throws Exception {
                  KeyStore ks = KeyStore.getInstance("AndroidKeyStore");
                  ks.load(null);
                  if (!ks.containsAlias(KEY_ALIAS)) {
                      KeyGenerator kg = KeyGenerator.getInstance(KeyProperties.KEY_ALGORITHM_AES, "AndroidKeyStore");
                      kg.init(new KeyGenParameterSpec.Builder(KEY_ALIAS, KeyProperties.PURPOSE_ENCRYPT | KeyProperties.PURPOSE_DECRYPT)
                              .setBlockModes(KeyProperties.BLOCK_MODE_GCM)
                              .setEncryptionPaddings(KeyProperties.ENCRYPTION_PADDING_NONE)
                              .setKeySize(256)
                              .build());
                      return kg.generateKey();
                  }
                  return (SecretKey) ks.getKey(KEY_ALIAS, null);
              }
          }
