                  @JavascriptInterface
                  public void googleTransitMatch(final String id, final String origin, final String destination, final String departureTime) {
                      new Thread(() -> {
                          int code = 200; String body = ""; HttpURLConnection conn = null;
                          try {
                              String key = googleKey();
                              if (key.isEmpty()) { code = 401; body = "{\"error\":\"GOOGLE_MAPS_API_KEY is not configured.\"}"; }
                              else if (origin == null || destination == null || origin.length() > 80 || destination.length() > 80 || !origin.matches("[A-Za-z0-9 .’'\\-]+") || !destination.matches("[A-Za-z0-9 .’'\\-]+")) {
                                  code = 400; body = "{\"error\":\"Invalid station name.\"}";
                              } else {
