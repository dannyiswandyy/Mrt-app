                  /** One of those sounds, as base64 text ("" if there's no such sound). Only the sound files' own names are accepted. */
                  @JavascriptInterface
                  public String getSound(String name) {
                      if (name == null || !name.matches("[0-9a-f]{12}\\.(ogg|wav)")) return "";
                      try (InputStream in = getAssets().open("sounds/" + name)) {
                          ByteArrayOutputStream out = new ByteArrayOutputStream();
                          byte[] buf = new byte[65536];
                          int n;
                          while ((n = in.read(buf)) > 0) out.write(buf, 0, n);
                          return android.util.Base64.encodeToString(out.toByteArray(), android.util.Base64.NO_WRAP);
                      } catch (Exception e) {
                          return "";
                      }
                  }
