          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <meta name="referrer" content="strict-origin-when-cross-origin">
          <title>Live cam</title>
          <style>html,body{margin:0;height:100%;background:#000;overflow:hidden}#player,iframe{position:absolute;inset:0;width:100%;height:100%;border:0}</style>
          </head>
          <body>
          <div id="player"></div>
          <script>
          /* The Live cam tab's video player. The app serves this page at https://sg.mrttracker.app/livecam.html
             (it never comes from the internet), so YouTube can tell which app is showing its video. It plays one
             video (?v=) or a channel's live stream (?c=), tells the tracker page what the player is doing, and
             takes "mute", "unmute" and "play" from it. */
          (function(){
            var q = new URLSearchParams(location.search), v = q.get("v") || "", c = q.get("c") || "";
            if (!/^[A-Za-z0-9_-]{11}$/.test(v)) v = "";
            if (!/^UC[A-Za-z0-9_-]{22}$/.test(c)) c = "";
            var muted = q.get("mute") !== "0", player = null;
            function tell(m){ m.mrtcam = 1; try { parent.postMessage(m, "*"); } catch(e){} }
            if (!v && !c){ tell({error: "none"}); return; }
            window.onYouTubeIframeAPIReady = function(){
              var vars = {autoplay: 1, mute: muted ? 1 : 0, playsinline: 1, rel: 0, origin: location.origin, widget_referrer: location.href};
              if (!v) vars.channel = c;
              player = new YT.Player("player", {
                host: v ? "https://www.youtube-nocookie.com" : "https://www.youtube.com",
                videoId: v || "live_stream",
                playerVars: vars,
                events: {
                  onReady: function(e){ if (muted) e.target.mute(); e.target.playVideo(); tell({ready: 1}); },
                  onStateChange: function(e){ tell({state: e.data}); },
                  onError: function(e){ tell({error: e.data}); }
                }
              });
            };
            window.addEventListener("message", function(e){
              if (e.source !== parent || !player || !e.data || !e.data.mrtcam) return;
              try {
                if (e.data.cmd === "mute") player.mute();
                else if (e.data.cmd === "unmute"){ player.unMute(); player.setVolume(100); player.playVideo(); }
                else if (e.data.cmd === "play") player.playVideo();
              } catch(err){}
            });
            var s = document.createElement("script");
            s.src = "https://www.youtube.com/iframe_api";
            s.onerror = function(){ tell({error: "api"}); };
            document.head.appendChild(s);
          })();
          </script>
          </body>
          </html>
          MRTAPP_EOF
          mkdir -p 'mrt-tracker-app/app/src/main/java/sg/mrttracker/app'
          cat > 'mrt-tracker-app/app/src/main/java/sg/mrttracker/app/InstallReceiver.java' <<'MRTAPP_EOF'
          package sg.mrttracker.app;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageInstaller;
          import android.os.Build;

          /** Hears back from Android's installer; shows Android's "Update this app?" screen when it asks. */
          public class InstallReceiver extends BroadcastReceiver {

              @Override
              public void onReceive(Context context, Intent intent) {
                  int status = intent.getIntExtra(PackageInstaller.EXTRA_STATUS, PackageInstaller.STATUS_FAILURE);
                  if (status == PackageInstaller.STATUS_PENDING_USER_ACTION) {
                      Intent confirm = Build.VERSION.SDK_INT >= 33
                              ? intent.getParcelableExtra(Intent.EXTRA_INTENT, Intent.class)
                              : intent.getParcelableExtra(Intent.EXTRA_INTENT);
                      if (confirm != null) {
                          confirm.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          try {
                              context.startActivity(confirm);
                          } catch (Exception ignored) {
                          }
                      }
                  } else if (status != PackageInstaller.STATUS_SUCCESS) {
                      MainActivity.reportUpdateError(intent.getStringExtra(PackageInstaller.EXTRA_STATUS_MESSAGE));
                  }
              }
          }
          MRTAPP_EOF
          mkdir -p 'mrt-tracker-app/app/src/main/java/sg/mrttracker/app'
          cat > 'mrt-tracker-app/app/src/main/java/sg/mrttracker/app/MainActivity.java' <<'MRTAPP_EOF'
          package sg.mrttracker.app;

          import android.app.Activity;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.net.Uri;
          import android.os.Build;
          import android.os.Bundle;
          import android.view.View;
          import android.view.ViewGroup;
          import android.webkit.JavascriptInterface;
          import android.webkit.WebChromeClient;
          import android.webkit.WebResourceRequest;
          import android.webkit.WebResourceResponse;
          import android.webkit.WebSettings;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.widget.FrameLayout;

          import org.json.JSONObject;

          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;
          import java.util.Arrays;
          import java.util.HashSet;
          import java.util.Set;

          public class MainActivity extends Activity {

              /** The only sites the tracker page may ask the app to fetch. */
              private static final Set<String> ALLOWED_HOSTS = new HashSet<>(Arrays.asList(
                      "datamall2.mytransport.sg",
                      "news.google.com",
                      "api-open.data.gov.sg"));      // NEA live weather (data.gov.sg)

              /** The app's own page, bundled inside the app. */
              private static final String PAGE_DIR = "file:///android_asset/";
              /** Where LTA's temporary timetable download links point. */
              private static final String LTA_FILES_HOST = "dmprod-datasets.s3.ap-southeast-1.amazonaws.com";

              /**
               * The Live cam tab's player page (assets/livecam.html) is served at this address, never fetched from
               * the internet. YouTube only plays embedded videos for an app that identifies itself with an https
               * address (its "Referer"), which the tracker page itself, a bundled file, can't give.
               */
              private static final String CAM_HOST = "sg.mrttracker.app";
              private static final String CAM_CSP = "default-src 'none'; script-src 'unsafe-inline' https://www.youtube.com https://s.ytimg.com; "
                      + "frame-src https://www.youtube.com https://www.youtube-nocookie.com; style-src 'unsafe-inline'; img-src https: data:; "
                      + "base-uri 'none'; form-action 'none'";

              /** The Claude API (Anthropic), used by the Ask tab, and the model it uses. */
              private static final String AI_URL = "https://api.anthropic.com/v1/messages";
              private static final String AI_MODEL = "claude-haiku-5-5";

              private WebView web;
              private String cachedKey = null;
              private String cachedAiKey = null;
              private String cachedGoogleKey = null;
              private SharedPreferences prefs;
              private boolean pageLoaded = false;
              private boolean updating = false;
              /** A video shown full screen (the Live cam's full-screen button), and how to hand it back. */
              private View fullView = null;
