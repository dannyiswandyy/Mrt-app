                  }
                  v.setViewVisibility(R.id.w_msg, View.GONE);
                  v.setTextViewText(R.id.w_title, st);
                  boolean any = false;
                  for (int i = 0; i < ROW.length; i++) {
                      JSONObject r = i < rows.length() ? rows.optJSONObject(i) : null;
                      if (r == null) {
                          v.setViewVisibility(ROW[i], View.GONE);
