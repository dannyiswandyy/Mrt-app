# MRT Tracker - Android app builder
# Manual build trigger: 2026-11-13 public build
# This one file holds the whole app. Every time it is saved on GitHub, it builds
# the app and publishes the .apk under Releases.
#
# There are two copies of this file, which differ only in the lines from here to CHANNEL:
#   build-android.yml      builds MRT Tracker (beta), the app you use day to day
#   build-android-dev.yml  builds MRT Tracker, a separate app for trying new features first
# Each one only builds when that file itself is saved (or from Actions > Run workflow).
name: Build MRT Tracker app

on:
  push:
    paths:
      - .github/workflows/build-android.yml
      - tools/**
      - web/**
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-mrt-tracker
  cancel-in-progress: true

env:
  CHANNEL: beta
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write the app project
        run: |
          rm -rf mrt-tracker-app
          mkdir -p 'mrt-tracker-app'
          cat > 'mrt-tracker-app/README.md' <<'MRTAPP_EOF'
          # MRT Tracker (Android)
          
          A small Android app that shows the MRT Train Tracker full screen. The tracker page is bundled inside the app (`app/src/main/assets/index.html`), so trains and timings work offline; the internet is only used for fonts.
          
          ## Build with GitHub (no computer needed)
          
          The easiest way is the single file `build-android.yml`, which contains this whole project:
          
          1. Create a new **private** repository on github.com.
          2. Add the file at `.github/workflows/build-android.yml`.
          3. Open the **Actions** tab and wait for the green tick (about 5 minutes).
          4. Open **Releases → latest** and download `mrt-tracker.apk` on your phone.
          
          Each new build installs over the previous one, because the first build saves a signing key to `signing/mrt-tracker.jks` in your repository.
          
          ## Two apps: MRT Tracker and MRT Tracker
          
          There are two copies of the workflow file in `.github/workflows`, which differ only in a few lines at the top:
          
          - `build-android.yml` builds **MRT Tracker**, the beta app you use day to day. Its Releases entry is "MRT Tracker …".
          - `build-android-dev.yml` builds **MRT Tracker**, a separate app with an orange icon and a DEV badge, for trying new features first. Its Releases entry is the "MRT Tracker …" pre-release, with `mrt-tracker.apk`.
          
          Each one only builds when that file itself is saved, so trying something in MRT Tracker never changes MRT Tracker. Both can be installed at the same time and keep their own settings. Each app checks for its own updates. To move a feature into MRT Tracker, save the matching `build-android.yml`.
          
          ## LTA timetable
          
          Every build downloads LTA's official train timetable (GTFS Schedule (Train), LTA DataMall) and packs it into the app, so train times follow the real schedule. Each good download is also saved in the repository as `data/lta-timetable.json`. If LTA's download fails during a build, that saved copy is packed instead, so every version of the app has the timetable. The app's Settings (under Updates) shows which timetable it has and when it was downloaded.
          
          ## Live weather (MRT Tracker)
          
          The map shows live weather from the National Environment Agency (NEA), via data.gov.sg: the 2-hour forecast, rain measured at rain gauges, temperature, wind and lightning, refreshed every 10 minutes. On the 2D map, rain falls where the gauges measure it, clouds drift over cloudy or showery areas, hazy areas get a tint, and lightning flashes where it's detected or storms are forecast. Tap the weather chip for details, or to turn the weather on the map off.
          
          ## Ask tab (chatbot)
          
          The Ask tab answers questions about stations, lines and trains. Without a key it gives built-in answers from the app's own data. To let Claude answer instead:
          
          1. Get an API key at console.anthropic.com (API keys), and set a monthly spending limit there.
          2. In your repository, open **Settings → Secrets and variables → Actions → New repository secret**.
          3. Name it `ANTHROPIC_API_KEY`, paste the key, and save. Then build again.
          
          The key is built into the app scrambled, and the app only ever sends it to Anthropic. Anyone with a copy of the app could still dig it out, which is why the spending limit matters. Each phone can ask Claude up to 60 questions a day; after that, or when offline, the app falls back to built-in answers.
          
          ## 3D buildings
          
          When zoomed in on the 2D map, buildings near each station rise up in 3D. Their outlines and heights come from OpenStreetMap (© OpenStreetMap contributors), downloaded while GitHub builds the app and packed into it. GitHub keeps a copy between builds, so OpenStreetMap is only asked again once a month. If the download fails, the last copy is used, and the build never fails because of it. The **3D** button on the map turns them off.
          
          ## RTS Link and Sentosa Express tracks
          
          SG Rail Data, where the map's lines come from, has no track for the RTS Link or the Sentosa Express. So while GitHub builds the app, it downloads their routes from OpenStreetMap (© OpenStreetMap contributors): Sentosa Express relations 2353581 and 9663249, RTS Link relations 19927885 and 19927886, as listed on the OpenStreetMap wiki page "Singapore/Rail Transport". Each route's track is cut at the app's stations, so both lines follow their real track on the map. GitHub keeps a copy between builds. If the download fails, the last copy is used; with neither, the two lines stay straight. The build never fails because of it. The web version has no download, so it shows them straight.
          
          ## Build with Android Studio
          
          Open this folder in Android Studio and run **Build → Build APK(s)**. A debug build needs no signing key.
          
          ## Updating the tracker
          
          Replace `app/src/main/assets/index.html` and build again. (Inside the workflow file the page is stored compressed, as xz then base64, because GitHub won't run a workflow file over 500 KB; the workflow file is made from this project, so change the project and remake it.)
          MRTAPP_EOF
          mkdir -p 'mrt-tracker-app/app'
          # build tools (timetable, buildings, tracks, station exits) live in this repository's tools/ folder
          mkdir -p mrt-tracker-app/tools
          cp tools/*.py tools/lines.json mrt-tracker-app/tools/
          cat > 'mrt-tracker-app/app/build.gradle' <<'MRTAPP_EOF'
          plugins {
              id 'com.android.application'
          }

          // Which app to build: "beta" is MRT Tracker; "dev" is MRT Tracker, a separate app (its own name, icon
          // and settings) for trying new features before they go into MRT Tracker. Set by the workflow file.
          def channel = (project.findProperty('channel') ?: 'beta').toString() == 'dev' ? 'dev' : 'beta'

          // Scrambles a key with a mask made from the app's package name; the app unscrambles it in memory.
          def scrambleKey = { String s ->
              s = (s ?: '').trim()
              if (s.isEmpty()) return ''
              byte[] mask = java.security.MessageDigest.getInstance('SHA-256').digest('sg.mrttracker.app'.getBytes('UTF-8'))
              byte[] b = s.getBytes('UTF-8')
              StringBuilder sb = new StringBuilder()
              for (int i = 0; i < b.length; i++) sb.append(String.format('%02x', (b[i] ^ mask[i % mask.length]) & 0xff))
              return sb.toString()
          }

          android {
              namespace 'sg.mrttracker.app'
              compileSdk 34

              defaultConfig {
                  applicationId channel == 'dev' ? 'sg.mrttracker.app' : 'sg.mrttracker.app'
                  resValue 'string', 'app_name', channel == 'dev' ? 'MRT Tracker' : 'MRT Tracker'
                  resValue 'color', 'icon_bg', '#0A0E14'
                  buildConfigField 'String', 'CHANNEL', '"' + channel + '"'
                  minSdk 24
                  targetSdk 34
                  // GitHub passes in a number that grows with every build (minutes since 2026), so each
                  // new build installs over the last one, and the build date and time as the version name.
                  versionCode Integer.parseInt((project.findProperty('vc') ?: '1').toString())
                  versionName((project.findProperty('vn') ?: 'dev').toString())
                  // LTA DataMall key built into the app, so live alerts work for everyone with no setup.
                  // Stored scrambled (the app unscrambles it in memory), so it can't be read from this file
                  // or found by searching the app's contents.
                  // Public GitHub repo whose "latest" release the app checks for updates (empty = off).
                  buildConfigField 'String', 'UPDATE_REPO', '"' + (project.findProperty('updateRepo') ?: '').toString().replaceAll('[^A-Za-z0-9._/-]', '') + '"'
                  buildConfigField 'String', 'LTA_KEY_X', '"ac482e340c45fb8ce3d416f40eeba0afa7c59acac8579667"'
                  // Claude API key for the Ask tab, from the ANTHROPIC_API_KEY GitHub secret (none = built-in answers only).
                  buildConfigField 'String', 'AI_KEY_X', '"' + scrambleKey((project.findProperty('aiKey') ?: '').toString()) + '"'
              }

              buildFeatures {
                  buildConfig true
                  resValues true
              }

              dependencies {
                  implementation "androidx.webkit:webkit:1.18.0"
              }

              signingConfigs {
                  release {
                      // The keystore is created once by the GitHub build and kept in the repo,
                      // so every later build is signed with the same key.
                      storeFile file(project.findProperty('ks') ?: 'missing.jks')
                      storePassword 'mrttracker'
                      keyAlias 'mrttracker'
                      keyPassword 'mrttracker'
                  }
              }

              buildTypes {
                  release {
                      // Shrink and scramble the app's code so it's harder to pick apart.
                      minifyEnabled true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                      signingConfig signingConfigs.release
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          MRTAPP_EOF
          mkdir -p 'mrt-tracker-app/app'
          cat > 'mrt-tracker-app/app/proguard-rules.pro' <<'MRTAPP_EOF'
          # The tracker page calls these methods by name, so they must keep their names.
          -keepclassmembers class * {
              @android.webkit.JavascriptInterface <methods>;
          }
          -keepattributes JavascriptInterface
          MRTAPP_EOF
          mkdir -p 'mrt-tracker-app/app/src/main'
          cat > 'mrt-tracker-app/app/src/main/AndroidManifest.xml' <<'MRTAPP_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
          
              <uses-permission android:name="android.permission.INTERNET" />
              <!-- In-app updates: install new versions, notify about them, and keep checking after a restart. -->
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />
              <!-- Offline mode: notices when the connection drops, to show saved data. -->
              <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
          
              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:theme="@style/AppTheme"
                  android:allowBackup="false"
                  android:fullBackupContent="false"
                  android:dataExtractionRules="@xml/data_extraction_rules"
                  android:usesCleartextTraffic="false"
                  android:networkSecurityConfig="@xml/network_security_config">
          
                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
          
                  <service
                      android:name=".UpdateJob"
                      android:permission="android.permission.BIND_JOB_SERVICE"
                      android:exported="false" />
          
                  <receiver
                      android:name=".InstallReceiver"
                      android:exported="false" />
          
                  <!-- Home screen widget: next trains at the first saved station. -->
                  <receiver
                      android:name=".TrainWidget"
                      android:exported="true"
                      android:label="@string/app_name">
                      <intent-filter>
                          <action android:name="android.appwidget.action.APPWIDGET_UPDATE" />
                      </intent-filter>
                      <meta-data
                          android:name="android.appwidget.provider"
                          android:resource="@xml/train_widget_info" />
                  </receiver>
          
                  <!-- Trip reminders, set from the planned timetable. -->
                  <receiver
                      android:name=".TripAlarm"
                      android:exported="false" />
          
                  <!-- Disruption check for the saved lines while the app is closed. -->
                  <service
                      android:name=".AlertJob"
                      android:permission="android.permission.BIND_JOB_SERVICE"
                      android:exported="false" />
              </application>
          </manifest>
          MRTAPP_EOF
          mkdir -p 'mrt-tracker-app/app/src/main/assets'
          # mrt-tracker-app/app/src/main/assets/index.html is stored compressed (xz, then base64) to keep this file under GitHub's 500 KB limit
          # Keep the Android app and website on the exact same public page.
          # web/index.html is the canonical public UI; the Dev app remains separate.
          mkdir -p 'mrt-tracker-app/app/src/main/assets'
          cp 'web/index.html' 'mrt-tracker-app/app/src/main/assets/index.html'
          cp 'web/run-graph.js' 'mrt-tracker-app/app/src/main/assets/run-graph.js'
          cp 'web/trainset-intelligence.js' 'mrt-tracker-app/app/src/main/assets/trainset-intelligence.js'
          cp 'web/disruption-intelligence.js' 'mrt-tracker-app/app/src/main/assets/disruption-intelligence.js'
          cp 'web/spotter-planner.js' 'mrt-tracker-app/app/src/main/assets/spotter-planner.js'
          cp web/diagnostics.js mrt-tracker-app/app/src/main/assets/diagnostics.js
          cp web/rt-capture.js mrt-tracker-app/app/src/main/assets/rt-capture.js
          cp web/ui-refresh-v3.js mrt-tracker-app/app/src/main/assets/ui-refresh-v3.js
          cp web/mrt-intelligence.js mrt-tracker-app/app/src/main/assets/mrt-intelligence.js
          cp web/depot-transfers.js mrt-tracker-app/app/src/main/assets/depot-transfers.js
          cp web/engineering-intelligence.js mrt-tracker-app/app/src/main/assets/engineering-intelligence.js
          cp web/operating-history.js mrt-tracker-app/app/src/main/assets/operating-history.js
          cp web/gtfs-lab.js mrt-tracker-app/app/src/main/assets/gtfs-lab.js
          cp web/disruption-engine.js mrt-tracker-app/app/src/main/assets/disruption-engine.js
          cp web/spotter-schedule.js mrt-tracker-app/app/src/main/assets/spotter-schedule.js
          cp web/skytrain.js mrt-tracker-app/app/src/main/assets/skytrain.js
          mkdir -p 'mrt-tracker-app/app/src/main/assets/fonts'
          cp web/fonts/*.woff2 'mrt-tracker-app/app/src/main/assets/fonts/'
          mkdir -p 'mrt-tracker-app/app/src/main/assets'
          cat > 'mrt-tracker-app/app/src/main/assets/livecam.html' <<'MRTAPP_EOF'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <meta name="referrer" content="strict-origin-when-cross-origin">
          <title>Live cam</title>
          <style>html,body{margin:0;height:100%;background:#000;overflow:hidden}#player,iframe{position:absolute;inset:0;width:100%;height:100%;border:0}</style>
          </head>
          <body>
          <div id="player"></div>
          <script>
          /* The Live cam tab's video player. The app serves this page at https://sg.mrttracker.app/livecam.html
             (it never comes from the internet), so YouTube can tell which app is showing its video. It plays one
             video (?v=) or a channel's live stream (?c=), tells the tracker page what the player is doing, and
             takes "mute", "unmute" and "play" from it. */
          (function(){
            var q = new URLSearchParams(location.search), v = q.get("v") || "", c = q.get("c") || "";
            if (!/^[A-Za-z0-9_-]{11}$/.test(v)) v = "";
            if (!/^UC[A-Za-z0-9_-]{22}$/.test(c)) c = "";
            var muted = q.get("mute") !== "0", player = null;
            function tell(m){ m.mrtcam = 1; try { parent.postMessage(m, "*"); } catch(e){} }
            if (!v && !c){ tell({error: "none"}); return; }
            window.onYouTubeIframeAPIReady = function(){
              var vars = {autoplay: 1, mute: muted ? 1 : 0, playsinline: 1, rel: 0, origin: location.origin, widget_referrer: location.href};
              if (!v) vars.channel = c;
              player = new YT.Player("player", {
                host: v ? "https://www.youtube-nocookie.com" : "https://www.youtube.com",
                videoId: v || "live_stream",
                playerVars: vars,
                events: {
                  onReady: function(e){ if (muted) e.target.mute(); e.target.playVideo(); tell({ready: 1}); },
                  onStateChange: function(e){ tell({state: e.data}); },
                  onError: function(e){ tell({error: e.data}); }
                }
              });
            };
            window.addEventListener("message", function(e){
              if (e.source !== parent || !player || !e.data || !e.data.mrtcam) return;
              try {
                if (e.data.cmd === "mute") player.mute();
                else if (e.data.cmd === "unmute"){ player.unMute(); player.setVolume(100); player.playVideo(); }
                else if (e.data.cmd === "play") player.playVideo();
              } catch(err){}
            });
            var s = document.createElement("script");
            s.src = "https://www.youtube.com/iframe_api";
            s.onerror = function(){ tell({error: "api"}); };
            document.head.appendChild(s);
          })();
          </script>
          </body>
          </html>
          MRTAPP_EOF
          mkdir -p 'mrt-tracker-app/app/src/main/java/sg/mrttracker/app'
          cat > 'mrt-tracker-app/app/src/main/java/sg/mrttracker/app/InstallReceiver.java' <<'MRTAPP_EOF'
          package sg.mrttracker.app;

          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.PackageInstaller;
          import android.os.Build;

          /** Hears back from Android's installer; shows Android's "Update this app?" screen when it asks. */
          public class InstallReceiver extends BroadcastReceiver {

              @Override
              public void onReceive(Context context, Intent intent) {
                  int status = intent.getIntExtra(PackageInstaller.EXTRA_STATUS, PackageInstaller.STATUS_FAILURE);
                  if (status == PackageInstaller.STATUS_PENDING_USER_ACTION) {
                      Intent confirm = Build.VERSION.SDK_INT >= 33
                              ? intent.getParcelableExtra(Intent.EXTRA_INTENT, Intent.class)
                              : intent.getParcelableExtra(Intent.EXTRA_INTENT);
                      if (confirm != null) {
                          confirm.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);
                          try {
                              context.startActivity(confirm);
                          } catch (Exception ignored) {
                          }
                      }
                  } else if (status != PackageInstaller.STATUS_SUCCESS) {
                      MainActivity.reportUpdateError(intent.getStringExtra(PackageInstaller.EXTRA_STATUS_MESSAGE));
                  }
              }
          }
          MRTAPP_EOF
          mkdir -p 'mrt-tracker-app/app/src/main/java/sg/mrttracker/app'
          cat > 'mrt-tracker-app/app/src/main/java/sg/mrttracker/app/Alerts.java' <<'MRTAPP_EOF'
          package sg.mrttracker.app;
          
          import android.app.AlarmManager;
          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.job.JobInfo;
          import android.app.job.JobScheduler;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.os.Build;
          
          import org.json.JSONArray;
          import org.json.JSONObject;
          
          import java.io.ByteArrayOutputStream;
          import java.io.InputStream;
          import java.net.HttpURLConnection;
          import java.net.URL;
          import java.nio.charset.StandardCharsets;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.List;
          
          /**
           * MRT Dev notifications: disruptions on the lines at your saved stations, and trip reminders
           * from the planned timetable. Nothing here uses your location.
           */
          final class Alerts {
              static final String CH_DISRUPT = "disruptions";
              static final String CH_TRIP = "trip";
              private static final int DISRUPT_ID = 2001;
              private static final int TRIP_BASE = 3000;
              private static final int TRIP_MAX = 8;
              private static final int JOB_ID = 7301;
              private static final String PREFS = "alerts";
              private static final String DATAMALL = "https://datamall2.mytransport.sg/ltaodataservice/TrainServiceAlerts";
          
              private Alerts() {}
          
              static SharedPreferences prefs(Context c) {
                  return c.getSharedPreferences(PREFS, Context.MODE_PRIVATE);
              }
          
              static void channels(Context c) {
                  if (Build.VERSION.SDK_INT < 26) return;
                  NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                  if (nm == null) return;
                  NotificationChannel d = new NotificationChannel(CH_DISRUPT, "Line disruptions", NotificationManager.IMPORTANCE_HIGH);
                  d.setDescription("LTA disruption notices for the lines at the stations saved on Home");
                  nm.createNotificationChannel(d);
                  NotificationChannel t = new NotificationChannel(CH_TRIP, "Trip reminders", NotificationManager.IMPORTANCE_HIGH);
                  t.setDescription("When to board and when to get off, from the planned timetable");
                  nm.createNotificationChannel(t);
              }
          
              /** True when this app may show notifications (Android 13+ asks the person first). */
              static boolean allowed(Context c) {
                  if (Build.VERSION.SDK_INT >= 33 && c.checkSelfPermission("android.permission.POST_NOTIFICATIONS")
                          != android.content.pm.PackageManager.PERMISSION_GRANTED) return false;
                  NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                  return nm != null && nm.areNotificationsEnabled();
              }
          
              static void post(Context c, String channel, int id, String title, String text) {
                  try {
                      channels(c);
                      if (!allowed(c)) return;
                      NotificationManager nm = (NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE);
                      Intent open = new Intent(c, MainActivity.class).addFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                      PendingIntent pi = PendingIntent.getActivity(c, id, open, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                      Notification.Builder b = Build.VERSION.SDK_INT >= 26 ? new Notification.Builder(c, channel) : new Notification.Builder(c);
                      b.setSmallIcon(R.drawable.ic_stat_train)
                              .setContentTitle(clip(title, 120))
                              .setContentText(clip(text, 400))
                              .setStyle(new Notification.BigTextStyle().bigText(clip(text, 400)))
                              .setContentIntent(pi)
                              .setAutoCancel(true)
                              .setShowWhen(true);
                      if (Build.VERSION.SDK_INT < 26) b.setPriority(Notification.PRIORITY_HIGH);
                      nm.notify(id, b.build());
                  } catch (Exception ignored) {
                  }
              }
          
              private static String clip(String s, int n) {
                  s = s == null ? "" : s.trim();
                  return s.length() > n ? s.substring(0, n - 1) + "…" : s;
              }
          
              /* ---------- disruptions ---------- */
          
              /** Posts once per new disruption (sig names the affected stretches); an empty sig means all clear. */
              static synchronized void disruption(Context c, String sig, String title, String text) {
                  SharedPreferences p = prefs(c);
                  if (sig == null || sig.isEmpty()) {
                      p.edit().putString("dis_sig", "").apply();
                      return;
                  }
                  if (sig.equals(p.getString("dis_sig", ""))) return;
                  p.edit().putString("dis_sig", sig).apply();
                  if (!p.getBoolean("on", true)) return;
                  post(c, CH_DISRUPT, DISRUPT_ID, title, text);
              }
          
              /** The page says which LTA lines to watch ({"on":true,"lines":["NSL","CCL"]}); background checks follow. */
              static void setLines(Context c, String json) {
                  try {
                      JSONObject j = new JSONObject(json);
                      JSONArray ls = j.optJSONArray("lines");
                      StringBuilder sb = new StringBuilder();
                      if (ls != null) for (int i = 0; i < ls.length() && i < 30; i++) {
                          String l = ls.optString(i, "").replaceAll("[^A-Z]", "");
                          if (!l.isEmpty()) sb.append(sb.length() > 0 ? "," : "").append(l);
                      }
                      prefs(c).edit().putBoolean("on", j.optBoolean("on", true)).putString("lines", sb.toString()).apply();
                  } catch (Exception ignored) {
                  }
                  schedule(c);
              }
          
              static void schedule(Context c) {
                  try {
                      JobScheduler js = (JobScheduler) c.getSystemService(Context.JOB_SCHEDULER_SERVICE);
                      if (js == null) return;
                      SharedPreferences p = prefs(c);
                      boolean want = p.getBoolean("on", true) && !p.getString("lines", "").isEmpty() && !BuildConfig.LTA_KEY_X.isEmpty();
                      if (!want) {
                          js.cancel(JOB_ID);
                          return;
                      }
                      for (JobInfo j : js.getAllPendingJobs()) if (j.getId() == JOB_ID) return;
                      js.schedule(new JobInfo.Builder(JOB_ID, new ComponentName(c, AlertJob.class))
                              .setRequiredNetworkType(JobInfo.NETWORK_TYPE_ANY)
                              .setPeriodic(30L * 60 * 1000)       // about every half hour, when Android allows
                              .setPersisted(true)
                              .build());
                  } catch (Exception ignored) {
                  }
              }
          
              /** Background check (the app closed): LTA's train service alerts for the saved lines. */
              static void check(Context c) {
                  SharedPreferences p = prefs(c);
                  String saved = p.getString("lines", "");
                  if (!p.getBoolean("on", true) || saved.isEmpty()) return;
                  List<String> lines = java.util.Arrays.asList(saved.split(","));
                  HttpURLConnection conn = null;
                  try {
                      String key = MainActivity.unscramble(BuildConfig.LTA_KEY_X);
                      if (key.isEmpty()) return;
                      conn = (HttpURLConnection) new URL(DATAMALL).openConnection();
                      conn.setConnectTimeout(10000);
                      conn.setReadTimeout(15000);
                      conn.setRequestProperty("User-Agent", "MRTTracker/1.0 (Android)");
                      conn.setRequestProperty("Accept", "application/json");
                      conn.setRequestProperty("AccountKey", key);
                      if (conn.getResponseCode() != 200) return;
                      InputStream in = conn.getInputStream();
                      ByteArrayOutputStream out = new ByteArrayOutputStream();
                      byte[] buf = new byte[8192];
                      int n;
                      while ((n = in.read(buf)) > 0 && out.size() < 1_000_000) out.write(buf, 0, n);
                      in.close();
                      JSONObject root = new JSONObject(out.toString(StandardCharsets.UTF_8.name()));
                      Object v = root.opt("value");
                      JSONObject val = v instanceof JSONArray ? ((JSONArray) v).optJSONObject(0) : v instanceof JSONObject ? (JSONObject) v : root;
                      if (val == null) return;
                      List<String> sigs = new ArrayList<>();
                      List<String> names = new ArrayList<>();
                      if (val.optInt("Status", 1) == 2) {
                          JSONArray segs = val.optJSONArray("AffectedSegments");
                          if (segs != null) for (int i = 0; i < segs.length(); i++) {
                              JSONObject sg = segs.optJSONObject(i);
                              if (sg == null) continue;
                              String line = sg.optString("Line", "").toUpperCase(java.util.Locale.ROOT);
                              if (!lines.contains(line)) continue;
                              List<String> codes = new ArrayList<>();
                              for (String s : sg.optString("Stations", "").split(",")) {
                                  s = s.trim();
                                  if (s.isEmpty()) continue;
                                  codes.add(s.equals("CE1") ? "CC34" : s.equals("CE2") ? "CC33" : s);
                              }
                              if (codes.isEmpty()) continue;
                              sigs.add(line + ":" + codes.get(0) + "-" + codes.get(codes.size() - 1));
                              String nm = lineName(line);
                              if (!names.contains(nm)) names.add(nm);
                          }
                      }
                      Collections.sort(sigs);
                      String sig = android.text.TextUtils.join("|", sigs);
                      String msg = "";
                      JSONArray ms = val.optJSONArray("Message");
                      if (ms != null && ms.length() > 0) {
                          JSONObject m = ms.optJSONObject(ms.length() - 1);
                          if (m != null) msg = m.optString("Content", "");
                      }
                      disruption(c, sig, "Disruption: " + android.text.TextUtils.join(", ", names),
                              msg.isEmpty() ? "Trains are affected on a line at your saved stations. Open the app for details." : msg);
                  } catch (Exception ignored) {
                  } finally {
                      if (conn != null) conn.disconnect();
                  }
              }
          
              private static String lineName(String l) {
                  switch (l) {
                      case "NSL": return "North-South Line";
                      case "EWL": return "East-West Line";
                      case "NEL": return "North East Line";
                      case "CCL": return "Circle Line";
                      case "DTL": return "Downtown Line";
                      case "TEL": return "Thomson-East Coast Line";
                      case "BPL": return "Bukit Panjang LRT";
                      case "STL": return "Sengkang LRT";
                      case "PTL": return "Punggol LRT";
                      case "CGL": return "Changi Airport Branch";
                      case "CEL": return "Circle Line Extension";
                      default: return l;
                  }
              }
          
              /* ---------- trip reminders (AlarmManager, inexact, no special permission) ---------- */
          
              static void tripSchedule(Context c, String json) {
                  tripCancel(c);
                  try {
                      JSONArray a = new JSONArray(json);
                      AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
                      if (am == null) return;
                      long now = System.currentTimeMillis();
                      for (int i = 0, k = 0; i < a.length() && k < TRIP_MAX; i++) {
                          JSONObject o = a.optJSONObject(i);
                          if (o == null) continue;
                          long at = o.optLong("at", 0);
                          if (at < now + 5000 || at > now + 6L * 3600 * 1000) continue;     // only the next few hours
                          Intent it = new Intent(c, TripAlarm.class).setAction("sg.mrttracker.app.TRIP_" + k)
                                  .putExtra("title", clip(o.optString("title", ""), 120))
                                  .putExtra("text", clip(o.optString("text", ""), 300))
                                  .putExtra("id", TRIP_BASE + k);
                          PendingIntent pi = PendingIntent.getBroadcast(c, TRIP_BASE + k, it, PendingIntent.FLAG_UPDATE_CURRENT | PendingIntent.FLAG_IMMUTABLE);
                          am.setAndAllowWhileIdle(AlarmManager.RTC_WAKEUP, at, pi);
                          k++;
                      }
                  } catch (Exception ignored) {
                  }
              }
          
              static void tripCancel(Context c) {
                  AlarmManager am = (AlarmManager) c.getSystemService(Context.ALARM_SERVICE);
                  for (int k = 0; k < TRIP_MAX; k++) {
                      Intent it = new Intent(c, TripAlarm.class).setAction("sg.mrttracker.app.TRIP_" + k);
                      PendingIntent pi = PendingIntent.getBroadcast(c, TRIP_BASE + k, it, PendingIntent.FLAG_NO_CREATE | PendingIntent.FLAG_IMMUTABLE);
                      if (pi != null) {
                          if (am != null) am.cancel(pi);
                          pi.cancel();
                      }
                  }
              }
          }
