              /** Back from a full-screen video: put the page back as it was. */
              private void leaveFullScreen() {
                  if (fullView == null) return;
                  ((FrameLayout) getWindow().getDecorView()).removeView(fullView);
                  fullView = null;
                  systemBars(true);
