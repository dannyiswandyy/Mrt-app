                      android:textSize="13sp"
                      android:textStyle="bold" />
              </LinearLayout>
          
              <LinearLayout
                  android:id="@+id/w_r2"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="6dp"
                  android:gravity="center_vertical"
                  android:orientation="horizontal">
          
                  <TextView
                      android:id="@+id/w_b2"
                      android:layout_width="4dp"
                      android:layout_height="18dp"
                      android:background="#888888" />
          
                  <TextView
                      android:id="@+id/w_d2"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_marginStart="8dp"
                      android:layout_weight="1"
                      android:ellipsize="end"
                      android:maxLines="1"
                      android:textColor="#E8EDF2"
                      android:textSize="13sp" />
          
                  <TextView
                      android:id="@+id/w_t2"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginStart="8dp"
                      android:fontFamily="monospace"
                      android:maxLines="1"
                      android:textColor="#FFFFFF"
                      android:textSize="13sp"
                      android:textStyle="bold" />
              </LinearLayout>
          
              <LinearLayout
                  android:id="@+id/w_r3"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="6dp"
                  android:gravity="center_vertical"
                  android:orientation="horizontal">
          
                  <TextView
                      android:id="@+id/w_b3"
                      android:layout_width="4dp"
                      android:layout_height="18dp"
                      android:background="#888888" />
          
                  <TextView
                      android:id="@+id/w_d3"
                      android:layout_width="0dp"
                      android:layout_height="wrap_content"
                      android:layout_marginStart="8dp"
                      android:layout_weight="1"
                      android:ellipsize="end"
                      android:maxLines="1"
                      android:textColor="#E8EDF2"
                      android:textSize="13sp" />
          
                  <TextView
                      android:id="@+id/w_t3"
                      android:layout_width="wrap_content"
                      android:layout_height="wrap_content"
                      android:layout_marginStart="8dp"
                      android:fontFamily="monospace"
                      android:maxLines="1"
                      android:textColor="#FFFFFF"
                      android:textSize="13sp"
                      android:textStyle="bold" />
              </LinearLayout>
          
              <TextView
                  android:id="@+id/w_dis"
                  android:layout_width="match_parent"
                  android:layout_height="wrap_content"
                  android:layout_marginTop="8dp"
                  android:ellipsize="end"
                  android:maxLines="2"
                  android:textColor="#FF8A80"
                  android:textSize="12sp"
                  android:visibility="gone" />
          </LinearLayout>
          MRTAPP_EOF
          mkdir -p 'mrt-tracker-app/app/src/main/res/mipmap-anydpi-v26'
          cat > 'mrt-tracker-app/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml' <<'MRTAPP_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/icon_bg" />
              <foreground android:drawable="@drawable/ic_launcher_foreground" />
          </adaptive-icon>
          MRTAPP_EOF
          mkdir -p 'mrt-tracker-app/app/src/main/res/mipmap'
          cat > 'mrt-tracker-app/app/src/main/res/mipmap/ic_launcher.xml' <<'MRTAPP_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <inset xmlns:android="http://schemas.android.com/apk/res/android"
              android:drawable="@drawable/ic_launcher_legacy" />
          MRTAPP_EOF
          mkdir -p 'mrt-tracker-app/app/src/main/res/values-night'
          cat > 'mrt-tracker-app/app/src/main/res/values-night/colors.xml' <<'MRTAPP_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="bg">#0F1317</color>
          </resources>
          MRTAPP_EOF
          mkdir -p 'mrt-tracker-app/app/src/main/res/values-night'
          cat > 'mrt-tracker-app/app/src/main/res/values-night/themes.xml' <<'MRTAPP_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.NoActionBar">
                  <item name="android:windowBackground">@color/bg</item>
                  <item name="android:statusBarColor">@color/bg</item>
                  <item name="android:navigationBarColor">@color/bg</item>
                  <item name="android:windowLightStatusBar">false</item>
                  <item name="android:windowLightNavigationBar">false</item>
              </style>
          </resources>
          MRTAPP_EOF
          mkdir -p 'mrt-tracker-app/app/src/main/res/values'
          cat > 'mrt-tracker-app/app/src/main/res/values/colors.xml' <<'MRTAPP_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="bg">#EEF1F4</color>
              <!-- icon_bg comes from app/build.gradle: dark for MRT Tracker, orange for MRT Tracker -->
          </resources>
          MRTAPP_EOF
          mkdir -p 'mrt-tracker-app/app/src/main/res/values'
          cat > 'mrt-tracker-app/app/src/main/res/values/strings.xml' <<'MRTAPP_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <!-- app_name comes from app/build.gradle: MRT Tracker, or MRT Dev for the developer app -->
              <string name="widget_desc">Next trains at your first saved station</string>
              <string name="widget_empty">Save a station on Home to see its next trains here.</string>
          </resources>
          MRTAPP_EOF
          mkdir -p 'mrt-tracker-app/app/src/main/res/values'
          cat > 'mrt-tracker-app/app/src/main/res/values/themes.xml' <<'MRTAPP_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <style name="AppTheme" parent="android:Theme.Material.Light.NoActionBar">
                  <item name="android:windowBackground">@color/bg</item>
                  <item name="android:statusBarColor">@color/bg</item>
                  <item name="android:navigationBarColor">@color/bg</item>
                  <item name="android:windowLightStatusBar">true</item>
                  <item name="android:windowLightNavigationBar">true</item>
              </style>
          </resources>
          MRTAPP_EOF
          mkdir -p 'mrt-tracker-app/app/src/main/res/xml'
          cat > 'mrt-tracker-app/app/src/main/res/xml/data_extraction_rules.xml' <<'MRTAPP_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <!-- Nothing from this app is copied to cloud backups or to a new phone. -->
          <data-extraction-rules>
              <cloud-backup>
                  <exclude domain="root" path="." />
                  <exclude domain="file" path="." />
                  <exclude domain="database" path="." />
                  <exclude domain="sharedpref" path="." />
                  <exclude domain="external" path="." />
              </cloud-backup>
              <device-transfer>
                  <exclude domain="root" path="." />
                  <exclude domain="file" path="." />
                  <exclude domain="database" path="." />
                  <exclude domain="sharedpref" path="." />
                  <exclude domain="external" path="." />
              </device-transfer>
          </data-extraction-rules>
          MRTAPP_EOF
          mkdir -p 'mrt-tracker-app/app/src/main/res/xml'
          cat > 'mrt-tracker-app/app/src/main/res/xml/network_security_config.xml' <<'MRTAPP_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <!-- Encrypted connections (HTTPS) only, trusting only the phone's built-in certificates. -->
          <network-security-config>
              <base-config cleartextTrafficPermitted="false">
                  <trust-anchors>
                      <certificates src="system" />
                  </trust-anchors>
              </base-config>
          </network-security-config>
          MRTAPP_EOF
          mkdir -p 'mrt-tracker-app/app/src/main/res/xml'
          cat > 'mrt-tracker-app/app/src/main/res/xml/train_widget_info.xml' <<'MRTAPP_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <!-- Home screen widget: about 4 x 2 cells, resizable; the app refreshes it whenever Home updates. -->
          <appwidget-provider xmlns:android="http://schemas.android.com/apk/res/android"
              android:description="@string/widget_desc"
              android:initialLayout="@layout/widget_trains"
              android:minWidth="250dp"
              android:minHeight="110dp"
              android:minResizeWidth="180dp"
              android:minResizeHeight="80dp"
              android:previewLayout="@layout/widget_trains"
              android:resizeMode="horizontal|vertical"
              android:targetCellWidth="4"
              android:targetCellHeight="2"
              android:updatePeriodMillis="1800000"
              android:widgetCategory="home_screen" />
          MRTAPP_EOF
          mkdir -p 'mrt-tracker-app'
          cat > 'mrt-tracker-app/build.gradle' <<'MRTAPP_EOF'
          plugins {
              id 'com.android.application' version '8.5.2' apply false
          }
          MRTAPP_EOF
          mkdir -p 'mrt-tracker-app'
          cat > 'mrt-tracker-app/gradle.properties' <<'MRTAPP_EOF'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          MRTAPP_EOF
          mkdir -p 'mrt-tracker-app'
          cat > 'mrt-tracker-app/settings.gradle' <<'MRTAPP_EOF'
          pluginManagement {
              repositories { google(); mavenCentral(); gradlePluginPortal() }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories { google(); mavenCentral() }
          }
          rootProject.name = "MRT Tracker"
          include ':app'
          MRTAPP_EOF
          mkdir -p 'mrt-tracker-app/tools'
          mkdir -p 'mrt-tracker-app/tools'
          mkdir -p 'mrt-tracker-app/tools'
          mkdir -p 'mrt-tracker-app/tools'

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Create a signing key on the first run
        run: |
          mkdir -p signing
          if [ ! -f signing/mrt-tracker.jks ]; then
            keytool -genkeypair -v -keystore signing/mrt-tracker.jks -alias mrttracker \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass mrttracker -keypass mrttracker -dname "CN=MRT Tracker"
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add signing/mrt-tracker.jks
            git commit -m "Add app signing key [skip ci]"
            git push
          fi

      # Downloads LTA's official train timetable and packs it into the app.
      # Never fails the build: without it, the app falls back to estimated times.
      - name: Fetch LTA train timetable
        env:
          LTA_ACCOUNT_KEY: ${{ secrets.LTA_ACCOUNT_KEY }}
        run: python3 mrt-tracker-app/tools/build_timetable.py mrt-tracker-app data/lta-timetable.json

      # The last good timetable is kept in this repository (data/lta-timetable.json), so a build
      # where LTA's download fails still packs LTA's timetable instead of falling back to estimates.
      - name: Keep the timetable for next time
        run: |
          if [ -f data/lta-timetable.json ] && [ -n "$(git status --porcelain data/lta-timetable.json)" ]; then
            git config user.name "github-actions"
            git config user.email "github-actions@users.noreply.github.com"
            git add data/lta-timetable.json
            git commit -m "Save LTA train timetable [skip ci]"
            git pull --rebase --autostash || true
            git push || echo "::warning::The timetable couldn't be saved to the repository this time. This version of the app still has it."
          fi

      # Building outlines and heights from OpenStreetMap near every station, for the 3D buildings on
      # the map. A copy is kept between builds, so OpenStreetMap is only asked again once a month.
      # Never fails the build: without it, the map just has no buildings.
      - name: Restore saved buildings
        uses: actions/cache/restore@v4
        with:
          path: osm-cache
          key: osm-buildings-v1-${{ github.run_id }}
          restore-keys: osm-buildings-v1-

      - name: Fetch buildings from OpenStreetMap
        run: python3 mrt-tracker-app/tools/build_buildings.py mrt-tracker-app osm-cache

      - name: Fetch RTS Link and Sentosa Express tracks from OpenStreetMap
        run: |
          if [ -f mrt-tracker-app/tools/build_tracks.py ]; then
            python3 mrt-tracker-app/tools/build_tracks.py mrt-tracker-app osm-cache
          fi

      # Station exits from LTA's official exit list, with the places next to each exit (OpenStreetMap).
      # Never fails the build: without it, station pages just don't list exits.
      - name: Fetch station exits (LTA) and nearby places (OpenStreetMap)
        env:
          DATA_GOV_SG_API_KEY: ${{ secrets.DATA_GOV_SG_API_KEY }}
        run: |
          if [ -f mrt-tracker-app/tools/build_exits.py ]; then
            python3 mrt-tracker-app/tools/build_exits.py mrt-tracker-app osm-cache
          fi

      - name: Save buildings for next time
        if: hashFiles('osm-fresh') != ''
        uses: actions/cache/save@v4
        with:
          path: osm-cache
          key: osm-buildings-v1-${{ github.run_id }}

      # The app's page allows its own inline script ('unsafe-inline'); there are no script fingerprints to
      # keep in step any more, so editing the page can't make it open blank. If the policy ever names a
      # fingerprint again it's put back to 'unsafe-inline' here; and if the script itself has a mistake
      # that stops it running, the build stops and says where.
      - name: Check the app page's script
        run: |
          python3 - mrt-tracker-app/app/src/main/assets/index.html <<'PY'
          import os, re, subprocess, sys, tempfile
          path = sys.argv[1]
          page = open(path, encoding="utf-8").read()
          def say(text):
              print(text)
              if os.environ.get("GITHUB_STEP_SUMMARY"):
                  open(os.environ["GITHUB_STEP_SUMMARY"], "a").write("## App page check\n\n" + text + "\n")
          scripts = re.findall(r"<script>(.*?)</script>", page, re.S)
          have = re.search(r"script-src ([^;\"]*);", page)
          if not scripts or not have:
              say("⚠️ The page has no script or no security policy; nothing to check.")
          elif have.group(1).strip() != "'unsafe-inline'":
              page = page[:have.start(1)] + "'unsafe-inline'" + page[have.end(1):]
              open(path, "w", encoding="utf-8").write(page)
              say("🔧 The page's script policy was set back to 'unsafe-inline' for this build.")
          else:
              say("✅ The page's script policy is 'unsafe-inline' (no fingerprint needed).")
          try:
              with tempfile.NamedTemporaryFile("w", suffix=".js", delete=False, encoding="utf-8") as f:
                  f.write("\n".join(scripts))
              r = subprocess.run(["node", "--check", f.name], capture_output=True, text=True, timeout=120)
              if r.returncode != 0:
                  err = r.stderr.splitlines()
                  line = err[0].rsplit(":", 1)[-1] if err else "?"
                  col = next((l.index("^") for l in err[2:4] if "^" in l and not l.replace("^", "").strip()), 0)
                  msg = next((l.strip() for l in err if "Error" in l and not l.strip().startswith("at ")), "SyntaxError")
                  near = err[1][max(0, col - 70):col + 50] if len(err) > 1 else ""
                  say(f"❌ The page's script has a mistake, so the app wouldn't work: {msg}, at line {line} of the script, here:\n\n```\n{near}\n```")
                  sys.exit(1)
          except (FileNotFoundError, subprocess.TimeoutExpired):
              print("Node isn't available; skipped checking the script for mistakes.")
          PY

      - name: Build the app
        env:
          # Claude API key for the Ask tab (optional). Without it, the Ask tab gives built-in answers.
          ORG_GRADLE_PROJECT_aiKey: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -n "$ORG_GRADLE_PROJECT_aiKey" ]; then
            echo "🤖 **Ask tab:** Claude answers (the ANTHROPIC_API_KEY secret is set)." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "🤖 **Ask tab:** built-in answers only. Add an ANTHROPIC_API_KEY secret to let Claude answer." >> "$GITHUB_STEP_SUMMARY"
          fi
          # Version from the build time, so every new build installs over the last one,
          # whatever this workflow file is called.
          VC=$(( ( $(date +%s) - 1767225600 ) / 60 ))
          VN=$(TZ=Asia/Singapore date +%Y.%m.%d-%H%M)
          APK=mrt-tracker.apk
          if [ "$CHANNEL" = "dev" ]; then VN="$VN-dev"; APK=mrt-tracker.apk; fi
          echo "VN=$VN" >> "$GITHUB_ENV"
          echo "APK=$APK" >> "$GITHUB_ENV"
          # The public repo the app checks for updates. MRT Tracker is private, so it isn't put there and
          # doesn't check for updates: each new build is installed from this repo's Releases.
          UPDATE_REPO="${{ github.repository_owner }}/mrt-tracker-releases"
          if [ "$CHANNEL" = "dev" ]; then UPDATE_REPO=""; fi
          gradle -p mrt-tracker-app assembleRelease -Pvc=$VC -Pvn=$VN -Pchannel="$CHANNEL" -PupdateRepo="$UPDATE_REPO" -Pks="$GITHUB_WORKSPACE/signing/mrt-tracker.jks"
          cp mrt-tracker-app/app/build/outputs/apk/release/app-release.apk "$APK"
          printf '{"versionCode":%s,"versionName":"%s"}\n' "$VC" "$VN" > version.json

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.CHANNEL == 'dev' && 'mrt-dev-apk' || 'mrt-tracker-apk' }}
          path: ${{ env.APK }}

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # MRT Tracker goes in the "latest" release; MRT Tracker in a separate "dev" pre-release.
          if [ "$CHANNEL" = "dev" ]; then
            gh release delete dev --yes --cleanup-tag || true
            gh release create dev "$APK" --title "MRT Tracker $VN" --prerelease --latest=false \
              --notes "MRT Tracker, the developer app for trying new features. Download mrt-tracker.apk on your Android phone and open it to install. It installs next to MRT Tracker and doesn't change it."
          else
            gh release delete latest --yes --cleanup-tag || true
            gh release create latest "$APK" --title "MRT Tracker $VN" \
              --notes "Download mrt-tracker.apk on your Android phone and open it to install."
          fi

      # Publishes MRT Tracker to your public "mrt-tracker-releases" repo, where the app looks for
      # updates. Needs the RELEASES_TOKEN secret; skipped if it isn't set. MRT Tracker is never published
      # there (it's only for you); a dev build removes any copy an older build put there.
      - name: Publish update for the app
        env:
          RELEASES_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          PUB_REPO: ${{ github.repository_owner }}/mrt-tracker-releases
        run: |
          if [ -z "$RELEASES_TOKEN" ]; then
            [ "$CHANNEL" = "dev" ] || echo "::warning::RELEASES_TOKEN isn't set, so the app won't be told about this update."
            exit 0
          fi
          export GH_TOKEN="$RELEASES_TOKEN"
          if [ "$CHANNEL" = "dev" ]; then
            gh release delete dev --repo "$PUB_REPO" --yes --cleanup-tag || true
            exit 0
          fi
          gh release delete latest --repo "$PUB_REPO" --yes --cleanup-tag || true
          gh release create latest "$APK" version.json --repo "$PUB_REPO" --title "MRT Tracker $VN" \
            --notes "Open MRT Tracker and tap Update, or download mrt-tracker.apk to install."
