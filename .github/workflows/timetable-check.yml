# Checks the trains-in-service and headway logic. It does not build the app.
name: Timetable checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check trains in service and headways
        run: node tests/timetable-check.js
