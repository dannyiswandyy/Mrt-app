            <footer>
              <p><b>How this works.</b> In the MRT Tracker phone app, trains and next-train times follow LTA's official train timetable, the same published schedule journey planners use, including public holidays. Where the timetable isn't available, they're estimated from typical frequencies and travel times. Either way, they show the schedule, so delays don't appear on the map; disruption notices from LTA appear under Updates.</p>
              <p><b>Sources.</b> Disruption notices: Land Transport Authority (LTA), datamall.lta.gov.sg. News: Google News (news.google.com), with each outlet named on its headline. Social media links: SMRT on X (@SMRT_Singapore) and Facebook (SMRTCorpSG), SBS Transit on X (@SBSTransit_Ltd) and Facebook (SBSTransit), LTA on X (@LTAsg). Train models: SGTrains (sgtrains.com). Satellite map photos: Esri World Imagery (Esri, Vantor, Earthstar Geographics and the GIS User Community). RTS Link: LTA, Wikipedia and AsiaOne. Sentosa Express: Wikipedia, SGTrains and Land Transport Guru; times are estimated from its 7am–midnight hours and 3-minute gaps. Platform crowds: LTA DataMall (datamall2.mytransport.sg), Station Crowd Density Real Time. History: Wikipedia, SGTrains, Land Transport Guru (landtransportguru.net) and LTA news releases. Map: station locations and track shapes from SG Rail Data by Lim Chee Aun (github.com/cheeaun/sgraildata), based on data.gov.sg and LTA data.</p>
            </footer>
