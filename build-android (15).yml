# MRT Tracker - Android app builder
# This one file holds the whole app. Every time it is saved on GitHub, it builds
# the app and publishes the .apk under Releases ("latest").
name: Build MRT Tracker app

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Write the app project
        run: |
          rm -rf mrt-tracker-app
          mkdir -p 'mrt-tracker-app'
          cat > 'mrt-tracker-app/README.md' <<'MRTAPP_EOF'
          # MRT Tracker (Android)

          A small Android app that shows the MRT Train Tracker full screen. The tracker page is bundled inside the app (`app/src/main/assets/index.html`), so trains and timings work offline; the internet is only used for fonts.

          ## Build with GitHub (no computer needed)

          The easiest way is the single file `build-android.yml`, which contains this whole project:

          1. Create a new **private** repository on github.com.
          2. Add the file at `.github/workflows/build-android.yml`.
          3. Open the **Actions** tab and wait for the green tick (about 5 minutes).
          4. Open **Releases → latest** and download `mrt-tracker.apk` on your phone.

          Each new build installs over the previous one, because the first build saves a signing key to `signing/mrt-tracker.jks` in your repository.

          ## Build with Android Studio

          Open this folder in Android Studio and run **Build → Build APK(s)**. A debug build needs no signing key.

          ## Updating the tracker

          Replace `app/src/main/assets/index.html` (or the matching part of `build-android.yml`) and build again.
          MRTAPP_EOF
          mkdir -p 'mrt-tracker-app/app'
          cat > 'mrt-tracker-app/app/build.gradle' <<'MRTAPP_EOF'
          plugins {
              id 'com.android.application'
          }

          android {
              namespace 'sg.mrttracker.app'
              compileSdk 34

              defaultConfig {
                  applicationId 'sg.mrttracker.app'
                  minSdk 24
                  targetSdk 34
                  // GitHub passes in a number that grows with every build (minutes since 2026), so each
                  // new build installs over the last one, and the build date and time as the version name.
                  versionCode Integer.parseInt((project.findProperty('vc') ?: '1').toString())
                  versionName((project.findProperty('vn') ?: 'dev').toString())
                  // LTA DataMall key built into the app, so live alerts work for everyone with no setup.
                  // Stored scrambled (the app unscrambles it in memory), so it can't be read from this file
                  // or found by searching the app's contents.
                  // Public GitHub repo the app checks for updates, e.g. yourname/mrt-tracker-releases (empty = off).
                  buildConfigField 'String', 'UPDATE_REPO', '"' + (project.findProperty('updateRepo') ?: '').toString().replaceAll('[^A-Za-z0-9._/-]', '') + '"'
                  buildConfigField 'String', 'LTA_KEY_X', '"ac482e340c45fb8ce3d416f40eeba0afa7c59acac8579667"'
              }

              buildFeatures {
                  buildConfig true
              }

              signingConfigs {
                  release {
                      // The keystore is created once by the GitHub build and kept in the repo,
                      // so every later build is signed with the same key.
                      storeFile file(project.findProperty('ks') ?: 'missing.jks')
                      storePassword 'mrttracker'
                      keyAlias 'mrttracker'
                      keyPassword 'mrttracker'
                  }
              }

              buildTypes {
                  release {
                      // Shrink and scramble the app's code so it's harder to pick apart.
                      minifyEnabled true
                      proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                      signingConfig signingConfigs.release
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_17
                  targetCompatibility JavaVersion.VERSION_17
              }
          }
          MRTAPP_EOF
          mkdir -p 'mrt-tracker-app/app'
          cat > 'mrt-tracker-app/app/proguard-rules.pro' <<'MRTAPP_EOF'
          # The tracker page calls these methods by name, so they must keep their names.
          -keepclassmembers class * {
              @android.webkit.JavascriptInterface <methods>;
          }
          -keepattributes JavascriptInterface
          MRTAPP_EOF
          mkdir -p 'mrt-tracker-app/app/src/main'
          cat > 'mrt-tracker-app/app/src/main/AndroidManifest.xml' <<'MRTAPP_EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">

              <uses-permission android:name="android.permission.INTERNET" />
              <!-- In-app updates: install new versions, notify about them, and keep checking after a restart. -->
              <uses-permission android:name="android.permission.REQUEST_INSTALL_PACKAGES" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED" />

              <application
                  android:label="@string/app_name"
                  android:icon="@mipmap/ic_launcher"
                  android:roundIcon="@mipmap/ic_launcher"
                  android:theme="@style/AppTheme"
                  android:allowBackup="false"
                  android:fullBackupContent="false"
                  android:dataExtractionRules="@xml/data_extraction_rules"
                  android:usesCleartextTraffic="false"
                  android:networkSecurityConfig="@xml/network_security_config">

                  <activity
                      android:name=".MainActivity"
                      android:exported="true"
                      android:launchMode="singleTop"
                      android:configChanges="orientation|screenSize|screenLayout|keyboardHidden|uiMode">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>

                  <service
                      android:name=".UpdateJob"
                      android:permission="android.permission.BIND_JOB_SERVICE"
                      android:exported="false" />

                  <receiver
                      android:name=".InstallReceiver"
                      android:exported="false" />
              </application>
          </manifest>
          MRTAPP_EOF
          mkdir -p 'mrt-tracker-app/app/src/main/assets'
          cat > 'mrt-tracker-app/app/src/main/assets/index.html' <<'MRTAPP_EOF'
          <!doctype html>
          <html lang="en">
          <head>
          <meta charset="utf-8">
          <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'sha256-NVwgwSMdnmoYEdTm5d95+6IER1J5NM++IJwWx1V2SYA='; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data: https://server.arcgisonline.com; connect-src 'none'; media-src 'none'; object-src 'none'; frame-src 'none'; worker-src 'none'; base-uri 'none'; form-action 'none'">
          <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
          <meta name="referrer" content="no-referrer">
          <style>:root{color-scheme:light}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
          <title>MRT Train Tracker</title>
          <meta name="claude:viewport-fit-sides" content="cover">
          <link rel="preconnect" href="https://fonts.googleapis.com">
          <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
          <style>
          :root{
            --bg:#eef1f4; --panel:#ffffff; --fg:#14181d; --muted:#5b6672; --rule:#d6dce3;
            --track:#c7cfd8; --soft:#e3e8ee; --chip:#14181d; --chipfg:#ffffff; --warn:#a35c00; --warnbg:#fff2dc;
            --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
            --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
            --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
            --NSL:#d42e12; --EWL:#009645; --CG:#009645; --NEL:#9900aa; --CCL:#fa9e0d; --DTL:#005ec4; --TEL:#9d5b25; --RTS:#00919e; --SEN:#d63384;
            --BP:#748477; --SE:#748477; --SW:#748477; --PE:#748477; --PW:#748477;
            --rowh:52px;
            --bad:#c8102e; --badbg:#fde8ea; --good:#0a7a3d; --goodbg:#e3f4ea;
            --shadow:0 8px 28px rgba(0,0,0,.12);
          }
          @media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
            --bg:#0b0e12; --panel:#141920; --fg:#e8edf2; --muted:#93a0ad; --rule:#242d37;
            --track:#34404c; --soft:#1d242d; --chip:#e8edf2; --chipfg:#0f1317; --warn:#ffb85c; --warnbg:#2d2210;
            --NEL:#c04fd4; --DTL:#3d8af0; --TEL:#c08050; --bad:#ff5a6a; --badbg:#3a1519; --good:#5fd38d; --goodbg:#11291c; --BP:#93a395; --SE:#93a395; --SW:#93a395; --PE:#93a395; --PW:#93a395; --RTS:#32bfca; --SEN:#f06aa8;
            --shadow:0 10px 32px rgba(0,0,0,.45); color-scheme:dark}}
          :root[data-theme="dark"]{
            --bg:#0b0e12; --panel:#141920; --fg:#e8edf2; --muted:#93a0ad; --rule:#242d37;
            --track:#34404c; --soft:#1d242d; --chip:#e8edf2; --chipfg:#0f1317; --warn:#ffb85c; --warnbg:#2d2210;
            --NEL:#c04fd4; --DTL:#3d8af0; --TEL:#c08050; --bad:#ff5a6a; --badbg:#3a1519; --good:#5fd38d; --goodbg:#11291c; --BP:#93a395; --SE:#93a395; --SW:#93a395; --PE:#93a395; --PW:#93a395; --RTS:#32bfca; --SEN:#f06aa8;
            --shadow:0 10px 32px rgba(0,0,0,.45); color-scheme:dark}

          *{box-sizing:border-box}
          [hidden]{display:none!important}
          body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;
            padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);margin:0}
          body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--panel)}

          /* APP SHELL & TOP HEADER */
          .wrap{max-width:1680px;margin:0 auto;padding-block:0 76px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
          header.app-header{
            position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);
            padding:10px 0 8px;display:grid;gap:8px;border-bottom:1px solid var(--rule);margin-bottom:8px;
          }
          .top{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
          .brand-wrap{display:flex;align-items:center;gap:10px}
          h1{font-family:var(--display);font-size:26px;line-height:1;margin:0;letter-spacing:.02em;text-transform:uppercase}
          .top-right{display:flex;align-items:center;gap:10px;margin-left:auto;flex-wrap:wrap;justify-content:flex-end;min-width:0}
          .clock{font-family:var(--mono);font-size:18px;font-variant-numeric:tabular-nums;text-align:right;line-height:1;background:var(--panel);padding:6px 10px;border-radius:8px;border:1px solid var(--rule)}
          .clock small{display:block;font-family:var(--body);font-size:10px;color:var(--muted);letter-spacing:.08em;text-transform:uppercase;margin-top:3px}
          .theme-btn{border:1px solid var(--rule);background:var(--panel);color:var(--fg);width:38px;height:38px;border-radius:8px;cursor:pointer;font-size:16px;display:grid;place-items:center}
          /* Phones: theme button beside the title, view tabs and clock on the row below */
          @media (max-width:480px){
            .top-right{display:contents}
            .theme-btn{order:1;margin-left:auto}
            .views{order:2}
            .top .clock{order:3;margin-left:auto}
          }
          @media (max-width:380px){ h1{font-size:clamp(18px,6.3vw,26px)} }
          .theme-btn:hover{background:var(--soft)}

          /* CONTROLS BAR: SEARCH + VIEW SWITCHER + LINE TABS */
          .header-controls{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
          .search{position:relative;flex:1 1 260px;display:flex;gap:8px}
          .search input{width:100%;font:500 14px var(--body);padding:9px 34px 9px 12px;border-radius:8px;border:1px solid var(--rule);background:var(--panel);color:var(--fg)}
          .search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer;padding:2px 6px}
          .search-drop{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--panel);border:1px solid var(--rule);border-radius:10px;box-shadow:var(--shadow);max-height:320px;overflow-y:auto;z-index:60}
          .s-item{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;border:0;border-bottom:1px solid var(--soft);background:none;color:var(--fg);padding:9px 12px;font:500 14px var(--body);text-align:left;cursor:pointer}
          .s-item:last-child{border-bottom:0}
          .s-item:hover,.s-item:focus{background:var(--soft);outline:none}
          .s-badges{display:flex;gap:4px;flex-wrap:wrap}

          .views{display:flex;gap:3px;background:var(--soft);border-radius:9px;padding:3px;flex:0 0 auto}
          .views button{border:0;background:none;color:var(--muted);font:600 13px var(--body);padding:6px 12px;border-radius:7px;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:6px}
          .views button[aria-selected="true"]{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
          .views .badge{min-width:18px;height:18px;border-radius:9px;background:var(--bad);color:#fff;font-size:11px;display:grid;place-items:center;padding:0 5px}

          .tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
          .tabs::-webkit-scrollbar{display:none}
          .tab{flex:0 0 auto;border:2px solid transparent;background:var(--panel);color:var(--fg);border-radius:8px;padding:6px 10px;
            font:600 13px var(--body);display:flex;align-items:center;gap:6px;cursor:pointer;border:1px solid var(--rule)}
          .tabsep{flex:0 0 auto;align-self:center;font:600 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding:0 2px 0 6px}
          .tab .sw{width:10px;height:10px;border-radius:3px;background:var(--c)}
          .tab[aria-selected="true"]{border-color:var(--c);box-shadow:inset 0 0 0 1px var(--c);background:var(--soft)}
          .tab:focus-visible,.row:focus-visible,input:focus-visible{outline:2px solid var(--fg);outline-offset:2px}

          /* STATUS & FLEET ACCORDION */
          .status{background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:11px 14px;display:grid;grid-template-columns:auto 1fr;gap:3px 12px;align-items:center}
          .status .bar{grid-row:span 2;width:8px;align-self:stretch;border-radius:4px;background:var(--c)}
          .status b{font-family:var(--display);font-size:20px;letter-spacing:.01em}
          .status .src{color:var(--muted)}
          .status span{color:var(--muted);font-size:13.5px}
          .notice{background:var(--warnbg);color:var(--warn);border-radius:8px;padding:8px 12px;font-size:13px;margin-top:8px}

          .fleet{background:var(--panel);border:1px solid var(--rule);border-radius:10px;margin-top:8px;overflow:hidden}
          .fleet-details summary{list-style:none;padding:9px 14px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);user-select:none}
          .fleet-details summary::-webkit-details-marker{display:none}
          .fleet-details summary b{color:var(--fg)}
          .fleet-details[open] .chev{transform:rotate(180deg)}
          .fleet-body{padding:10px 14px 12px;border-top:1px solid var(--soft)}
          .fleet ul{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(145px,1fr));gap:8px 12px}
          .fleet li{display:grid;gap:1px;min-width:0}
          .fleet .m{font-family:var(--display);font-weight:700;font-size:16px;letter-spacing:.02em;display:flex;align-items:center;gap:6px}
          .fleet .m i{font-style:normal;font:600 10px var(--body);letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--c);border-radius:3px;padding:1px 4px}
          .fleet .m i.old{background:var(--muted)}
          .fleet .s{font-size:12.5px;color:var(--muted)}

          /* BOARD & TRAINS */
          .legend{display:flex;justify-content:space-between;font-size:11.5px;font-weight:600;color:var(--muted);margin:12px 4px 6px;text-transform:uppercase;letter-spacing:.07em}
          .board{position:relative;background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:6px 0}
          .lanes{position:absolute;left:0;top:6px;width:64px;height:calc(100% - 12px);pointer-events:none;z-index:2}
          .spine{position:absolute;left:28px;width:8px;border-radius:4px;background:var(--c)}
          .spine.future{background:repeating-linear-gradient(var(--track) 0 6px,transparent 6px 10px)}
          .train{position:absolute;left:0;top:0;width:22px;height:26px;padding:0;border:0;background:none;cursor:pointer;pointer-events:auto;
            will-change:transform;filter:drop-shadow(0 1px 1px rgba(0,0,0,.35))}
          .train .tic{position:relative;z-index:1}
          .train::before{content:"";position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px 0 0 -13px;border-radius:50%;
            background:var(--c);opacity:0;animation:ping 2s ease-out infinite;animation-delay:var(--d,0s)}
          .train.moving::after{content:"";position:absolute;left:8px;width:6px;height:22px;border-radius:3px;opacity:.55}
          .train.d0.moving::after{bottom:20px;background:linear-gradient(to top,var(--c),transparent)}
          .train.d1.moving::after{top:20px;background:linear-gradient(to bottom,var(--c),transparent)}
          .train.dwell .tic{animation:bob 1.2s ease-in-out infinite}
          .train.dwell .tic .win{fill:#fff6c2;opacity:1}
          @keyframes ping{0%{transform:scale(.5);opacity:.45}100%{transform:scale(1.9);opacity:0}}
          @keyframes bob{50%{transform:translateY(-1.5px)}}
          .live{display:inline-block;width:7px;height:7px;border-radius:50%;background:#e5322d;margin-right:5px;vertical-align:1px;animation:blink 1.6s ease-in-out infinite}
          @keyframes blink{50%{opacity:.25}}
          .train svg{display:block;width:22px;height:26px}
          .tic .body{fill:var(--c);stroke:var(--panel);stroke-width:1.5}
          .tic .win{fill:#ffffff;opacity:.92}
          .tic .lamp{fill:#fff6c2}
          .tic .arrow{fill:var(--fg)}
          .train.sel .tic .body{stroke:var(--fg);stroke-width:2.5}
          .train:focus-visible{outline:2px solid var(--fg);outline-offset:1px;border-radius:6px}
          .train.d1{left:40px}
          .train.d0{left:3px}
          .tinfo{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--rule);border-radius:10px;padding:10px 12px;margin-top:8px;font-size:14px;border-left:6px solid var(--c)}
          .tinfo b{font-weight:600}
          .tinfo .eta{margin-left:auto;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
          .tinfo button{border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer;padding:0 2px}
          .tinfo .tic{width:18px;height:22px;display:block}

          .tview{display:inline-flex;gap:2px;background:var(--soft);border-radius:8px;padding:2px;margin-bottom:8px}
          .tview button{border:0;background:none;color:var(--muted);font:600 13px var(--body);padding:5px 14px;border-radius:6px;cursor:pointer}
          .tview button[aria-selected="true"]{background:var(--panel);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}

          /* MAP VIEW & OVERLAYS */
          #mapView{position:relative;display:flex;flex-direction:column}
          .mapwrap{position:relative;height:calc(100vh - 210px);min-height:420px;border-radius:12px;overflow:hidden;background:var(--panel);border:1px solid var(--rule)}
          .mapwrap canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
          .mapwrap canvas:active{cursor:grabbing}
          .mapcount{position:absolute;left:10px;top:10px;font-size:12px;font-weight:500;color:var(--muted);background:var(--panel);border:1px solid var(--rule);border-radius:8px;padding:4px 9px;pointer-events:none;opacity:.94;box-shadow:0 2px 8px rgba(0,0,0,.12)}
          .mapctl{position:absolute;right:10px;top:10px;display:grid;gap:6px}
          .cwd{display:inline-flex;align-items:center;gap:3px;font:600 10.5px var(--body);letter-spacing:.02em;border-radius:10px;padding:1px 7px 1px 5px;vertical-align:middle;white-space:nowrap;line-height:1.5}
          .cwd svg{width:11px;height:11px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
          .cwd.l{background:var(--goodbg);color:var(--good)} .cwd.m{background:var(--warnbg);color:var(--warn)} .cwd.h{background:var(--badbg);color:var(--bad)}
          .cwd-slot:not(:empty){margin-left:4px}
          .cw-note{font-size:12.5px;color:var(--muted);margin:0 0 8px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
          .mi-crowd{display:flex;flex-wrap:wrap;gap:4px;align-items:center;font-size:12.5px;color:var(--muted);margin:2px 0 8px}
          .mi-crowd .code{margin-right:2px}
          .mapcrowd{position:absolute;left:10px;top:46px;display:flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--panel);color:var(--fg);border-radius:9px;padding:5px 10px;font:600 12.5px var(--body);cursor:pointer;box-shadow:0 2px 8px rgba(0,0,0,.12)}
          .mapcrowd svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round}
          .mapcrowd[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
          .mapcrowd .k{display:none;gap:5px;font-weight:500}
          .mapcrowd[aria-pressed="true"] .k{display:inline-flex}
          .mapcrowd .k i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:2px;vertical-align:0}
          .maplayer{position:absolute;left:10px;bottom:10px;display:flex;gap:2px;background:var(--panel);border:1px solid var(--rule);border-radius:9px;padding:2px;box-shadow:0 2px 8px rgba(0,0,0,.12)}
          .maplayer button{border:0;background:none;color:var(--muted);font:600 12.5px var(--body);padding:6px 11px;border-radius:7px;cursor:pointer}
          .maplayer button[aria-pressed="true"]{background:var(--fg);color:var(--bg)}
          .mapattr{position:absolute;right:8px;bottom:6px;max-width:52%;text-align:right;font-size:10px;line-height:1.25;color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.9),0 0 4px rgba(0,0,0,.6);pointer-events:none}
          .mapctl button{width:38px;height:38px;border-radius:9px;border:1px solid var(--rule);background:var(--panel);color:var(--fg);font:600 18px var(--body);cursor:pointer;box-shadow:0 2px 6px rgba(0,0,0,.15)}
          .mapctl button:hover{background:var(--soft)}
          .mapinfo{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:12px 14px;margin-top:8px;display:grid;gap:6px;font-size:14px;box-shadow:var(--shadow)}
          .mi-h{display:flex;align-items:center;gap:8px}
          .mi-h b{font-size:16px}
          .mi-x{margin-left:auto;border:0;background:none;color:var(--muted);font-size:20px;cursor:pointer;padding:0 4px}
          .mi-row{display:flex;justify-content:space-between;align-items:center;gap:10px;font:inherit;color:var(--fg);background:none;border:0;padding:6px 4px;text-align:left;width:100%;border-radius:6px}
          .mi-go{cursor:pointer;border-top:1px solid var(--soft)}
          .mi-go:hover{background:var(--soft)}
          .mi-go span:first-child{display:flex;align-items:center;gap:6px;min-width:0}
          .mi-t{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;color:var(--muted)}
          .mi-act{display:flex;gap:8px;flex-wrap:wrap;margin-top:2px}
          .hint{color:var(--muted);font-size:13px;margin:6px 0 0}
          @media (prefers-reduced-motion:reduce){.train::before,.train.dwell .tic,.live{animation:none}}

          /* STATION ROWS */
          .row{position:relative;min-height:var(--rowh);display:grid;grid-template-columns:64px 1fr;align-items:center;cursor:pointer;border-top:1px solid var(--soft)}
          .row:first-of-type{border-top:0}
          .row:hover{background:color-mix(in srgb,var(--soft) 50%,transparent)}
          .row .dot{position:absolute;left:24px;top:calc(var(--rowh)/2 - 8px);width:16px;height:16px;border-radius:50%;background:var(--panel);border:4px solid var(--c);z-index:1}
          .row.ix .dot{border-color:var(--fg);border-width:3px;width:18px;height:18px;left:23px;top:calc(var(--rowh)/2 - 9px)}
          .row.future .dot{border-color:var(--track)}
          .st{grid-column:2;display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:7px 12px 7px 4px;min-width:0}
          .name{display:flex;align-items:center;gap:6px;flex-wrap:wrap;min-width:0;font-weight:600;font-size:15.5px}
          .code{font-family:var(--display);font-weight:700;font-size:13px;color:#fff;background:var(--c);border-radius:4px;padding:1px 5px;letter-spacing:.03em;line-height:1.25}
          .code.sm{font-size:11px;padding:0 4px}
          .row.future .name{color:var(--muted)}
          .next{font-family:var(--mono);font-size:13px;font-variant-numeric:tabular-nums;text-align:right;color:var(--muted);white-space:nowrap;display:grid;gap:1px;align-self:center}
          .next em{font-style:normal;color:var(--fg);font-weight:600}
          .detail{grid-column:1/-1;font-size:13px;color:var(--muted);display:grid;gap:4px;padding-top:6px;margin-top:4px;border-top:1px dashed var(--rule)}
          .detail div{display:flex;justify-content:space-between;gap:10px}
          .detail .t{font-family:var(--mono);color:var(--fg);font-variant-numeric:tabular-nums;white-space:nowrap}
          .row.open{background:var(--soft)}

          /* ALERTS & UPDATES */
          .tab.dis::after{content:"";width:8px;height:8px;border-radius:50%;background:var(--bad);margin-left:2px}
          .alert{border-radius:10px;padding:10px 14px;margin-bottom:8px;display:grid;gap:4px;font-size:14px;cursor:pointer;border:1px solid var(--rule);text-align:left;width:100%;font-family:var(--body);color:var(--fg)}
          .alert.ok{background:var(--goodbg);border-color:color-mix(in srgb,var(--good) 30%,transparent);cursor:default}
          .alert.ok b{color:var(--good)}
          .alert.bad{background:var(--badbg);border-left:6px solid var(--bad)}
          .alert.bad b{color:var(--bad)}
          .alert.off{background:var(--panel)}
          #updBanner{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--fg);color:var(--bg);border-radius:10px;padding:10px 12px;margin-bottom:8px;font-size:14px}
          #updBanner b{font-weight:600}
          #updBanner .sub{opacity:.8;font-size:13px}
          #updBanner .ubtn{margin-left:auto;border:0;border-radius:8px;padding:8px 14px;font:600 14px var(--body);background:var(--bg);color:var(--fg);cursor:pointer}
          #updBanner .ubtn:disabled{opacity:.6;cursor:default}
          #updBanner .ubar{flex-basis:100%;height:4px;border-radius:2px;background:color-mix(in srgb,var(--bg) 30%,transparent);overflow:hidden}
          #updBanner .ubar i{display:block;height:100%;background:var(--bg);width:0}
          .alert.warn{background:var(--warnbg);border-left:6px solid var(--warn)}
          .alert.warn b{color:var(--warn)}
          .alert .sub{color:var(--muted);font-size:13px}
          .seg{display:grid;gap:3px}
          .seg .h{display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-weight:600}
          .chip{font:600 11px var(--body);letter-spacing:.04em;text-transform:uppercase;border-radius:4px;padding:1px 6px;background:var(--bad);color:#fff}
          .chip.sample{background:var(--muted)}
          .row.dis .name::after{content:"Disrupted";font:600 10px var(--body);letter-spacing:.05em;text-transform:uppercase;color:#fff;background:var(--bad);border-radius:3px;padding:1px 5px}
          .upd{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:14px;margin-top:8px;align-items:start}
          .card{background:var(--panel);border:1px solid var(--rule);border-radius:12px;padding:16px}
          .card h2{font-family:var(--display);font-size:20px;margin:0 0 8px;letter-spacing:.01em}
          .card p{margin:0}
          .card .muted,.muted{color:var(--muted);font-size:13px}
          .msgs,.news{list-style:none;margin:0;padding:0;display:grid;gap:10px}
          .msgs li{border-left:3px solid var(--bad);padding-left:10px;display:grid;gap:2px;max-width:65ch}
          .news a{color:var(--fg);text-decoration:none;font-weight:600;display:block}
          .news a:hover{text-decoration:underline}
          .news li{display:grid;gap:2px;padding-bottom:10px;border-bottom:1px solid var(--soft)}
          .news li:last-child{border-bottom:0;padding-bottom:0}
          .links{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
          .links a{display:grid;gap:1px;padding:10px 12px;border-radius:8px;background:var(--soft);color:var(--fg);text-decoration:none;font-weight:600;font-size:14px}
          .links a span{font-weight:400;font-size:12px;color:var(--muted)}
          .set{display:grid;gap:10px}
          .set label{font-weight:600;font-size:14px}
          .set .rowi{display:flex;gap:8px}
          .set input[type=password],.set input[type=text]{flex:1;min-width:0;font:500 15px var(--mono);padding:9px 12px;border-radius:8px;border:1px solid var(--rule);background:var(--bg);color:var(--fg)}
          .btn{border:0;border-radius:8px;padding:9px 14px;font:600 14px var(--body);background:var(--fg);color:var(--bg);cursor:pointer}
          .btn.ghost{background:var(--soft);color:var(--fg)}
          .toggle{display:flex;align-items:center;gap:10px;font-size:14px}
          .toggle input{width:20px;height:20px;accent-color:var(--fg)}
          footer{color:var(--muted);font-size:12.5px;margin-top:20px;display:grid;gap:6px;border-top:1px solid var(--rule);padding-top:14px}
          footer b{color:var(--fg)}

          /* MOBILE BOTTOM NAVIGATION BAR */
          .mob-nav{
            position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--panel);border-top:1px solid var(--rule);
            display:grid;grid-template-columns:repeat(4,1fr);padding:4px 8px calc(4px + env(safe-area-inset-bottom,0px));
            box-shadow:0 -4px 16px rgba(0,0,0,.12);
          }
          .mob-nav button{
            border:0;background:none;color:var(--muted);font:600 12px var(--body);padding:6px 4px;border-radius:8px;
            display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;position:relative;
          }
          .mob-nav button svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
          .mob-nav button[aria-selected="true"]{color:var(--fg);background:var(--soft)}
          .mob-nav .m-badge{position:absolute;top:2px;right:calc(50% - 22px);min-width:16px;height:16px;border-radius:8px;background:var(--bad);color:#fff;font-size:10px;display:grid;place-items:center;padding:0 4px}

          /* PC / WIDE TABLET SPLIT-SCREEN OVERHAUL (>= 1024px) */
          @media (min-width: 1024px){
            body{overflow:hidden;height:100vh}
            .wrap{height:100vh;display:flex;flex-direction:column;padding:0 18px 10px}
            .mob-nav,.tview{display:none!important}
            #tabs:not([hidden]){display:flex!important}
            #viewTrains:not([hidden]){
              flex:1;min-height:0;display:grid;grid-template-columns:1.35fr 1fr;gap:16px;align-items:stretch;
            }
            #mapView,#lineView{display:flex!important;flex-direction:column;min-height:0;height:100%}
            .mapwrap{flex:1;height:auto!important;min-height:0}
            #mapInfo{position:absolute;left:12px;bottom:12px;width:min(420px,calc(100% - 24px));margin:0;z-index:10;backdrop-filter:blur(10px);background:color-mix(in srgb,var(--panel) 92%,transparent)}
            #lineView{overflow-y:auto;padding-right:4px;scrollbar-width:thin}
            #viewUpdates:not([hidden]),#viewHist:not([hidden]){flex:1;overflow-y:auto;padding-bottom:24px}
            footer{display:none}
          }

          /* HISTORY TAB */
          .hist{display:grid;gap:12px;max-width:900px;margin:8px auto 0;min-width:0}
          .hist .card{min-width:0}
          .hl-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:8px}
          .hl{display:grid;grid-template-columns:8px 1fr;gap:1px 10px;text-align:left;border:1px solid var(--rule);border-radius:10px;background:var(--panel);color:var(--fg);padding:10px 12px;font:inherit;cursor:pointer}
          .hl:hover,.hs:hover,.hchip:hover,.otd-list button:hover{background:var(--soft)}
          .hl i{grid-row:span 2;border-radius:4px;background:var(--c)}
          .hl b{font-weight:600;font-size:15px}
          .hl span{font-size:12.5px;color:var(--muted)}
          .hm-list{display:grid;gap:12px}
          .hm h3{font:700 15px var(--display);letter-spacing:.03em;text-transform:uppercase;margin:0 0 6px;display:flex;align-items:center;gap:6px}
          .hm h3 i{width:10px;height:10px;border-radius:3px;background:var(--c)}
          .hchips{display:flex;flex-wrap:wrap;gap:6px}
          .hchip{border:1px solid var(--rule);background:var(--panel);color:var(--fg);border-radius:8px;padding:6px 10px;font:600 13px var(--body);cursor:pointer;display:inline-flex;align-items:center;gap:6px;text-align:left}
          .hchip.old{color:var(--muted);border-style:dashed}
          .hfind{width:100%;font:500 15px var(--body);padding:10px 12px;border-radius:8px;border:1px solid var(--rule);background:var(--bg);color:var(--fg)}
          .hs-list{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));column-gap:16px;margin-top:8px}
          .hs{display:flex;align-items:center;justify-content:space-between;gap:8px;border:0;border-bottom:1px solid var(--soft);background:none;color:var(--fg);padding:9px 4px;font:500 14.5px var(--body);text-align:left;cursor:pointer;min-width:0}
          .hs .codes{display:flex;gap:3px;flex-wrap:wrap;justify-content:flex-end}
          .otd{border-left:6px solid var(--NSL)}
          .otd-list{list-style:none;margin:0;padding:0;display:grid;gap:6px}
          .otd-list button{display:grid;gap:2px;width:100%;text-align:left;border:0;background:none;color:var(--fg);font:inherit;padding:6px;margin:0 -6px;border-radius:8px;cursor:pointer}
          .otd-list .y{font:600 12px var(--mono);color:var(--muted)}
          .otd-list b{font-weight:600;font-size:15px}
          /* HISTORY CARD (bottom sheet on phones, side panel on wide screens) */
          .sheet-bg{position:fixed;inset:0;z-index:70;background:rgba(0,0,0,.45)}
          .sheet{position:fixed;left:0;right:0;bottom:0;z-index:71;max-height:88vh;display:flex;flex-direction:column;background:var(--panel);color:var(--fg);
            border-radius:16px 16px 0 0;border-top:6px solid var(--c);box-shadow:0 -8px 30px rgba(0,0,0,.3);padding-bottom:env(safe-area-inset-bottom,0px)}
          body.sheet-open{overflow:hidden}
          .sheet-h{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:2px 8px;padding:12px 12px 10px 16px;border-bottom:1px solid var(--soft)}
          .sheet-h .k{grid-column:2;display:flex;align-items:center;gap:5px;flex-wrap:wrap;font:600 12px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
          .sheet-h h2{grid-column:2;font:700 26px/1.1 var(--display);margin:0;letter-spacing:.01em}
          .sheet-h button{width:40px;height:40px;border-radius:20px;border:0;background:var(--soft);color:var(--fg);font-size:20px;cursor:pointer;grid-row:1 / span 2}
          #sheetBack{grid-column:1}
          #sheetX{grid-column:3}
          .sheet-body{overflow-y:auto;overscroll-behavior:contain;padding:14px 16px 22px;display:grid;gap:16px;align-content:start}
          .hfacts{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
          .hfacts div{background:var(--soft);border-radius:8px;padding:8px 10px;display:grid;gap:2px;min-width:0}
          .hfacts span{font:600 11px var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
          .hfacts b{font-weight:600;font-size:14px}
          .hfacts small{font-weight:400;color:var(--muted)}
          .hstory p{margin:0 0 9px;line-height:1.55;max-width:65ch}
          .hstory p:last-child{margin-bottom:0}
          .hsub{font:600 12px var(--body);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
          .hstat{display:inline-block;font:600 11px var(--body);letter-spacing:.06em;text-transform:uppercase;border-radius:4px;padding:3px 8px;background:var(--goodbg);color:var(--good)}
          .hstat.old{background:var(--soft);color:var(--muted)}
          .hstat.warn{background:var(--warnbg);color:var(--warn)}
          .tl{list-style:none;margin:0;padding:0;display:grid}
          .tl li{display:grid;grid-template-columns:96px 1fr;gap:10px}
          .tl .d{font:600 12px/1.4 var(--mono);color:var(--muted);padding:7px 0;font-variant-numeric:tabular-nums}
          .tl .e{border-left:3px solid var(--c);padding:6px 0 6px 12px;position:relative;font-size:14px;line-height:1.4}
          .tl .e::before{content:"";position:absolute;left:-7px;top:11px;width:11px;height:11px;border-radius:50%;background:var(--panel);border:3px solid var(--c);box-sizing:border-box}
          .tl li.up .d{color:var(--good)}
          .tl li.up .e::before{border-style:dashed}
          .hall summary{cursor:pointer;font-weight:600;font-size:14px;margin-bottom:8px}
          /* Tap targets added to the tracker */
          .status{grid-template-columns:auto 1fr auto}
          .status > b,.status > span{grid-column:2}
          .status .hb{grid-column:3;grid-row:1 / span 2;align-self:center;border:1px solid var(--rule);background:var(--panel);color:var(--fg);border-radius:8px;padding:7px 10px;font:600 13px var(--body);cursor:pointer}
          .fbtn{display:grid;gap:1px;width:100%;text-align:left;border:0;background:none;color:inherit;font:inherit;padding:6px;margin:-6px;border-radius:8px;cursor:pointer;min-width:0}
          .fbtn:hover{background:var(--soft)}
          .fleet .past{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:10px 0 0}
          .fleet .past .hchip{padding:4px 8px;font-size:12px}
          .dact{justify-content:flex-start!important;margin-top:2px}
          .hlink{border:0;background:none;color:var(--fg);font:600 13px var(--body);padding:4px 0;cursor:pointer;text-decoration:underline;text-underline-offset:3px}
          @media (min-width:1024px){
            .sheet{left:auto;top:0;bottom:0;width:460px;max-height:none;border-radius:0;border-top:0;border-left:6px solid var(--c)}
          }
          /* Phones: shorter view names so three tabs fit beside the clock */
          @media (max-width:480px){ .views .lg{display:none} .views button{padding:6px 10px} }
          </style>

          <div class="wrap">
            <header class="app-header">
              <div class="top">
                <div class="brand-wrap">
                  <h1>MRT Train Tracker</h1>
                </div>
                <div class="top-right">
                  <div class="views" role="tablist" aria-label="Views">
                    <button type="button" role="tab" id="vTrains" aria-selected="true"><span><span class="lg">Live </span>Tracker</span></button>
                    <button type="button" role="tab" id="vHist" aria-selected="false">History</button>
                    <button type="button" role="tab" id="vUpdates" aria-selected="false"><span>Alerts<span class="lg"> &amp; News</span></span> <span class="badge" id="vBadge" hidden></span></button>
                  </div>
                  <div class="clock"><span id="clock">--:--:--</span><small><span class="live"></span><span id="liveLabel">Live</span> · SGT</small></div>
                  <button type="button" class="theme-btn" id="themeBtn" aria-label="Switch theme" title="Toggle Dark / Light theme">◐</button>
                </div>
              </div>
              <div class="header-controls">
                <div class="search" id="searchBox">
                  <input id="find" list="stations" placeholder="Search station or code (e.g. Bishan, NS17, EW24)…" autocomplete="off" aria-label="Find a station">
                  <button type="button" class="search-clear" id="findClear" hidden aria-label="Clear search">×</button>
                  <div class="search-drop" id="searchDrop" hidden></div>
                  <datalist id="stations"></datalist>
                </div>
                <div class="tview" role="tablist" aria-label="Train view">
                  <button type="button" role="tab" id="tvMap" aria-selected="true">Map</button>
                  <button type="button" role="tab" id="tvLine" aria-selected="false">Line Board</button>
                </div>
              </div>
              <div class="tabs" id="tabs" role="tablist" aria-label="MRT lines"></div>
            </header>

            <div id="updBanner" hidden></div>
            <div id="alertBanner"></div>

            <main id="viewTrains">
              <section id="mapView">
                <div class="mapwrap" id="mapWrap">
                  <canvas id="mapCv" aria-label="Map of all MRT and LRT lines with estimated train positions"></canvas>
                  <div class="mapcount" id="mapCount"></div>
                  <div class="mapctl">
                    <button type="button" id="mapIn" aria-label="Zoom in" title="Zoom in">+</button>
                    <button type="button" id="mapOut" aria-label="Zoom out" title="Zoom out">−</button>
                    <button type="button" id="mapReset" aria-label="Show whole network" title="Reset map">⤢</button>
                  </div>
                  <div class="maplayer" role="group" aria-label="Map background">
                    <button type="button" id="mapSimple" aria-pressed="true">Simple</button>
                    <button type="button" id="mapSat" aria-pressed="false">Satellite</button>
                  </div>
                  <div class="mapattr" id="mapAttr" hidden></div>
                  <button type="button" class="mapcrowd" id="mapCrowd" aria-pressed="false" hidden>
                    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="9" cy="7" r="3"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6"/><circle cx="17" cy="8" r="2.5"/><path d="M15.5 14.2c3 .2 5.5 2.6 5.5 5.8"/></svg>Crowds
                    <span class="k"><span><i style="background:var(--good)"></i>Low</span><span><i style="background:var(--warn)"></i>Mod</span><span><i style="background:var(--bad)"></i>High</span></span>
                  </button>
                </div>
                <div class="mapinfo" id="mapInfo"></div>
              </section>

              <div id="lineView" hidden>
                <section class="status" id="status"></section>
                <section class="fleet" id="fleet"></section>
                <div id="notice"></div>
                <div id="trainInfo"><p class="hint">Tap a train to see where it's heading.</p></div>
                <p class="cw-note" id="cwNote" hidden></p>
                <div class="legend"><span id="lgA">↓ Lane 1</span><span id="lgB">Lane 2 ↑</span></div>
                <div class="board" id="board"></div>
              </div>
            </main>

            <main id="viewUpdates" hidden>
              <div class="upd">
                <section class="card" id="officialCard"></section>
                <section class="card">
                  <h2>News reports</h2>
                  <p class="muted" id="newsNote">News about Singapore's MRT, LRT and rail from the past week.</p>
                  <ul class="news" id="newsList" style="margin-top:10px"></ul>
                </section>
                <section class="card">
                  <h2>Official channels</h2>
                  <p class="muted" style="margin-bottom:10px">SMRT, SBS Transit and LTA post service updates on these accounts. Opens in the X or Facebook app, or your browser.</p>
                  <div class="links">
                    <a href="https://x.com/SMRT_Singapore" target="_blank" rel="noopener">SMRT on X<span>NSL, EWL, CCL, TEL, Bukit Panjang LRT</span></a>
                    <a href="https://x.com/SBSTransit_Ltd" target="_blank" rel="noopener">SBS Transit on X<span>NEL, DTL, Sengkang–Punggol LRT</span></a>
                    <a href="https://x.com/LTAsg" target="_blank" rel="noopener">LTA on X<span>Land Transport Authority</span></a>
                    <a href="https://www.facebook.com/SMRTCorpSG" target="_blank" rel="noopener">SMRT on Facebook<span>Service updates and advisories</span></a>
                    <a href="https://www.facebook.com/SBSTransit" target="_blank" rel="noopener">SBS Transit on Facebook<span>Service updates and advisories</span></a>
                    <a href="https://www.smrt.com.sg/news-publications/newsroom/service-announcements/" target="_blank" rel="noopener">SMRT announcements<span>smrt.com.sg</span></a>
                  </div>
                </section>
                <section class="card" id="settingsCard"></section>
              </div>
