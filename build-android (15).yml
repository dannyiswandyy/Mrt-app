             (weekdays: 6 Nov 2026; Saturdays: 7 Nov 2026; Sundays: 1 Nov 2026). [from minute of the day, trains].
             Full-day trains run all day, (AM) ones join for the 7–9:30am peak, (PM) ones for the 5–8pm peak,
             LN ones stay out late at night, and HD (half-day) ones are taken as running until 2pm. */
          const NSL_TRAINS = {
