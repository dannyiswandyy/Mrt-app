            C801A: {lines: ["BP"], maker: "Bombardier (Innovia APM 100)", fleet: "13 cars", from: "2015",
              story: "A second batch of cars, delivered in 2014. Unlike the original C801 cars, they're being refurbished and kept as part of the line's renewal."},
            C801B: {lines: ["BP"], maker: "Alstom (Innovia APM 300R, ordered from Bombardier)", fleet: "19 cars", from: "2024",
              story: "New cars from the 2018 renewal contract, which also brought new signalling. They replaced the original C801 cars."},
            C810: {lines: ["SE", "SW", "PE", "PW"], maker: "Mitsubishi Heavy Industries (Crystal Mover)", fleet: "41 cars", from: "2003-01-18",
              story: "The original Sengkang and Punggol LRT cars, in service since the Sengkang East Loop opened in January 2003. They are being replaced by the C810D."},
            C810A: {lines: ["SE", "SW", "PE", "PW"], maker: "Mitsubishi Heavy Industries (Crystal Mover)", fleet: "16 cars", from: "2016",
              story: "A second batch of Crystal Mover cars, in service from 2016."},
            "Hitachi Monorail": {lines: ["SEN"], maker: "Hitachi Asia (small-type straddle monorail)", fleet: "7 two-car trains", from: "2007-01-15",
              story: "Each of the seven trains has its own colour: green, orange, blue, purple, pink, red and yellow. Four ran from opening day in 2007, the pink and red trains joined in December 2009, and the yellow one in November 2017. Since 2017 they run on Hitachi's wireless signalling, which lets them drive themselves with an attendant on board.",
              timeline: [["2007-01-15", "First four trains enter service"], ["2009-12-01", "Pink and red trains added"], ["2017-11-24", "Yellow train added"]]},
            "RTS train": {lines: ["RTS"], maker: "CRRC Zhuzhou Locomotive", fleet: "8 four-car trains", from: "", soon: "February 2027",
              story: "Driverless four-car trains built in China by CRRC Zhuzhou Locomotive. The first was unveiled at the Singapore Rail Test Centre on 30 June 2025 and tested in Singapore, while the other seven were tested at the Wadi Hana depot in Johor Bahru.",
              timeline: [["2025-06-30", "First train unveiled in Singapore"], ["2026-02", "First train reaches Woodlands North for testing"]]},
            C810D: {lines: ["SE", "SW", "PE", "PW"], maker: "Mitsubishi Heavy Industries (Crystal Mover)", fleet: "25 two-car trains", from: "2025-07-15",
              story: "The third generation of Sengkang and Punggol LRT trains. 17 two-car trains were ordered in February 2022 for S$439 million and 8 more in May 2023. The first carried passengers on 15 July 2025."}
          };

          /* Station stories: where the name comes from, and anything notable. */
          const H_STN = {
            "VivoCity": "On Level 3 of VivoCity mall, linked to HarbourFront MRT. It was called Sentosa station until 1 April 2019. Fares are only charged here, for trips onto the island.",
            "Resorts World": "Built as Waterfront station, it stayed shut when the line opened in 2007, was rebuilt for the Resorts World Sentosa resort and opened on 1 February 2010. It took its current name on 1 April 2019.",
            "Imbiah": "Named after Imbiah Lookout, the cluster of attractions in central Sentosa. It connects with the Singapore Cable Car.",
            "Beach": "Between Siloso and Palawan beaches, with the line's depot next to it. A new platform for getting off trains opened in November 2023.",
            "Bukit Chagar": "Named after the Bukit Chagar neighbourhood to its south. It will be Johor's first rapid transit station, linked by a 400 m walkway to JB Sentral and its KTM trains. Both countries' border checks for trips to Singapore happen here.",
            "Woodlands North": "Its Thomson-East Coast Line station opened on 31 January 2020. Next to it, the RTS Link station and Singapore's border checkpoint building were completed in September 2026, joined to the Thomson-East Coast Line by an underground concourse.",
            "Jurong East": "An interchange between the North-South and East-West lines. A new platform and track were added in 2011 to handle more trains.",
            "Choa Chu Kang": "Named after the Chua clan's riverside settlement under the 19th-century kangchu system, in which 'kang' meant river.",
            "Yew Tee": "Named after the old Yew Tee village.",
            "Kranji": "Named after the kranji tree. Nearby is the Kranji War Cemetery.",
            "Admiralty": "Named after Admiralty Road, which dates from the British naval base in Sembawang.",
            "Sembawang": "Named after the sembawang tree.",
            "Canberra": "Named after Canberra Road, itself named after Australia's capital. It's an infill station, built between Sembawang and Yishun while trains kept running.",
            "Yishun": "Yishun is the Mandarin form of Nee Soon, after Lim Nee Soon, a rubber and pineapple businessman who owned land here.",
            "Khatib": "Named after nearby Khatib Bongsu. A 'khatib' is a preacher at a mosque.",
            "Yio Chu Kang": "A kangchu name: the Yeo clan's riverside settlement. It was one of the first five MRT stations.",
            "Ang Mo Kio": "Hokkien for 'red-haired man's bridge', after a bridge often credited to a European engineer. One of the first five MRT stations.",
            "Bishan": "Named after Peck San Theng, a large Cantonese cemetery that once covered the area. One of the first five MRT stations, next to Bishan depot.",
            "Braddell": "Named after Braddell Road, after Thomas Braddell, the first Attorney-General of the Straits Settlements. One of the first five MRT stations.",
            "Toa Payoh": "Means 'big swamp', from Hokkien 'toa' (big) and Malay 'paya' (swamp). One of the first five MRT stations, and the southern end of the very first MRT stretch.",
            "Novena": "Named after Novena Church, famous for its weekly novena prayers.",
            "Orchard": "Orchard Road was named after the nutmeg and pepper plantations that lined it in the 1800s.",
            "Dhoby Ghaut": "Indian washermen ('dhobi') once washed clothes in a stream here; a 'ghaut' is a set of steps down to water. Three lines meet here.",
            "City Hall": "Named after the old City Hall, now part of National Gallery Singapore.",
            "Raffles Place": "Named after Sir Stamford Raffles. It was Singapore's main business square long before the MRT.",
            "Marina Bay": "When it opened in 1989, the North-South Line began running on its own. The Circle Line (2012) and Thomson-East Coast Line (2022) joined later.",
            "Marina South Pier": "Opened in 2014 next to the ferry terminal for Singapore's southern islands.",
            "Tampines": "Named after the tempinis tree, a hardwood that grew in the area.",
            "Tanah Merah": "Malay for 'red earth', after the red cliffs along the old coastline. Trains for Changi Airport branch off here.",
            "Bedok": "A popular explanation links the name to the 'bedoh', a drum once used to call people to prayer.",
            "Eunos": "Named after Mohamed Eunos Abdullah, known as the father of Malay journalism.",
            "Paya Lebar": "Malay for 'wide swamp'.",
            "Aljunied": "Named after Syed Sharif Omar Aljunied, an Arab merchant and philanthropist in early Singapore.",
            "Kallang": "Named after the Orang Kallang, a sea people who lived around the Kallang River.",
            "Lavender": "Lavender Street's name is said to be a joke: the area once had a strong smell from nearby sewage works.",
            "Bugis": "Named after the Bugis, seafaring traders from Sulawesi who settled in the area.",
            "Tanjong Pagar": "Malay for 'cape of stakes', linked to the legend of fishermen building barricades against swordfish attacks.",
            "Outram Park": "Named after Outram Road, after Sir James Outram, a British general in India. Three lines meet here.",
            "Tiong Bahru": "Means 'new cemetery', from Hokkien 'tiong' (grave) and Malay 'baru' (new).",
            "Redhill": "From Bukit Merah, Malay for 'red hill', which legend says was stained by the blood of a boy who saved Singapore from swordfish.",
            "Queenstown": "Singapore's first satellite town, named in 1953 to mark Queen Elizabeth II's coronation.",
            "Commonwealth": "Named after Commonwealth Avenue, after the Commonwealth of Nations.",
            "Buona Vista": "Italian for 'good view'.",
            "Dover": "The MRT's first infill station, opened in 2001 between Buona Vista and Clementi while trains kept running.",
            "Clementi": "Named after Sir Cecil Clementi, Governor of the Straits Settlements from 1930 to 1934.",
            "Chinese Garden": "Next to the Chinese Garden, which opened in 1975.",
            "Lakeside": "Next to Jurong Lake.",
            "Boon Lay": "Named after Chew Boon Lay, a landowner in Jurong. It was the end of the original MRT system when it opened in 1990.",
            "Expo": "Serves the Singapore Expo exhibition centre. It opened in 2001, a year before the airport station.",
            "Changi Airport": "Opened in February 2002, giving the airport its first rail link.",
            "HarbourFront": "Next to the HarbourFront ferry terminal and the cable car to Sentosa.",
            "Clarke Quay": "Named after Sir Andrew Clarke, Governor of the Straits Settlements in the 1870s.",
            "Farrer Park": "Named after Roland Farrer, a president of Singapore's Municipal Commission.",
            "Boon Keng": "Named after Lim Boon Keng, a doctor and social reformer.",
            "Potong Pasir": "Malay for 'cut sand', after sand quarrying in the area. During planning, the station was called Sennett.",
            "Woodleigh": "Kept shut when the North East Line opened in 2003 because few people lived nearby. It opened in June 2011.",
            "Hougang": "Teochew for 'back of the river', after the old settlement along Sungei Serangoon.",
            "Buangkok": "Kept shut when the North East Line opened because few people lived nearby. In 2005 residents protested with cardboard white elephants, and it opened on 15 January 2006.",
            "Sengkang": "Its LRT platforms opened on 18 January 2003, five months before the North East Line platforms.",
            "Bras Basah": "Malay for 'wet rice', from when rice from boats was laid out to dry along the river. The station's roof is a shallow reflecting pool.",
            "Nicoll Highway": "Named after Sir John Nicoll, a Governor of Singapore. In April 2004, tunnels being built nearby collapsed, killing four people; the station was rebuilt about 100 m away.",
            "Stadium": "Serves the National Stadium and Singapore Sports Hub.",
            "Mountbatten": "Named after Lord Louis Mountbatten, who accepted the Japanese surrender in Singapore in 1945.",
            "Dakota": "Named after Dakota Crescent, which recalls the Dakota planes at the old Kallang Airport nearby.",
            "Caldecott": "Planned under the name Thomson. It became a Thomson-East Coast Line interchange in 2021.",
            "Botanic Gardens": "Next to the Singapore Botanic Gardens, a UNESCO World Heritage Site.",
            "one-north": "Named after Singapore's position about one degree north of the equator.",
            "Kent Ridge": "Named to mark the Duke of Kent's visit in 1952.",
            "Haw Par Villa": "Named after the Haw Par Villa theme park, built by the Tiger Balm brothers. It was planned under the name West Coast.",
            "Pasir Panjang": "Malay for 'long beach'.",
            "Telok Blangah": "Malay for 'bay of cooking pots'.",
            "Keppel": "Named after Keppel Harbour, after Admiral Henry Keppel. Opened in July 2026 with Stage 6, which completed the Circle Line.",
            "Cantonment": "Named after Cantonment Road, where Indian troops were once stationed; a cantonment is a military camp. Opened in July 2026.",
            "Prince Edward Road": "Opened in July 2026 with Stage 6. Planned as Prince Edward, it was renamed after a public poll in 2017.",
            "Promenade": "One of Singapore's deepest stations, where the Circle and Downtown lines meet.",
            "Hume": "Singapore's first underground infill station, built between Hillview and Beauty World and opened on 28 February 2025.",
            "Beauty World": "Named after the Beauty World amusement park that stood here in the 1940s.",
            "Tan Kah Kee": "Named after Tan Kah Kee, a businessman and philanthropist who founded Hwa Chong, the school next to the station.",
            "Telok Ayer": "Malay for 'water bay'. Telok Ayer Street once ran along Singapore's shoreline.",
            "Fort Canning": "Named after Fort Canning Hill, after Viscount Charles Canning, Governor-General of India.",
            "Bencoolen": "Named after Bencoolen (now Bengkulu) in Sumatra, where Raffles was Lieutenant-Governor when he founded Singapore. At 43 m underground, it's one of Singapore's deepest stations.",
            "Jalan Besar": "Malay for 'big road'.",
            "Kaki Bukit": "Malay for 'foot of the hill'.",
            "Sungei Bedok": "Malay for 'Bedok River'. It opens on 26 December 2026 as an interchange between the Downtown and Thomson-East Coast lines.",
            "Xilin": "Opens on 26 December 2026 with the Downtown Line 3 Extension.",
            "Bedok South": "Opens on 26 December 2026 with Thomson-East Coast Line Stage 5.",
            "Woodlands": "The North-South Line station opened in 1996 with the Woodlands Extension. The Thomson-East Coast Line arrived in 2020.",
            "Upper Thomson": "Thomson Road is named after John Turnbull Thomson, a Government Surveyor in the 1800s.",
            "Great World": "Named after the Great World amusement park that stood nearby from 1931 to 1978.",
            "Havelock": "Named after Havelock Road, after Sir Henry Havelock, a British general.",
            "Shenton Way": "Named after Sir Shenton Thomas, Governor of the Straits Settlements during the Second World War.",
            "Tanjong Rhu": "Malay for 'cape of casuarina trees'.",
            "Marine Parade": "Built on land reclaimed from the sea in the 1960s and 70s.",
            "Petir": "Malay for 'thunder'. Many Bukit Panjang LRT stations take Malay words from local street names.",
            "Pending": "Malay for 'belt buckle'.",
            "Bangkit": "Malay for 'rise'.",
            "Fajar": "Malay for 'dawn'.",
            "Segar": "Malay for 'fresh'.",
            "Jelapang": "Malay for 'granary'.",
            "Senja": "Malay for 'dusk'.",
            "Rumbia": "Malay for the sago palm.",
            "Bakau": "Named after bakau, a mangrove wood used for building foundations.",
            "Kangkar": "Named after a former fishing village in the area.",
            "Ranggung": "Named after a stork that lived on the Punggol shore.",
            "Kupang": "Malay for 'mussel', after the mussel fishing once done here. Opened in 2015, ten years after the rest of the West Loop.",
            "Layar": "Malay for 'sail'.",
            "Tongkang": "Named after the tongkang, a small cargo boat.",
            "Renjong": "Malay for 'tall'.",
            "Farmway": "Opened in 2007, almost three years after the rest of the West Loop.",
            "Cheng Lim": "Opened on 1 January 2013, when West Loop trains also began running both ways all day.",
            "Kadaloor": "Tamil for 'seaside town'.",
            "Damai": "Malay for 'peaceful'. When it opened in 2011, East Loop trains began running both ways.",
            "Sam Kee": "Named after a former village in the area.",
            "Teck Lee": "Named after Lim Teck Lee. The last Punggol LRT station to open, on 15 August 2024, serving the Punggol Digital District.",
            "Punggol Point": "Named after nearby Punggol Point, on the northeast coast.",
            "Samudera": "Means 'sea'.",
            "Nibong": "Named after nibong palm poles, used to build Malay village houses.",
            "Sumang": "Named after Wak Sumang, said to have founded Punggol village.",
            "Soo Teck": "Named after a former primary school nearby.",
            "Riviera": "Named for the area's seaside theme.",
            "Oasis": "Linked directly to Oasis Terraces and Punggol Polyclinic. It opened in 2007, two years after the rest of the East Loop."
          };

          /* ---- History tab and the history card (a sheet that slides up) ---- */
          const H_MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun", "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];
          function hDate(d){                       // "1987-11-07" → "7 Nov 1987", "2005-08" → "Aug 2005", "2007" → "2007"
            const [y, m, dd] = String(d).split("-");
            return dd ? `${+dd} ${H_MONTHS[m - 1]} ${y}` : m ? `${H_MONTHS[m - 1]} ${y}` : y;
          }
          const H_ORDER = ["NSL", "EWL", "CG", "NEL", "CCL", "DTL", "TEL", "BP", "SK", "PG", "SEN", "RTS"];
          const hCodes = k => k === "SK" ? ["SE", "SW"] : k === "PG" ? ["PE", "PW"] : [k];
          const hColor = k => hCodes(k)[0];
          const hLabel = k => ({CG: "CGL", BP: "BPLRT", SK: "SKLRT", PG: "PGLRT", SE: "SKLRT", SW: "SKLRT", PE: "PGLRT", PW: "PGLRT", RTS: "RTS", SEN: "SENTOSA"})[k] || k;
          const hChipLine = k => `<span class="code" style="background:var(--${hColor(k)})">${hLabel(k)}</span>`;
          function hStations(k){
            const seen = new Map();
            for (const c of hCodes(k)) for (const s of LINES[c].stations) if (!seen.has(s[0])) seen.set(s[0], s);
            return [...seen.values()];
          }
          const hSoon = d => d > sgNow().iso;
          /* Every station name, with its codes (deduplicated), A–Z. */
          const H_NAMES = Object.keys(byName).sort((a, b) => a.localeCompare(b));
          function hCodesOf(name){
            const out = [], seen = new Set();
            for (const [line, code] of byName[name] || []) if (!seen.has(code)){ seen.add(code); out.push([line, code]); }
            return out;
          }
          function hStatus(m){
            const M = H_MODEL[m];
            if (M.soon) return ["Not in service yet", "warn"];
            if (M.until) return ["Retired", "old"];
            const f = Object.values(FLEET).flat().find(x => x[0] === m);
            if (f && /retir/.test(f[5] || "")) return ["Being retired", "warn"];
            if (f && f[5] === "new") return ["Newest", "new"];
            return ["In service", ""];
          }

          /* ---- the three kinds of card ---- */
          function lineCard(k){
            const H = H_LINE[k], st = hStations(k), soonList = st.filter(s => s[2] && hSoon(s[2])), soon = soonList.length, firstSoon = soonList[0];
            const fleet = FLEET[hColor(k)] || [];
            const tl = H.timeline.map(([d, e]) => `<li class="${hSoon(d) ? "up" : ""}"><span class="d">${hDate(d)}</span><span class="e">${esc(e)}</span></li>`).join("");
            return {color: hColor(k), kicker: `${hChipLine(k)} Line history`, title: H.name, body: `
              <div class="hfacts">
                <div><span>${hSoon(H.opened) ? "Opens" : "Opened"}</span><b>${hDate(H.opened)}${hSoon(H.opened) ? " <small>(expected)</small>" : ""}</b></div>
                <div><span>Run by</span><b>${esc(H.op)}</b></div>
                <div><span>Stations</span><b>${soon === st.length ? `${st.length} <small>not open yet</small>` : `${st.length - soon}${soon ? ` <small>+${soon} ${firstSoon[2] === "TBA" ? "later" : "on " + hDate(firstSoon[2])}</small>` : ""}`}</b></div>
                <div><span>Driverless</span><b>${typeof H.auto === "string" ? esc(H.auto) : H.auto ? "Yes" : "No, a train captain is on board"}</b></div>
              </div>
              <div class="hstory">${H.story.map(p => `<p>${esc(p)}</p>`).join("")}${H.future ? `<p class="muted">${esc(H.future)}</p>` : ""}</div>
              <div><h3 class="hsub">Trains</h3><div class="hchips">${fleet.map(f => `<button type="button" class="hchip" data-h="model:${f[0]}">${esc(f[0])} ›</button>`).join("")}${(H.past || []).map(m => `<button type="button" class="hchip old" data-h="model:${m}">${esc(m)} · retired ›</button>`).join("")}</div></div>
              <div><h3 class="hsub">Timeline</h3><ol class="tl">${tl}</ol></div>
              <details class="hall"><summary>All ${st.length} stations</summary><div class="hchips">${st.map(s => `<button type="button" class="hchip" data-h="station:${esc(s[1])}"><span class="code sm" style="background:var(--${hColor(k)})">${esc(s[0])}</span>${esc(s[1])}</button>`).join("")}</div></details>`};
          }
          function modelCard(m){
            const M = H_MODEL[m], [status, cls] = hStatus(m);
            const f = Object.values(FLEET).flat().find(x => x[0] === m);
            const keys = [...new Set(M.lines.map(H_KEY))];
            return {color: hColor(keys[0]), kicker: `${keys.map(hChipLine).join(" ")} Train model`, title: m, body: `
              <div><span class="hstat ${cls}">${status}</span></div>
              <div class="hfacts">
                <div><span>Built by</span><b>${esc(M.maker)}</b></div>
                <div><span>Fleet</span><b>${esc(M.fleet)}</b></div>
                <div><span>In service</span><b>${M.soon ? `Not yet <small>(expected ${esc(M.soon)})</small>` : `${M.from ? hDate(M.from) : "Not stated"}${M.until ? ` to ${hDate(M.until)}` : " to now"}`}</b></div>
                ${f && f[6] ? `<div><span>Numbers</span><b>${esc(f[6])}</b></div>` : ""}
              </div>
              <div class="hstory"><p>${esc(M.story)}</p></div>
              ${M.timeline ? `<div><h3 class="hsub">Timeline</h3><ol class="tl">${M.timeline.map(([d, e]) => `<li><span class="d">${hDate(d)}</span><span class="e">${esc(e)}</span></li>`).join("")}</ol></div>` : ""}
              <div><h3 class="hsub">${M.until ? "Ran on" : "Runs on"}</h3><div class="hchips">${keys.map(k => `<button type="button" class="hchip" data-h="line:${k}">${hChipLine(k)} ${esc(H_LINE[k].name)} ›</button>`).join("")}</div></div>
              <p class="muted">Sources: SGTrains (sgtrains.com), Wikipedia, Land Transport Guru.</p>`};
          }
          function stationCard(name){
            const codes = hCodesOf(name);
            const opens = codes.map(([line, code]) => ({line, code, ...(H_OPEN[code] || {})})).sort((a, b) => String(a.date).localeCompare(String(b.date)));
            const rows = opens.map(o => `<li class="${o.date && hSoon(o.date) ? "up" : ""}"><span class="d">${o.date ? hDate(o.date) : "–"}</span>
                <span class="e"><span class="code sm" style="background:var(--${o.line})">${esc(o.code)}</span> ${o.date && hSoon(o.date) ? "Opens" : "Opened"} ${esc(o.how || "with its line")}</span></li>`).join("");
            const keys = [...new Set(codes.map(([l]) => H_KEY(l)))];
            const firsts = [...new Set(opens.map(o => o.date))];
            let ix = "";
            if (keys.length > 1 && firsts.length > 1){
              const second = opens.find(o => o.date === firsts[1]);
              ix = `<p>${hSoon(second.date) ? "Becomes" : "Became"} an interchange ${/^\d{4}-\d\d-\d\d$/.test(second.date) ? "on" : "in"} ${hDate(second.date)}, when the ${esc(H_LINE[H_KEY(second.line)].name)} ${hSoon(second.date) ? "arrives" : "arrived"}.</p>`;
            }
            const story = H_STN[name];
            return {color: codes[0][0], kicker: `${codes.map(([l, c]) => `<span class="code sm" style="background:var(--${l})">${esc(c)}</span>`).join("")} Station history`, title: name, body: `
              ${story || ix ? `<div class="hstory">${story ? `<p>${esc(story)}</p>` : ""}${ix}</div>` : ""}
              <div><h3 class="hsub">Opening</h3><ol class="tl">${rows}</ol></div>
              <div><h3 class="hsub">Lines here</h3><div class="hchips">${keys.map(k => `<button type="button" class="hchip" data-h="line:${k}">${hChipLine(k)} ${esc(H_LINE[k].name)} ›</button>`).join("")}</div></div>
              <p><button type="button" class="btn ghost" data-h="map:${esc(name)}">Show on map</button></p>`};
          }

          /* ---- the sheet ---- */
          const hStack = [];
          function hRender(){
            const top = hStack[hStack.length - 1];
            const open = !!top;
            $("sheet").hidden = $("sheetBg").hidden = !open;
            document.body.classList.toggle("sheet-open", open);
            if (!open) return;
            const [kind, id] = top;
            const r = kind === "line" ? lineCard(id) : kind === "model" ? modelCard(id) : stationCard(id);
            $("sheet").style.setProperty("--c", `var(--${r.color})`);
            $("sheetKicker").innerHTML = r.kicker;
            $("sheetTitle").textContent = r.title;
            $("sheetBody").innerHTML = r.body;
            $("sheetBack").hidden = hStack.length < 2;
            $("sheetBody").scrollTop = 0;
          }
          function hOk(kind, id){
            return kind === "line" ? !!H_LINE[id] : kind === "model" ? !!H_MODEL[id] : kind === "station" ? !!byName[id] : false;
          }
          /* Opens a history card from anywhere in the app. */
          function histOpen(kind, id){
            if (!hOk(kind, id)) return;
            hStack.length = 0; hStack.push([kind, id]); hRender();
            setTimeout(() => $("sheetX").focus(), 50);
          }
          function histClose(){ hStack.length = 0; hRender(); }
          $("sheetBody").addEventListener("click", e => {
            const b = e.target.closest("[data-h]"); if (!b) return;
            const i = b.dataset.h.indexOf(":"), kind = b.dataset.h.slice(0, i), id = b.dataset.h.slice(i + 1);
            if (kind === "map"){
              histClose(); showView("trains");
              if (!isDesktop()) setTrainView("map");
              setTimeout(() => window.mapFocus && mapFocus(id), 60);
              return;
            }
            if (hOk(kind, id)){ hStack.push([kind, id]); hRender(); }
          });
          $("sheetX").onclick = histClose;
          $("sheetBg").onclick = histClose;
          $("sheetBack").onclick = () => { hStack.pop(); hRender(); };
          document.addEventListener("keydown", e => { if (e.key === "Escape" && hStack.length) histClose(); });
          /* Android's back button: close the card (or go back a step), then return to the tracker, then leave the app. */
          window.appBack = () => {
            if (hStack.length){ hStack.length > 1 ? (hStack.pop(), hRender()) : histClose(); return true; }
            if (curView !== "trains"){ showView("trains"); return true; }
            return false;
          };

          /* ---- the History tab ---- */
